<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Darwin Simulation</title>
  <link rel="icon" type="image/png" href="/SciSims/favicon.png">

  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --text: #1f2937;
      --muted: #64748b;
      --line: #dbe3ef;
      --button: #2563eb;
      --button-hover: #1d4ed8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .page {
      width: 98vw;
      max-width: none;
      margin: 0 auto;
      padding: 10px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .home-link {
      display: inline-block;
      color: var(--button);
      text-decoration: none;
      font-weight: 700;
    }

    .home-link:hover {
      text-decoration: underline;
    }

    .fullscreen-button {
      border: none;
      border-radius: 10px;
      background: var(--button);
      color: white;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .fullscreen-button:hover {
      background: var(--button-hover);
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
    }

    h1 {
      margin: 0 0 8px 0;
      font-size: 1.8rem;
    }

    p {
      margin: 0 0 12px 0;
      line-height: 1.45;
    }

    .swf-wrap {
      width: 100%;
      height: calc(100vh - 150px);
      min-height: 620px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      margin-top: 10px;
    }

    embed {
      width: 100%;
      height: 100%;
      display: block;
    }

    .note {
      color: var(--muted);
      font-size: 0.95rem;
      margin-top: 10px;
      margin-bottom: 0;
    }

    .swf-wrap:fullscreen {
      width: 100vw;
      height: 100vh;
      border-radius: 0;
    }

    .swf-wrap:fullscreen embed {
      width: 100%;
      height: 100%;
    }

    @media (max-width: 700px) {
      .page {
        width: 100vw;
        padding: 6px;
      }

      h1 {
        font-size: 1.45rem;
      }

      .panel {
        padding: 10px;
        border-radius: 12px;
      }

      .swf-wrap {
        height: calc(100vh - 170px);
        min-height: 480px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="top-bar">
      <a class="home-link" href="/SciSims/">← Back to main SciSims page</a>
      <button class="fullscreen-button" onclick="openFullscreen()">Full screen</button>
    </div>

    <section class="panel">
      <h1>Darwin Simulation</h1>
      <p>This page uses Ruffle to run the original Flash SWF file in a modern browser.</p>

      <div class="swf-wrap" id="swfBox">
        <embed src="darwin.swf">
      </div>

      <p class="note">
        If the simulation does not load, wait a few seconds and refresh the page. Some older Flash files may only partly work in Ruffle.
      </p>
    </section>
  </main>

  <script>
    function openFullscreen() {
      const swfBox = document.getElementById("swfBox");

      if (swfBox.requestFullscreen) {
        swfBox.requestFullscreen();
      } else if (swfBox.webkitRequestFullscreen) {
        swfBox.webkitRequestFullscreen();
      } else if (swfBox.msRequestFullscreen) {
        swfBox.msRequestFullscreen();
      }
    }
  </script>
</body>
</html>
