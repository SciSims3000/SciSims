n this course.|The process of separating a vector into perpendicular components."]],["Advanced Mechanics — Structures and systems",["Initial velocity|Define Initial velocity.|The velocity of an object at the chosen starting time.","Launch angle|Explain the scientific significance of Launch angle.|The angle between the initial velocity vector and the horizontal.","Launch height|Apply Launch height to a relevant scientific scenario.|The vertical position from which a projectile begins its motion.","Time of flight|Analyse how Time of flight contributes to explaining or investigating a system.|The total time a projectile remains in motion before reaching its final height.","Maximum height|Evaluate the role, usefulness or limitations of Maximum height in this course.|The greatest vertical displacement reached by a projectile."]],["Advanced Mechanics — Processes",["Horizontal range|Define Horizontal range.|The horizontal displacement of a projectile from launch to landing.","Trajectory|Explain the scientific significance of Trajectory.|The path followed by a moving object.","Parabolic trajectory|Apply Parabolic trajectory to a relevant scientific scenario.|The ideal curved path of a projectile when air resistance is neglected and gravity is uniform.","Acceleration due to gravity|Analyse how Acceleration due to gravity contributes to explaining or investigating a system.|The downward acceleration produced by a gravitational field near a planetary surface.","Constant horizontal velocity|Evaluate the role, usefulness or limitations of Constant horizontal velocity in this course.|The ideal projectile condition produced when no horizontal force acts."]],["Advanced Mechanics — Evidence and applications",["Zero vertical velocity|Define Zero vertical velocity.|The vertical-velocity condition at the highest point of an ideal projectile path.","Air resistance|Explain the scientific significance of Air resistance.|A drag force exerted by air that opposes relative motion.","Uniform c  and fields.","Positive charge|Explain the scientific significance of Positive charge.|The type of charge carried by a proton.","Negative charge|Apply Negative charge to a relevant scientific scenario.|The type of charge carried by an electron.","Electric field|Analyse how Electric field contributes to explaining or investigating a system.|A region in which an electric charge experiences a force.","Electric field strength|Evaluate the role, usefulness or limitations of Electric field strength in this course.|Electric force per unit positive test charge."]],["Electromagnetism — Structures and systems",["Uniform electric field|Define Uniform electric field.|An electric field with constant magnitude and direction across a region.","Parallel plates|Explain the scientific significance of Parallel plates.|Two oppositely charged conducting plates used to create an approximately uniform electric field.","Electric force|Apply Electric force to a relevant scientific scenario.|The force experienced by a charge in an electric field.","Potential difference|Analyse how Potential difference contributes to explaining or investigating a system.|Work done per unit charge in moving between two points.","Work done on a charge|Evaluate the role, usefulness or limitations of Work done on a charge in this course.|Energy transferred when an electric force moves a charge through a potential difference."]],["Electromagnetism — Processes",["Charged-particle acceleration|Define Charged-particle acceleration.|Acceleration produced when an electric or magnetic force acts on a charged particle.","Electric-field trajectory|Explain the scientific significance of Electric-field trajectory.|The path of a charged particle accelerated by an electric field.","Magnetic field|Apply Magnetic field to a relevant scientific scenario.|A region in which moving charges, currents or magnetic materials experience magnetic effects.","Magnetic flux density|Analyse how Magnetic flux density contributes to explaining or investigating a system.|A measure of magnetic-field strength, represented by B and measured in tesla.","Magnetic flux|Evaluate the role, usefulness or limitations of Magnetic flux in this course.|The amount of magnetic field passing through a surface."]],["Electromagnetism — Evidence and applications",["Magnetic force on a charge|Define Magnetic force on a charge.|A force perpendicular to both the velocity of a moving charge and the magnetic field.","Lorentz force|Explain the scientific significance of Lorentz force.|The combined electric and magnetic force acting on a charged particle.","Right-hand rule|Apply Right-hand rule to a relevant scientific scenario.|A directional rule used to relate current, magnetic field and force for positive conventional current.","Circular path in a magnetic field|Analyse how Circular path in a magnetic field contributes to explaining or investigating a system.|The trajectory of a charge moving perpendicular to a uniform magnetic field.","Helical path|Evaluate the role, usefulness or limitations of Helical path in this course.|The spiral trajectory of a charged particle with velocity components parallel and perpendicular to a magnetic field."]],["Electromagnetism — Analysis",["Motor effect|Define Motor effect.|The force on a current-carrying conductor placed in a magnetic field.","Current-carrying conductor|Explain the scientific significance of Current-carrying conductor.|A conductor through which electric charge is flowing.","Maximum motor force|Apply Maximum motor force to a relevant scientific scenario.|The force condition occurring when current is perpendicular to the magnetic field.","Zero motor force|Analyse how Zero motor force contributes to explaining or investigating a system.|The force condition occurring when current is parallel to the magnetic field.","Force between parallel wires|Evaluate the role, usefulness or limitations of Force between parallel wires in this course.|Magnetic interaction causing parallel currents to attract and opposite currents to repel."]],["Electromagnetism — Synthesis and evaluation",["Ampere|Define Ampere.|The SI unit of electric current.","Electric current|Explain the scientific significance of Electric current.|The rate of flow of electric charge.","DC motor|Apply DC motor to a relevant scientific scenario.|A device that converts direct-current electrical energy into rotational mechanical energy.","Armature|Analyse how Armature contributes to explaining or investigating a system.|The rotating coil or current-carrying part of a motor or generator.","Split-ring commutator|Evaluate the role, usefulness or limitations of Split-ring commutator in this course.|A rotating contact that reverses current every half-turn in a simple DC motor."]]],"m7":[["The Nature of Light — Foundations",["Electromagnetic wave|Define Electromagnetic wave.|A self-propagating wave of oscillating electric and magnetic fields.","Electromagnetic spectrum|Explain the scientific significance of Electromagnetic spectrum.|The full range of electromagnetic radiation arranged by frequency or wavelength.","Radio wave|Apply Radio wave to a relevant scientific scenario.|Low-frequency, long-wavelength electromagnetic radiation.","Microwave|Analyse how Microwave contributes to explaining or investigating a system.|Electromagnetic radiation used in communication, radar and heating.","Infrared radiation|Evaluate the role, usefulness or limitations of Infrared radiation in this course.|Electromagnetic radiation associated with thermal emission and molecular vibration."]],["The Nature of Light — Structures and systems",["Visible light|Define Visible light.|The part of the electromagnetic spectrum detectable by the human eye.","Ultraviolet radiation|Explain the scientific significance of Ultraviolet radiation.|Electromagnetic radiation with higher frequency than visible violet light.","X-ray|Apply X-ray to a relevant scientific scenario.|High-frequency electromagnetic radiation capable of penetrating matter and ionising atoms.","Gamma radiation|Analyse how Gamma radiation contributes to explaining or investigating a system.|Very high-frequency electromagnetic radiation commonly emitted in nuclear processes.","Maxwell’s equations|Evaluate the role, usefulness or limitations of Maxwell’s equations in this course.|Equations unifying electric and magnetic fields and predicting electromagnetic waves."]],["The Nature of Light — Processes",["Speed of light|Define Speed of light.|The invariant speed c of electromagnetic radiation in vacuum.","Oscillating electric field|Explain the scientific significance of Oscillating electric field.|A changing electric field forming one component of an electromagnetic wave.","Oscillating magnetic field|Apply Oscillating magnetic field to a relevant scientific scenario.|A changing magnetic field perpendicular to the electric field in an electromagnetic wave.","Transverse wave|Analyse how Transverse wave contributes to explaining or investigating a system.|A wave whose oscillations are perpendicular to the direction of propagation.","Wavefront|Evaluate the role, usefulness or limitations of Wavefront in this course.|A surface joining points of a wave that are in the same phase."]],["The Nature of Light — Evidence and applications",["Wavelength|Define Wavelength.|The distance between corresponding points on successive waves.","Frequency|Explain the scientific significance of Frequency.|The number of oscillations or cycles per second.","Photon|Apply Photon to a relevant scientific scenario.|A quantum of electromagnetic radiation with energy proportional to frequency.","Spectrum|Analyse how Spectrum contributes to explaining or investigating a system.|The distribution of radiation intensity across wavelength or frequency.","Continuous spectrum|Evaluate the role, usefulness or limitations of Continuous spectrum in this course.|An uninterrupted range of wavelengths emitted by a dense hot source."]],["The Nature of Light — Analysis",["Emission spectrum|Define Emission spectrum.|Bright lines or bands at wavelengths emitted by excited atoms or molecules.","Absorption spectrum|Explain the scientific significance of Absorption spectrum.|Dark lines or bands where wavelengths have been absorbed from a continuous spectrum.","Spectroscopy|Apply Spectroscopy to a relevant scientific scenario.|The study of interactions between electromagnetic radiation and matter.","Spectral line|Analyse how Spectral line contributes to explaining or investigating a system.|A narrow wavelength feature produced by a specific atomic or molecular transition.","Doppler shift|Evaluate the role, usefulness or limitations of Doppler shift in this course.|A change in observed frequency or wavelength due to relative motion."]],["The Nature of Light — Synthesis and evaluation",["Redshift|Define Redshift.|A shift of spectral features towards longer wavelengths.","Blueshift|Explain the scientific significance of Blueshift.|A shift of spectral features towards shorter wavelengths.","Stellar temperature|Apply Stellar temperature to a relevant scientific scenario.|Surface temperature inferred from a star’s spectrum and black-body distribution.","Stellar composition|Analyse how Stellar composition contributes to explaining or investigating a system.|The elements present in a star, inferred from spectral lines.","Diffraction|Evaluate the role, usefulness or limitations of Diffraction in this course.|Spreading of a wave as it passes through an aperture or around an obstacle."]]],"m8":[["From the Universe to the Atom — Foundations",["Big Bang theory|Define Big Bang theory.|The model that the Universe developed from an early hot, dense state and has expanded and cooled.","Expansion of the Universe|Explain the scientific significance of Expansion of the Universe.|The increase in distance between large-scale cosmic structures as space expands.","Hubble’s law|Apply Hubble’s law to a relevant scientific scenario.|The approximately proportional relationship between galaxy recession speed and distance.","Hubble constant|Analyse how Hubble constant contributes to explaining or investigating a system.|The proportionality constant linking recession speed and galaxy distance.","Cosmological redshift|Evaluate the role, usefulness or limitations of Cosmological redshift in this course.|Stretching of light wavelength as the Universe expands."]],["From the Universe to the Atom — Structures and systems",["Cosmic microwave background|Define Cosmic microwave background.|Relic microwave radiation released when the early Universe became transparent.","Primordial nucleosynthesis|Explain the scientific significance of Primordial nucleosynthesis.|Formation of light nuclei in the first minutes after the Big Bang.","Matter–radiation transformation|Apply Matter–radiation transformation to a relevant scientific scenario.|Conversion between energy carried by radiation and particle mass.","Mass–energy equivalence|Analyse how Mass–energy equivalence contributes to explaining or investigating a system.|The relationship allowing mass to be converted to energy and energy to matter.","Continuous black-body spectrum|Evaluate the role, usefulness or limitations of Continuous black-body spectrum in this course.|A thermal spectrum whose shape depends mainly on temperature."]],["From the Universe to the Atom — Processes",["Stellar absorption spectrum|Define Stellar absorption spectrum.|A spectrum containing dark lines produced when a star’s atmosphere absorbs selected wavelengths.","Stellar emission spectrum|Explain the scientific significance of Stellar emission spectrum.|Bright spectral lines produced by excited atoms or ions.","Hertzsprung–Russell diagram|Apply Hertzsprung–Russell diagram to a relevant scientific scenario.|A graph relating stellar luminosity or absolute magnitude to surface temperature or spectral class.","Main sequence|Analyse how Main sequence contributes to explaining or investigating a system.|The HR-diagram band occupied by stars fusing hydrogen in their cores.","Red giant|Evaluate the role, usefulness or limitations of Red giant in this course.|A large luminous star with a relatively cool surface during a later evolutionary stage."]],["From the Universe to the Atom — Evidence and applications",["White dwarf|Define White dwarf.|A hot, dense stellar remnant supported by electron degeneracy pressure.","Supergiant|Explain the scientific significance of Supergiant.|A very luminous, massive star with a large radius.","Neutron star|Apply Neutron star to a relevant scientific scenario.|An extremely dense stellar remnant composed mainly of neutrons.","Black hole|Analyse how Black hole contributes to explaining or investigating a system.|A region where gravity is strong enough that nothing inside the event horizon can escape.","Luminosity|Evaluate the role, usefulness or limitations of Luminosity in this course.|The total power radiated by a star."]],["From the Universe to the Atom — Analysis",["Surface temperature|Define Surface temperature.|The effective temperature of a star’s visible surface.","Spectral class|Explain the scientific significance of Spectral class.|A classification of stars based on their spectra and surface temperatures.","Stellar evolution|Apply Stellar evolution to a relevant scientific scenario.|The sequence of changes experienced by a star over its lifetime.","Proton–proton chain|Analyse how Proton–proton chain contributes to explaining or investigating a system.|A fusion sequence converting hydrogen into helium in stars such as the Sun.","CNO cycle|Evaluate the role, usefulness or limitations of CNO cycle in this course.|A hydrogen-fusion cycle using carbon, nitrogen and oxygen nuclei as catalysts."]],["From the Universe to the Atom — Synthesis and evaluation",["Helium fusion|Define Helium fusion.|Fusion of helium nuclei to form heavier nuclei such as carbon.","Stellar nucleosynthesis|Explain the scientific significance of Stellar nucleosynthesis.|Production of new nuclei through reactions within stars.","Supernova nucleosynthesis|Apply Supernova nucleosynthesis to a relevant scientific scenario.|Production and dispersal of many heavy elements during a supernova.","Cathode ray|Analyse how Cathode ray contributes to explaining or investigating a system.|A beam of electrons produced in a low-pressure discharge tube.","Cathode-ray tube|Evaluate the role, usefulness or limitations of Cathode-ray tube in this course.|An evacuated tube used to investigate electron beams."]]],"working":[["Questioning",["question|What makes a question investigable?|It can be answered with ethical collection or analysis of evidence.","prediction|What should a scientific prediction include?|An expected outcome grounded in scientific reasoning.","hypothesis|How is a hypothesis evaluated?|By deriving predictions and comparing them with evidence.","variables|Why identify variables before collecting data?|To plan valid measurements and controls.","scope|Why narrow the scope of a question?|To make the study feasible and the conclusion precise."]],["Planning",["method|What makes a method reproducible?|Clear materials, quantities, sequence, controls and measurement details.","safety|What is the hierarchy of controls?|Eliminate, substitute, engineer, administrate, then use personal protective equipment.","ethics|When is ethical approval relevant?|When research involves people, animals, sensitive data or significant impacts.","sample|How should sample size be chosen?|Using expected variation, effect size, design, feasibility and power.","pilot|What can a pilot test?|Timing, instructions, instruments, data capture and practical risks."]],["Conducting",["recording|Why record data immediately?|It reduces memory error and preserves an auditable record.","units|Why use SI units where appropriate?|They support consistent comparison and communication.","repeats|Why repeat measurements?|To estimate random variation and improve the precision of an average.","anomaly|What should happen when an anomaly appears?|Check records and method, repeat if justified and report transparently.","provenance|What is data provenance?|A record of where data came from and how it was produced or changed."]],["Processing",["table|What makes a good data table?|Clear headings, units, consistent precision and organised raw values.","graph|How is a graph type selected?|Match it to variable types and the relationship or distribution being shown.","calculation|Why show a sample calculation?|It makes processing transparent and checkable.","normalisation|What is normalisation used for?|Making values comparable by adjusting for scale or another factor.","uncertainty|How can uncertainty propagate?|Uncertainty in inputs contributes to uncertainty in calculated outputs."]],["Analysing",["pattern|What distinguishes a pattern from noise?|It is consistent enough, relative to variation, to warrant explanation.","association|Why is association not automatically causation?|Confounding, reverse causation or chance may explain it.","uncertainty|Why include uncertainty in analysis?|Point estimates alone overstate precision.","limitations|Where should limitations be considered?|In interpreting how methods and data constrain conclusions.","alternative explanation|Why test alternative explanations?|The preferred explanation should outperform credible rivals."]],["Communicating",["audience|How should communication change for an audience?|Adjust language and format without distorting evidence or uncertainty.","citation|Why cite sources?|To credit work and let readers inspect supporting evidence.","visualisation|What makes a visualisation honest?|Proportionate scales, clear labels, context and no selective omission.","conclusion|What belongs in a conclusion?|A direct evidence-based answer, uncertainty and scope.","peer feedback|What is the value of peer feedback?|It can detect errors and improve reasoning and clarity."]]],"glossary":[["Syllabus Glossary — Foundations",["Ampere|Define Ampere.|The SI unit of electric current, equal to one coulomb of charge per second.","Black body|Explain the scientific significance of Black body.|An ideal object that absorbs all incident radiation and is also a perfect emitter.","Charge|Apply Charge to a relevant scientific scenario.|An intrinsic electrical property that may be positive or negative.","Classical physics|Analyse how Classical physics contributes to explaining or investigating a system.|Physics developed before quantum theory and relativity, particularly before the end of the nineteenth century.","Collision|Evaluate the role, usefulness or limitations of Collision in this course.|An interaction, commonly involving contact, between two or more bodies."]],["Syllabus Glossary — Structures and systems",["Conclusion|Define Conclusion.|A judgement reached from evidence.","Controlled variable|Explain the scientific significance of Controlled variable.|A factor kept constant, or changed consistently, during an investigation.","Dependent variable|Apply Dependent variable to a relevant scientific scenario.|The factor that changes in response to the independent variable.","Digital technologies|Analyse how Digital technologies contributes to explaining or investigating a system.|Hardware and software systems that process digital data for specific purposes.","Dipole|Evaluate the role, usefulness or limitations of Dipole in this course.|A system with separated opposite electric charges or magnetic poles."]],["Syllabus Glossary — Processes",["Dynamic|Define Dynamic.|Changing with time.","Elastic|Explain the scientific significance of Elastic.|Able to return towards an original shape after a deforming force is removed.","Elastic collision|Apply Elastic collision to a relevant scientific scenario.|A collision in which total kinetic energy as well as momentum is conserved.","Electric current|Analyse how Electric current contributes to explaining or investigating a system.|The rate of flow of electric charge.","Electric field|Evaluate the role, usefulness or limitations of Electric field in this course.|A region in which an electric charge experiences a force."]],["Syllabus Glossary — Evidence and applications",["Electrical resistance|Define Electrical resistance.|A measure of opposition to electric-current flow.","Energy|Explain the scientific significance of Energy.|The capacity of a system to cause change or do work.","Energy potential|Apply Energy potential to a relevant scientific scenario.|Stored capacity for energy transfer because of position or configuration.","Environment|Analyse how Environment contributes to explaining or investigating a system.|All living and non-living surroundings.","Equilibrium|Evaluate the role, usefulness or limitations of Equilibrium in this course.|A state in which competing effects are balanced and no net change occurs."]],["Syllabus Glossary — Analysis",["Equipotential|Define Equipotential.|A line or surface whose points have the same electric potential.","Field|Explain the scientific significance of Field.|A region in which an object experiences an influence or force due to a source.","Force|Apply Force to a relevant scientific scenario.|An interaction capable of changing an object’s motion or shape.","Frame of reference|Analyse how Frame of reference contributes to explaining or investigating a system.|A coordinate system and clock used to describe positions and motions.","Hypothesis|Evaluate the role, usefulness or limitations of Hypothesis in this course.|A precise, testable proposed explanation that can be supported or refuted."]],["Syllabus Glossary — Synthesis and evaluation",["Independent variable|Define Independent variable.|The factor deliberately changed to observe its effect on the dependent variable.","Inelastic collision|Explain the scientific significance of Inelastic collision.|A collision in which momentum is conserved but kinetic energy is not.","Inertial frame of reference|Apply Inertial frame of reference to a relevant scientific scenario.|A non-accelerating frame in which an object with no net force has constant velocity.","Investigation|Analyse how Investigation contributes to explaining or investigating a system.|A planned scientific process used to answer a question, explore an idea or solve a problem.","Kinetic energy|Evaluate the role, usefulness or limitations of Kinetic energy in this course.|Energy associated with motion."]]]};
const REVIEW_MAP={y11:["m1","m2","m3","m4"],y12:["m5","m6","m7","m8"],stage6:["m1","m2","m3","m4","m5","m6","m7","m8"]};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const state={teams:[],active:0,board:[],history:[],analytics:[],settings:{},selectedBanks:[],current:null,phase:"setup",finalMarks:{}};
const KEY="scisims-physics-jeopardy-v2";
const PREF="scisims-physics-jeopardy-teams-v2";
let timerId=null,seconds=0,audioCtx=null;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800);}
function beep(freq=600,dur=.09){if(!state.settings.sound)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=freq;o.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(.07,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);o.start();o.stop(audioCtx.currentTime+dur)}catch{}}
function save(){localStorage.setItem(KEY,JSON.stringify(state));localStorage.setItem(PREF,JSON.stringify(state.teams.map(t=>t.name)));}
function snapshot(label){state.history.push({label,teams:JSON.parse(JSON.stringify(state.teams)),active:state.active,board:JSON.parse(JSON.stringify(state.board)),analytics:JSON.parse(JSON.stringify(state.analytics))});if(state.history.length>80)state.history.shift();}
function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeQuestion(bank,cat,raw,difficulty,index){const [topic,q,a]=raw.split("|");const types=["text","scenario","table","graph","diagram","image"];return{id:bank+"-"+cat.replace(/\W/g,"")+"-"+index+"-"+Date.now(),bank,category:cat,topic,question:q,answer:a,difficulty,value:difficulty*100,type:types[(difficulty+index+cat.length)%types.length],used:false,daily:false,custom:false}}
function poolForBank(bank){if(REVIEW_MAP[bank])return REVIEW_MAP[bank].flatMap(b=>poolForBank(b));if(bank==="teacher")return getCustom();return (CONTENT[bank]||[]).flatMap(([cat,rows])=>rows.map((r,i)=>makeQuestion(bank,cat,r,i+1,i)))}
function categoriesFor(bank){if(REVIEW_MAP[bank])return shuffle(REVIEW_MAP[bank].flatMap(b=>(CONTENT[b]||[]).map(([c])=>({bank:b,cat:c}))));return (CONTENT[bank]||[]).map(([cat])=>({bank,cat}))}
function getCustom(){try{return JSON.parse(localStorage.getItem("scisims-physics-jeopardy-custom-v2")||"[]")}catch{return[]}}
function setCustom(v){localStorage.setItem("scisims-physics-jeopardy-custom-v2",JSON.stringify(v))}
function init(){
  const names=(()=>{try{return JSON.parse(localStorage.getItem(PREF)||"null")}catch{return null}})()||["Team Curie","Team Newton","Team Franklin"];
  $("#teamCount").innerHTML=[2,3,4,5,6].map(n=>`<option value="${n}" ${n===names.length?"selected":""}>${n} teams</option>`).join("");
  renderTeamInputs(names);$("#teamCount").onchange=()=>renderTeamInputs(names);
  $("#bankGrid").innerHTML=BANKS.map(([id,title,sub],i)=>`<label class="bank"><input type="checkbox" value="${id}" ${i===12?"checked":""}><span><strong>${title}</strong><br><small>${sub}</small></span></label>`).join("");
  const requestedBank=new URLSearchParams(location.search).get("bank");if(requestedBank){$$("#bankGrid input").forEach(input=>input.checked=input.value===requestedBank)}
  const saved=localStorage.getItem(KEY);$("#resumeBtn").hidden=!saved;
}
function renderTeamInputs(seed=[]){const n=+$("#teamCount").value;$("#teamInputs").innerHTML=Array.from({length:n},(_,i)=>`<div class="field"><label>Team ${i+1}</label><input class="team-name" value="${esc(seed[i]||"Team "+(i+1))}" maxlength="30"></div>`).join("")}
function readSettings(){state.settings={timer:+$("#timerSetting").value,daily:$("#daily").checked,final:$("#finalOn").checked,autoReveal:$("#autoReveal").checked,sound:$("#soundOn").checked,motion:$("#motionOn").checked};state.selectedBanks=$$("#bankGrid input:checked").map(x=>x.value);state.teams=$$(".team-name").map((x,i)=>({name:x.value.trim()||"Team "+(i+1),score:0,correct:0,incorrect:0}));state.active=0}
function applyPreferences(){document.body.classList.toggle("no-motion",state.settings.motion===false)}
function generateBoard(){
  readSettings();if(!state.selectedBanks.length)return toast("Choose at least one content bank.");
  const eligible=state.selectedBanks.filter(b=>b!=="teacher"||getCustom().length);
  if(!eligible.length)return toast("Add a Teacher Pick first.");
  const catCandidates=shuffle(eligible.flatMap(categoriesFor));const chosen=[];for(const c of catCandidates){if(!chosen.some(x=>x.cat===c.cat&&x.bank===c.bank))chosen.push(c);if(chosen.length===6)break}
  while(chosen.length<6){const b=eligible[chosen.length%eligible.length],p=poolForBank(b);chosen.push({bank:b,cat:p[chosen.length%p.length]?.category||"Teacher Picks"})}
  state.board=chosen.flatMap(({bank,cat},col)=>Array.from({length:5},(_,d)=>{
    const candidates=poolForBank(bank).filter(q=>q.category===cat&&q.difficulty===d+1);
    let q=shuffle(candidates)[0]||shuffle(poolForBank(bank).filter(q=>q.difficulty===d+1))[0]||shuffle(poolForBank(bank))[0];
    q=q?{...q,id:q.id+"-"+col+"-"+Math.random().toString(36).slice(2,7)}:makeQuestion("fallback",cat,`evidence|Evaluate the evidence used in this scientific claim.|A strong response considers source, method, data quality, uncertainty and alternatives.`,d+1,col);
    return{...q,col,row:d,value:(d+1)*100,used:false,daily:false}
  }));
  if(state.settings.daily){shuffle(state.board.filter(q=>q.row>0)).slice(0,2).forEach(q=>q.daily=true)}
  state.history=[];state.analytics=[];state.phase="board";applyPreferences();save();showGame()
}
function showGame(){applyPreferences();$("#setupScreen").classList.remove("active");$("#gameScreen").classList.add("active");$("#gameScreen").style.display="block";renderScores();renderBoard();$("#finalBtn").hidden=!state.settings.final}
function renderScores(){$("#scorebar").innerHTML=state.teams.map((t,i)=>`<div class="team-card ${i===state.active?"active":""}"><button data-team="${i}" title="Make active"><strong>${esc(t.name)}</strong><span>${t.score.toLocaleString("en-AU")}</span></button></div>`).join("");$$("[data-team]").forEach(b=>b.onclick=()=>{snapshot("Change active team");state.active=+b.dataset.team;save();renderScores()})}
function renderBoard(){const cats=[...new Map(state.board.map(q=>[q.col,q.category])).values()];$("#board").innerHTML=cats.map(c=>`<div class="category">${esc(c)}</div>`).join("")+Array.from({length:5},(_,row)=>state.board.filter(q=>q.row===row).sort((a,b)=>a.col-b.col).map(q=>`<button class="tile ${q.used?"used":""}" data-id="${q.id}" ${q.used?"disabled":""}>${q.value}</button>`).join("")).join("");$$(".tile:not(.used)").forEach(b=>b.onclick=()=>openClue(b.dataset.id))}
function stimulusHtml(q){if(q.type==="graph")return `<strong>Evidence display</strong><div class="mini-graph" aria-label="Bar graph with increasing values">${[28,43,61,78,72].map((v,i)=>`<i style="height:${v}%" data-v="${[12,19,27,35,32][i]}"></i>`).join("")}</div><small>Values are illustrative. Interpret the pattern before answering.</small>`;if(q.type==="table")return `<table class="data-table"><caption>Investigation results</caption><tr><th>Trial</th><th>Condition A</th><th>Condition B</th></tr>${[[1,12,15],[2,13,18],[3,11,17],[4,12,19]].map(r=>`<tr>${r.map(v=>`<td>${v}</td>`).join("")}</tr>`).join("")}</table>`;if(q.type==="diagram")return `<div class="diagram"><div>Observation</div><b>→ evidence →</b><div>Scientific claim</div></div>`;if(q.type==="image")return `<figure style="margin:0;text-align:center"><img src="../../../physicssims.png" alt="Physics course image supplied as a visual stimulus" style="max-height:220px;max-width:100%;border-radius:16px"><figcaption>Visual stimulus: identify what further context or evidence would be needed before drawing a conclusion.</figcaption></figure>`;if(q.type==="scenario")return `<strong>Scenario</strong><p>A research team reports this finding after a small classroom investigation. Consider the design, evidence and limits before responding.</p>`;return""}
function openClue(id){const q=state.board.find(x=>x.id===id);if(!q)return;state.current=id;$("#clueMeta").textContent=`${q.category} • ${q.value}`;$("#question").textContent=q.question;$("#answer").innerHTML=`<strong>Expected answer:</strong> ${esc(q.answer)}`;$("#answer").classList.remove("show");const stim=stimulusHtml(q);$("#stimulus").innerHTML=stim;$("#stimulus").hidden=!stim;$("#clueModal").classList.add("open");if(q.daily)showDailyWager(q);else showQuestionActions();startTimer()}
function showQuestionActions(){$("#clueActions").innerHTML=`<button class="secondary" id="timerBtn">Start / restart timer</button><button class="secondary" id="revealBtn">Reveal answer</button><button class="secondary" id="closeClue">Return to board</button>`;$("#timerBtn").onclick=startTimer;$("#revealBtn").onclick=revealAnswer;$("#closeClue").onclick=()=>closeClue(false)}
function revealAnswer(){stopTimer();$("#answer").classList.add("show");$("#clueActions").innerHTML=`<button class="correct" id="correctBtn">✓ Correct — ${esc(state.teams[state.active].name)}</button><button class="incorrect" id="wrongBtn">✕ Incorrect — ${esc(state.teams[state.active].name)}</button><button class="secondary" id="noAnswerBtn">No answer</button>`;$("#correctBtn").onclick=()=>mark(true);$("#wrongBtn").onclick=()=>mark(false);$("#noAnswerBtn").onclick=()=>mark(false,true)}
function startTimer(){stopTimer();seconds=state.settings.timer;$("#timer").textContent=seconds?seconds+" s":"Unlimited";$("#timer").classList.remove("low");if(!seconds)return;timerId=setInterval(()=>{seconds--;$("#timer").textContent=seconds+" s";if(seconds<=5)$("#timer").classList.add("low");if(seconds<=0){stopTimer();beep(220,.25);if(state.settings.autoReveal)revealAnswer()}},1000)}
function stopTimer(){clearInterval(timerId);timerId=null}
function mark(correct,noAnswer=false){const q=state.board.find(x=>x.id===state.current),team=state.teams[state.active];snapshot(correct?"Correct":"Incorrect");const pts=q.daily?(q.wager||q.value):q.value;team.score+=correct?pts:-pts;team[correct?"correct":"incorrect"]++;state.analytics.push({time:new Date().toISOString(),team:team.name,category:q.category,difficulty:q.difficulty,value:q.value,wager:q.wager||"",result:correct?"Correct":noAnswer?"No answer":"Incorrect",question:q.question});
  q.used=true;
  beep(correct?850:180);
  if(!correct)state.active=(state.active+1)%state.teams.length;
  closeClue(true);
}
function closeClue(saveIt){stopTimer();$("#clueModal").classList.remove("open");$("#stealMsg")?.remove();state.current=null;if(saveIt)save();renderScores();renderBoard();if(state.board.every(q=>q.used)){state.settings.final?openFinal():showResults()}}
function showDailyWager(q){stopTimer();const max=Math.max(500,state.teams[state.active].score);$("#question").innerHTML=`<span style="color:#b07a00">DAILY DOUBLE</span><br>${esc(state.teams[state.active].name)}, enter a wager from 0 to ${max.toLocaleString("en-AU")}.</span>`;$("#stimulus").hidden=true;$("#clueActions").innerHTML=`<input id="wager" type="number" min="0" max="${max}" value="${Math.min(q.value,max)}" style="padding:12px;border:1px solid var(--line);border-radius:10px"><button class="correct" id="lockWager">Lock wager & show clue</button>`;$("#lockWager").onclick=()=>{q.wager=Math.max(0,Math.min(max,+$("#wager").value||0));$("#question").textContent=q.question;const stim=stimulusHtml(q);$("#stimulus").innerHTML=stim;$("#stimulus").hidden=!stim;showQuestionActions();startTimer()}}
function openCustom(){const items=getCustom();$("#genericCard").innerHTML=`<h2>Teacher Picks</h2><p class="muted">Create questions for board generation. They remain saved on this device.</p><div class="setup-grid"><div><div class="field"><label>Category</label><input id="cCat" value="Teacher Picks"></div><div class="field"><label>Question</label><textarea id="cQ" rows="3"></textarea></div><div class="field"><label>Expected answer</label><textarea id="cA" rows="3"></textarea></div><div class="field"><label>Difficulty</label><select id="cD">${[1,2,3,4,5].map(n=>`<option value="${n}">${n} — ${n*100} points</option>`).join("")}</select></div><button class="btn primary" id="addCustom">Save Teacher Pick</button></div><div><strong>Saved questions</strong><div class="custom-list">${items.map((x,i)=>`<div class="custom-item"><span><b>${esc(x.category)}</b> — ${esc(x.question)}</span><button class="secondary" data-del="${i}">Delete</button></div>`).join("")||"<p>No questions saved yet.</p>"}</div></div></div><div class="builder-actions"><button class="btn secondary" id="closeGeneric">Done</button></div>`;$("#genericModal").classList.add("open");$("#addCustom").onclick=()=>{if(!$("#cQ").value.trim()||!$("#cA").value.trim())return toast("Add both a question and answer.");const d=+$("#cD").value;items.push({id:"custom-"+Date.now(),bank:"teacher",category:$("#cCat").value.trim()||"Teacher Picks",topic:$("#cQ").value.trim().slice(0,40),question:$("#cQ").value.trim(),answer:$("#cA").value.trim(),difficulty:d,value:d*100,type:"text",custom:true});setCustom(items);openCustom()};$$("[data-del]").forEach(b=>b.onclick=()=>{items.splice(+b.dataset.del,1);setCustom(items);openCustom()});$("#closeGeneric").onclick=closeGeneric}
function closeGeneric(){$("#genericModal").classList.remove("open")}
function openFinal(){closeClue(false);$("#genericCard").innerHTML=`<h2>Final Jeopardy</h2><p class="muted">Category: <strong>Scientific evidence and society</strong>. Enter each team's secret wager, then reveal the clue.</p><div class="final-wagers">${state.teams.map((t,i)=>`<div class="final-team"><strong>${esc(t.name)}</strong><small> Score: ${t.score}</small><input type="number" min="0" max="${Math.max(0,t.score)}" value="0" data-fw="${i}"></div>`).join("")}</div><div class="builder-actions"><button class="btn primary" id="showFinalQ">Lock wagers & show clue</button><button class="btn secondary" id="cancelFinal">Back to board</button></div>`;$("#genericModal").classList.add("open");$("#showFinalQ").onclick=()=>{$$("[data-fw]").forEach(x=>state.teams[+x.dataset.fw].wager=Math.max(0,Math.min(Math.max(0,state.teams[+x.dataset.fw].score),+x.value||0)));showFinalQuestion()};$("#cancelFinal").onclick=closeGeneric}
function showFinalQuestion(){$("#genericCard").innerHTML=`<h2>Final Jeopardy</h2><div class="question">A scientific claim could lead to a major public policy change. What four features would you examine before deciding how much confidence to place in it?</div><div id="finalAnswer" class="answer"><strong>Expected answer:</strong> Any justified four such as source expertise and conflicts, study design, sample and controls, data quality, uncertainty, replication, converging evidence, limitations and plausible alternatives.</div><div class="builder-actions"><button class="btn secondary" id="finalReveal">Reveal answer</button></div><div id="finalMarks"></div>`;$("#finalReveal").onclick=()=>{$("#finalAnswer").classList.add("show");renderFinalMarks()}}
function renderFinalMarks(){$("#finalMarks").innerHTML=`<h3>Mark each team</h3><div class="final-wagers">${state.teams.map((t,i)=>`<div class="final-team"><strong>${esc(t.name)}</strong><div>Wager: ${t.wager||0}</div><div class="mark-row"><button class="correct" data-fmark="${i}:1">Correct</button><button class="incorrect" data-fmark="${i}:0">Incorrect</button></div></div>`).join("")}</div><div class="builder-actions"><button class="btn primary" id="finishFinal">Score & show results</button></div>`;$$("[data-fmark]").forEach(b=>b.onclick=()=>{const[i,v]=b.dataset.fmark.split(":");state.finalMarks[i]=v==="1";b.parentElement.querySelectorAll("button").forEach(x=>x.style.opacity=x===b?"1":".35")});$("#finishFinal").onclick=()=>{snapshot("Final Jeopardy");state.teams.forEach((t,i)=>{const ok=!!state.finalMarks[i];t.score+=ok?(t.wager||0):-(t.wager||0);state.analytics.push({time:new Date().toISOString(),team:t.name,category:"Final Jeopardy",difficulty:5,value:"",wager:t.wager||0,result:ok?"Correct":"Incorrect",question:"Evaluate a policy-relevant scientific claim."})});save();closeGeneric();showResults()}}
function showResults(){closeGeneric();const sorted=[...state.teams].sort((a,b)=>b.score-a.score),attempts=state.analytics.length,correct=state.analytics.filter(x=>x.result==="Correct").length,unanswered=state.analytics.filter(x=>x.category!=="Final Jeopardy"&&x.result!=="Correct");$("#genericCard").innerHTML=`<h2>Game results</h2><div class="results-grid"><div class="result-card"><small>Winner</small><h3>${esc(sorted[0].name)}</h3><strong>${sorted[0].score.toLocaleString("en-AU")} points</strong></div><div class="result-card"><small>Questions attempted</small><h3>${attempts}</h3></div><div class="result-card"><small>Class accuracy</small><h3>${attempts?Math.round(correct/attempts*100):0}%</h3></div></div><h3 style="margin-top:18px">Team summary</h3><table class="data-table"><tr><th>Team</th><th>Score</th><th>Correct</th><th>Incorrect</th></tr>${sorted.map(t=>`<tr><td>${esc(t.name)}</td><td>${t.score}</td><td>${t.correct}</td><td>${t.incorrect}</td></tr>`).join("")}</table><h3 style="margin-top:18px">Category performance</h3><div class="results-grid">${categoryStats().map(x=>`<div class="result-card"><strong>${esc(x.cat)}</strong><div>${x.correct}/${x.total} correct</div></div>`).join("")||"<p>No clues marked.</p>"}</div><h3 style="margin-top:18px">Difficulty performance</h3><div class="results-grid">${difficultyStats().map(x=>`<div class="result-card"><strong>${x.difficulty*100} points</strong><div>${x.correct}/${x.total} correct</div></div>`).join("")||"<p>No clues marked.</p>"}</div><h3 style="margin-top:18px">Questions nobody answered correctly</h3><div class="results-grid">${unanswered.map(x=>`<div class="result-card"><strong>${esc(x.category)} — ${x.value}</strong><div>${esc(x.question)}</div></div>`).join("")||"<p>Every attempted question was answered correctly.</p>"}</div><div class="builder-actions"><button class="btn primary" id="csvBtn">Export analytics CSV</button><button class="btn secondary" id="newGame">New game</button></div>`;$("#genericModal").classList.add("open");$("#csvBtn").onclick=exportCSV;$("#newGame").onclick=()=>{localStorage.removeItem(KEY);location.reload()}}
function categoryStats(){const m={};state.analytics.forEach(x=>{m[x.category]??={cat:x.category,total:0,correct:0};m[x.category].total++;if(x.result==="Correct")m[x.category].correct++});return Object.values(m)}
function difficultyStats(){const m={};state.analytics.filter(x=>x.category!=="Final Jeopardy").forEach(x=>{m[x.difficulty]??={difficulty:x.difficulty,total:0,correct:0};m[x.difficulty].total++;if(x.result==="Correct")m[x.difficulty].correct++});return Object.values(m).sort((a,b)=>a.difficulty-b.difficulty)}
function exportCSV(){const rows=[["Timestamp","Team","Category","Difficulty","Tile value","Wager","Result","Question"],...state.analytics.map(x=>[x.time,x.team,x.category,x.difficulty,x.value,x.wager,x.result,x.question])];const csv=rows.map(r=>r.map(v=>'"'+String(v??"").replaceAll('"','""')+'"').join(",")).join("\r\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="physics-jeopardy-analytics.csv";a.click();URL.revokeObjectURL(a.href)}
function undo(){const h=state.history.pop();if(!h)return toast("Nothing to undo.");state.teams=h.teams;state.active=h.active;state.board=h.board;state.analytics=h.analytics;save();renderScores();renderBoard();toast("Undone: "+h.label)}
function loadGame(){try{Object.assign(state,JSON.parse(localStorage.getItem(KEY)));showGame()}catch{toast("Saved game could not be loaded.")}}
$("#generateBtn").onclick=generateBoard;$("#customBtn").onclick=openCustom;$("#resumeBtn").onclick=loadGame;$("#undoBtn").onclick=undo;$("#changeTeamBtn").onclick=()=>{snapshot("Change active team");state.active=(state.active+1)%state.teams.length;save();renderScores()};$("#builderBtn").onclick=()=>{save();$("#gameScreen").style.display="none";$("#gameScreen").classList.remove("active");$("#setupScreen").classList.add("active");$("#resumeBtn").hidden=false};$("#finalBtn").onclick=openFinal;$("#endBtn").onclick=showResults;$("#fitBtn").onclick=()=>document.body.classList.toggle("fit");$("#fullBtn").onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();init();
</script>
</body>
</html>
