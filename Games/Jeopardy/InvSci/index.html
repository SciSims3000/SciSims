bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px}.team-card{border:2px solid #ffffff27;border-radius:14px;padding:10px;text-align:center;background:#ffffff10;position:relative}.team-card.active{border-color:var(--gold);background:#ffcf3320;transform:translateY(-2px)}.team-card button{all:unset;cursor:pointer;display:block;width:100%}.team-card strong{display:block}.team-card span{font-size:1.35rem;font-weight:950;color:var(--gold)}.game-tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.board{display:grid;grid-template-columns:repeat(6,minmax(130px,1fr));gap:8px}.category{min-height:82px;display:grid;place-items:center;text-align:center;padding:9px;border-radius:12px;background:linear-gradient(160deg,#1471e8,#0a3c99);font-weight:900;text-transform:uppercase;font-size:clamp(.72rem,1.25vw,1rem);letter-spacing:.025em}.tile{min-height:91px;border:0;border-radius:12px;background:linear-gradient(155deg,#0b4bc0,#062f82);color:var(--gold);font-size:clamp(1.35rem,2.7vw,2.25rem);font-weight:950;text-shadow:0 3px 0 #0005;position:relative}.tile:hover{filter:brightness(1.14);transform:translateY(-2px)}.tile.used{background:#081b45;color:#4f638e;cursor:default;text-shadow:none}.replace{position:absolute;right:5px;top:5px;border:0;border-radius:7px;padding:3px 6px;background:#fff2;color:#fff;font-size:.66rem}.replace:hover{background:#fff4}.modal{position:fixed;inset:0;display:none;place-items:center;background:#02091de8;z-index:30;padding:16px}.modal.open{display:grid}.clue-card{width:min(1120px,100%);max-height:95vh;overflow:auto;background:#fff;color:var(--ink);border-radius:26px;padding:clamp(20px,4vw,42px);box-shadow:0 30px 100px #0008}.clue-head{display:flex;gap:10px;justify-content:space-between;align-items:center}.clue-meta{color:var(--blue);font-weight:900;text-transform:uppercase}.timer{font-size:1.25rem;font-weight:950;padding:8px 12px;border-radius:12px;background:#eaf1ff}.timer.low{background:#ffe3e8;color:#b01835}.stimulus{margin:20px 0;padding:18px;border:1px solid var(--line);border-radius:18px;background:#f5f8ff}.question{font-size:clamp(1.35rem,3vw,2.45rem);line-height:1.25;font-weight:850;margin:22px 0}.answer{display:none;padding:18px;border-radius:16px;background:#e8f8f1;border:2px solid #8bd2b5;font-size:1.18rem}.answer.show{display:block}.clue-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}.clue-actions button{border:0;border-radius:12px;padding:12px 16px;font-weight:900}.correct{background:var(--green);color:#fff}.incorrect{background:var(--red);color:#fff}.secondary{background:#e7eefb;color:var(--ink)}.data-table{border-collapse:collapse;margin:auto;min-width:min(520px,100%)}.data-table th,.data-table td{border:1px solid #9cb0d1;padding:9px;text-align:center}.mini-graph{height:210px;display:flex;align-items:flex-end;gap:8px;padding:20px 20px 30px;border-left:3px solid #41577d;border-bottom:3px solid #41577d}.mini-graph i{flex:1;background:linear-gradient(#39d3ff,#0b4bc0);min-width:24px;position:relative}.mini-graph i::after{content:attr(data-v);position:absolute;top:-24px;width:100%;text-align:center;font-style:normal;font-weight:800}.diagram{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;text-align:center}.diagram div{padding:22px;border:2px solid #6b82a8;border-radius:50px;font-weight:850}.results-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.result-card{background:#eef3fc;border-radius:14px;padding:14px}.custom-list{max-height:190px;overflow:auto;margin-top:10px}.custom-item{display:flex;justify-content:space-between;gap:8px;padding:8px;border-bottom:1px solid var(--line)}.toast{position:fixed;bottom:20px;left:50%;translate:-50% 20px;background:#081b45;color:#fff;padding:11px 17px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;z-index:50}.toast.show{opacity:1;translate:-50% 0}.screen{display:none}.screen.active{display:block}.final-wagers{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}.final-team{padding:12px;border:1px solid var(--line);border-radius:13px}.final-team input{width:100%;padding:8px;border:1px solid var(--line);border-radius:9px}.mark-row{display:flex;gap:6px;margin-top:8px}.mark-row button{flex:1;border:0;border-radius:9px;padding:8px;font-weight:850}.fit .app{width:100%;margin:0;padding:8px}.fit #scisimsSiteNav,.fit .brand small{display:none}.fit .category{min-height:10vh}.fit .tile{min-height:13vh}@media(max-width:900px){.setup-grid{grid-template-columns:1fr}.board{overflow-x:auto;grid-template-columns:repeat(6,minmax(118px,1fr))}.teams-edit{grid-template-columns:1fr}}@media(max-width:560px){.app{width:min(100% - 12px,1550px)}.panel{padding:15px}.checks{grid-template-columns:1fr}.clue-card{border-radius:18px}.question{font-size:1.4rem}}

<script>
"use strict";
const BANKS=[
["m1","Year 11 Module 1","Cause and Effect – Observing"],
["m2","Year 11 Module 2","Cause and Effect – Inferences and Generalisations"],
["m3","Year 11 Module 3","Scientific Models"],
["m4","Year 11 Module 4","Theories and Laws"],
["m5","Year 12 Module 5","Scientific Investigations"],
["m6","Year 12 Module 6","Technologies"],
["m7","Year 12 Module 7","Fact or Fallacy?"],
["m8","Year 12 Module 8","Science and Society"],
["working","Working Scientifically","Skills across Stage 6"],
["glossary","Syllabus Glossary","Terms in context"],
["y11","Whole Year 11 Review","Modules 1–4"],
["y12","Whole Year 12 Review","Modules 5–8"],
["stage6","Whole Stage 6 Review","Modules 1–8"],
["teacher","Teacher Picks","Your saved questions"]
];
const CONTENT={
m1:[
["Observations",["qualitative observation|Describe a qualitative observation.|A description using qualities rather than numbers.","quantitative observation|What makes an observation quantitative?|It includes a measurement or numerical value.","measurement uncertainty|Why should uncertainty accompany a measurement?|It communicates the reasonable range around the measured value.","observer influence|Identify one way an observer may affect observations.|Expectations, technique or recording choices may introduce bias.","operational definitions|Why define an observation operationally?|So the feature is measured consistently and can be replicated."]],
["Variables",["independent variable|Which variable is deliberately changed?|The independent variable.","dependent variable|Which variable is measured as the outcome?|The dependent variable.","controlled variables|Why keep controlled variables constant?|To isolate the effect of the independent variable.","confounding variable|What is a confounding variable?|An uncontrolled factor related to both the cause and outcome.","fair test|What makes a test fair?|Only the independent variable changes while relevant conditions are controlled."]],
["Patterns",["trend|What is a trend in data?|A general direction or pattern across observations.","correlation|What does correlation show?|That variables vary together; it does not by itself establish causation.","outlier|How should an outlier be handled?|Investigate it; do not discard it without scientific justification.","line of best fit|Why use a line of best fit?|To represent the overall relationship rather than connect every point.","cause and effect|What evidence strengthens a causal claim?|Controlled tests, temporal order, a plausible mechanism and replication."]],
["Sampling",["population|Distinguish a population from a sample.|The population is the full group; a sample is the studied subset.","random sample|Why use random sampling?|It reduces selection bias by giving members a known chance of selection.","sample size|How does a larger sample usually help?|It reduces random sampling variation and improves representativeness.","representative sample|What makes a sample representative?|Its relevant characteristics reflect the target population.","sampling bias|Give one cause of sampling bias.|A sampling method that systematically favours part of the population."]],
["Evidence",["primary data|What is primary data?|Data collected first-hand for the current investigation.","secondary data|What must be checked in secondary data?|Source credibility, methods, relevance, currency and limitations.","repeatability|What is repeatability?|Agreement when the same person repeats a method under the same conditions.","reproducibility|What is reproducibility?|Agreement when others repeat the work or conditions change appropriately.","converging evidence|Why is converging evidence persuasive?|Independent methods or sources support the same conclusion."]],
["Fieldwork",["transect|When is a transect useful?|When sampling change along an environmental gradient.","quadrat|What does a quadrat help estimate?|Abundance, density or percentage cover in a defined area.","ethical observation|Name one ethical fieldwork principle.|Minimise disturbance and harm to organisms and habitats.","instrument calibration|Why calibrate before field measurements?|To compare readings with a known reference and reduce systematic error.","field notes|What makes field notes scientifically useful?|Dates, locations, conditions, methods and observations are recorded clearly."]]
],
m2:[
["Inferences",["inference|Distinguish an inference from an observation.|An inference is an interpretation drawn from observations.","inductive reasoning|What is inductive reasoning?|Developing a generalisation from specific observations.","deductive reasoning|What is deductive reasoning?|Applying a general principle to predict a specific outcome.","abduction|What is inference to the best explanation?|Selecting the explanation that best accounts for the available evidence.","assumption|Why state assumptions?|They reveal conditions on which an inference depends."]],
["Generalisations",["generalisability|What affects whether findings generalise?|Sampling, context, method and similarity to the target population.","boundary condition|What is a boundary condition?|A limit specifying when a generalisation or model applies.","extrapolation|Why is extrapolation risky?|It predicts beyond the observed data range where the relationship may change.","replication|How does replication support generalisation?|It tests whether findings persist across repeats, researchers or contexts.","exception|Can one exception always disprove a broad pattern?|No; its validity and the exact scope of the claim must be evaluated."]],
["Data Quality",["accuracy|Define accuracy.|Closeness to the accepted or true value.","precision|Define precision.|Closeness of repeated measurements to one another.","validity|What makes an investigation valid?|It measures the intended relationship and supports the conclusion.","reliability|What makes results reliable?|They are consistent across repeats or independent replication.","systematic error|How does systematic error affect data?|It shifts results consistently away from the true value."]],
["Statistics",["mean|When can the mean mislead?|With strong skew or influential outliers.","median|When is the median useful?|For skewed data or data containing outliers.","range|What does range show?|The spread between the maximum and minimum values.","standard deviation|What does a small standard deviation indicate?|Values cluster relatively close to the mean.","confidence interval|What does a confidence interval communicate?|A plausible range for a population estimate under stated assumptions."]],
["Claims",["null hypothesis|What does a null hypothesis state?|No effect, difference or association beyond chance variation.","alternative hypothesis|What does an alternative hypothesis propose?|A specified effect, difference or association.","statistical significance|Does statistical significance prove importance?|No; effect size, uncertainty and context also matter.","effect size|Why report effect size?|It describes the magnitude of a difference or relationship.","cherry-picking|What is cherry-picking?|Selecting only evidence that supports a preferred claim."]],
["Communication",["graph choice|Which graph suits change over continuous time?|Usually a line graph.","axis conventions|What must a scientific graph include?|Clearly labelled axes, units and an appropriate scale.","uncertainty language|Why use qualified language in conclusions?|To match the strength of the claim to the strength of evidence.","peer critique|How can critique improve an inference?|It exposes alternative explanations, hidden assumptions and method flaws.","abstract|What should an abstract communicate?|The question, approach, key result and conclusion concisely."]]
],
m3:[
["Model Basics",["scientific model|What is a scientific model?|A simplified representation used to explain, predict or communicate a system.","scale model|What is preserved in a scale model?|Selected proportions or relationships, not necessarily every feature.","conceptual model|Give an example of a conceptual model.|A diagram or analogy representing relationships between ideas.","mathematical model|What distinguishes a mathematical model?|Relationships are expressed using equations or quantitative rules.","computer simulation|What is a simulation used for?|Exploring how a model behaves under varied inputs or scenarios."]],
["Assumptions",["simplification|Why must models simplify reality?|Including every detail is impossible and often unhelpful.","parameter|What is a model parameter?|A value controlling part of the model's behaviour.","initial condition|Why do initial conditions matter?|They set the starting state and can affect model outcomes.","model boundary|What does a model boundary define?|What is included in and excluded from the represented system.","idealisation|Give an example of idealisation.|Treating friction as negligible or particles as points."]],
["Testing Models",["prediction|How can prediction test a model?|Compare a novel predicted outcome with observation.","validation|What is model validation?|Checking model outputs against independent observations for its intended use.","calibration|What is model calibration?|Adjusting parameters using known data.","sensitivity analysis|What does sensitivity analysis reveal?|Which inputs most strongly affect model outputs.","residual|What is a residual?|The difference between an observed and model-predicted value."]],
["Model Change",["anomaly|How can anomalies affect a model?|They may reveal error, limits or a need to revise the model.","revision|When should a model be revised?|When evidence shows its assumptions or predictions are inadequate.","replacement|Why might a useful model be replaced?|A new model may explain more evidence or predict more accurately.","multiple models|Why can scientists use multiple models?|Different models serve different scales, purposes or questions.","uncertainty|How should model uncertainty be reported?|As ranges, probabilities, scenarios and explicit limitations."]],
["Historical Models",["geocentric model|Why was the geocentric model persuasive historically?|It matched everyday observation and available measurement.","heliocentric model|What evidence supported heliocentrism?|Planetary motion patterns, telescopic observations and later precise predictions.","atomic models|Why have atomic models changed?|New experiments revealed features earlier models could not explain.","DNA model|How did the double-helix model gain support?|It fitted X-ray diffraction and chemical evidence and explained replication.","plate tectonics|What made plate tectonics a unifying model?|It explained earthquakes, volcanoes, seafloor spreading and continental movement."]],
["Uses and Limits",["prediction horizon|Why do some predictions worsen over time?|Uncertainty can accumulate, especially in sensitive systems.","scenario|How is a scenario different from a forecast?|It explores what could occur under stated assumptions, not what will occur.","black box|What is a black-box model concern?|Its internal reasoning may be difficult to interpret or scrutinise.","fitness for purpose|How should a model be judged?|By whether it is suitable and sufficiently accurate for its intended use.","ethical model use|Name one ethical issue in modelling.|Biased data or assumptions can produce unfair or harmful decisions."]]
],
m4:[
["Theories",["scientific theory|What is a scientific theory?|A well-supported explanatory framework integrating extensive evidence.","theory and guess|Why is a scientific theory not merely a guess?|It is repeatedly tested and supported by converging evidence.","explanatory power|What is explanatory power?|The ability to account for diverse observations coherently.","predictive power|Why is predictive power important?|Accurate novel predictions provide demanding tests.","scope|What is the scope of a theory?|The range of phenomena and conditions it explains."]],
["Laws",["scientific law|What is a scientific law?|A concise description of a regular relationship, often mathematical.","law versus theory|Does a theory become a law?|No; they have different roles: explanation and description.","empirical law|What is an empirical law based on?|A consistently observed relationship, even before a mechanism is known.","conditions|Why state conditions for a law?|Relationships may hold only within specified ranges or systems.","mathematical form|What benefit does a mathematical law offer?|Precise, testable quantitative predictions."]],
["Evidence Change",["falsifiability|What makes a claim falsifiable?|Possible evidence could show it to be wrong.","provisional|Why is scientific knowledge provisional?|It remains open to revision when warranted by new evidence.","paradigm shift|What is a paradigm shift?|A major change in the framework guiding explanation and research.","crucial evidence|Can one experiment always settle a theory?|Rarely; methods, assumptions and replication must be assessed.","consilience|What is consilience?|Independent evidence from different fields supports the same explanation."]],
["Development",["continental drift|Why was continental drift initially resisted?|A convincing mechanism was missing despite suggestive evidence.","germ theory|How did germ theory change medicine?|It linked microorganisms to disease and guided prevention and treatment.","evolution|What evidence supports evolution?|Fossils, genetics, biogeography, anatomy and observed change.","relativity|What did relativity revise?|Classical assumptions about space, time, gravity and motion.","quantum theory|Why was quantum theory developed?|Classical models could not explain several atomic-scale observations."]],
["Testing",["controlled test|How can a theory be tested indirectly?|Test predictions derived from it under controlled or observational conditions.","novel prediction|Why is a novel prediction strong evidence?|It was not used to construct the explanation and risks failure.","replication|Why is replication central to theory testing?|It checks that results are not accidental or method-specific.","alternative theory|How are competing theories compared?|By explanatory scope, predictions, evidence fit and parsimony.","auxiliary assumption|Why can failed predictions be complicated?|The theory, an auxiliary assumption, measurement or method may be responsible."]],
["Nature of Science",["creativity|Where does creativity enter science?|In questions, hypotheses, models, methods and explanations.","community|Why is science a community process?|Scrutiny, replication and shared standards help correct individual error.","culture|Can culture influence science?|Yes; priorities and interpretations can be shaped socially, while evidence constrains claims.","authority|Why is authority alone insufficient evidence?|Claims must be supported by transparent, testable evidence.","certainty|Does science provide absolute certainty?|Usually no; it provides evidence-based degrees of confidence."]]
],
m5:[
["Planning",["research question|What makes a strong research question?|It is focused, testable, ethical and feasible.","hypothesis|Write the structure of a testable hypothesis.|If the independent variable changes, then the dependent variable will change in a stated way.","risk assessment|What belongs in a risk assessment?|Hazards, likelihood, consequences and control measures.","pilot study|Why conduct a pilot study?|To identify practical problems and refine the method.","method detail|Why must a method be detailed?|So another investigator can repeat it accurately."]],
["Measurement",["calibration|What does calibration check?|Instrument readings against a known standard.","resolution|What is instrument resolution?|The smallest change the instrument can display or detect.","zero error|What type of error is a consistent zero offset?|Systematic error.","parallax|How can parallax error be reduced?|Read the scale at eye level perpendicular to the marker.","significant figures|How should significant figures be chosen?|To reflect the precision of the least precise measurements used."]],
["Design",["control group|What does a control group provide?|A baseline for comparison without the tested treatment.","placebo|Why use a placebo?|To separate treatment effects from expectations and other influences.","random allocation|What does random allocation reduce?|Systematic differences between treatment groups.","blinding|How does blinding reduce bias?|Participants or assessors cannot tailor behaviour or judgement to treatment knowledge.","counterbalancing|Why counterbalance treatment order?|To reduce order and carry-over effects."]],
["Analysis",["raw data|Why retain raw data?|It preserves the original record for checking and reanalysis.","processed data|Give an example of processed data.|A mean, rate, percentage or transformed value.","uncertainty bars|What do error or uncertainty bars communicate?|Variation or uncertainty around plotted estimates.","interpolation|Why is interpolation safer than extrapolation?|It estimates within the observed data range.","causal conclusion|When is a causal conclusion justified?|When design and evidence rule out credible alternatives sufficiently."]],
["Evaluation",["limitation|What makes a useful limitation statement?|It identifies a specific weakness and its likely effect on results.","improvement|What makes an improvement valid?|It directly addresses a stated limitation and is practical.","random error|How can random error often be reduced?|Repeat measurements and average, or improve measurement technique.","systematic error|Why do repeats not remove systematic error?|The same bias affects every repeated reading.","valid conclusion|What must a valid conclusion do?|Answer the question using results without exceeding the evidence."]],
["Ethics",["informed consent|What is informed consent?|Voluntary agreement after understanding purpose, procedure, risks and rights.","confidentiality|How is confidentiality protected?|Limit access and de-identify participant data.","animal ethics|Name a principle for animal research.|Replace, reduce and refine animal use.","environmental ethics|What should environmental fieldwork minimise?|Disturbance, harm, waste and lasting impacts.","data integrity|What violates data integrity?|Fabrication, falsification or selective omission of data."]]
],
m6:[
["Sensors",["sensor|What does a sensor do?|Detects a physical or chemical property and produces a signal.","transducer|What is a transducer?|A device that converts one form of energy or signal into another.","data logger|Why use a data logger?|For consistent automated measurements over time.","sampling rate|What does sampling rate determine?|How frequently a signal is measured.","detection limit|What is a detection limit?|The smallest quantity distinguishable from background or noise."]],
["Imaging",["microscopy|How has microscopy extended observation?|It reveals structures below unaided-eye resolution.","x-ray imaging|Why can X-rays image bones?|Dense tissues attenuate X-rays more strongly than soft tissue.","MRI|What does MRI primarily use?|Magnetic fields and radiofrequency signals, not ionising X-rays.","remote sensing|What is remote sensing?|Collecting information without direct contact, often by satellites or aircraft.","resolution trade-off|Name an imaging trade-off.|Higher spatial or temporal resolution may cost more, increase noise or reduce coverage."]],
["Digital Data",["analogue to digital|What does analogue-to-digital conversion do?|Turns a continuous signal into sampled numerical values.","algorithm|What is an algorithm?|A defined sequence of operations for processing information.","automation|Give one advantage of automation.|Speed, consistency or operation where direct human work is unsafe.","machine learning|Why can training data bias matter?|The model may reproduce unrepresentative or discriminatory patterns.","metadata|Why preserve metadata?|It records context such as time, instrument, settings and provenance."]],
["Reliability",["instrument drift|What is instrument drift?|A gradual change in readings unrelated to the measured quantity.","noise|How can signal-to-noise ratio be improved?|Reduce interference, average repeats or increase useful signal.","maintenance|Why is preventive maintenance scientific?|It reduces failures and unrecognised changes in measurement quality.","cross-validation|Why compare technologies measuring the same feature?|Agreement can reveal confidence; disagreement prompts investigation.","quality control|What is quality control?|Routine checks that a process or instrument meets defined standards."]],

m7:[
["Sources",["primary source|What is a primary scientific source?|An original report of methods, data and findings.","peer review|What can peer review do?|Identify weaknesses before publication; it does not guarantee correctness.","expertise|How should expertise be judged?|By relevant knowledge, track record, transparency and accountability.","conflict of interest|Why disclose conflicts of interest?|They may consciously or unconsciously influence research or communication.","consensus|What does scientific consensus mean?|Broad expert agreement based on accumulated evidence, not a vote replacing evidence."]],
["Fallacies",["ad hominem|What is an ad hominem fallacy?|Attacking a person instead of evaluating their evidence or argument.","false cause|What is the false-cause fallacy?|Assuming one event caused another merely because they are associated or sequential.","false dilemma|What is a false dilemma?|Presenting only two options when credible alternatives exist.","appeal to nature|Why is 'natural means safe' flawed?|Naturalness does not determine risk or benefit.","anecdote|Why is an anecdote weak general evidence?|It lacks controls, representative sampling and systematic comparison."]],
["Media",["headline|How can a headline distort science?|It can overstate certainty, causation, novelty or relevance.","relative risk|Why report absolute risk with relative risk?|A large relative change can represent a very small absolute difference.","false balance|What is false balance?|Presenting unsupported and well-supported positions as equally credible.","preprint|What caution applies to a preprint?|It has not yet completed formal peer review.","correction|What does a published correction indicate?|Science can identify and transparently amend errors."]],
["Pseudoscience",["testability|Why is testability important?|Claims must risk being contradicted by observable evidence.","moving goalposts|What is moving the goalposts?|Changing criteria after evidence fails to support the claim.","testimonial|Why are testimonials unreliable tests?|They are selected, uncontrolled personal reports.","conspiracy shield|How can conspiracy claims resist evidence?|Counter-evidence is reinterpreted as proof of the alleged conspiracy.","scientific language|Does technical language make a claim scientific?|No; methods, evidence and testability matter."]],
["Data Tricks",["truncated axis|How can a truncated axis mislead?|It visually exaggerates differences.","small sample|Why is a tiny sample unstable?|Chance variation can dominate and estimates have high uncertainty.","multiple comparisons|What risk comes from testing many relationships?|Some apparently significant results may occur by chance.","survivorship bias|What is survivorship bias?|Considering visible successes while missing failures or dropouts.","misleading average|Why ask which average was used?|Mean, median and mode can tell different stories."]],

["Risk",["hazard|Distinguish hazard from risk.|A hazard can cause harm; risk considers likelihood and consequence under exposure.","risk perception|Why can people perceive the same risk differently?|Experience, trust, values, control and communication differ.","acceptable risk|Is acceptable risk purely scientific?|No; evidence informs it, but values and trade-offs are involved.","uncertainty|How should uncertainty be communicated publicly?|Clearly, quantitatively where possible, and without implying ignorance.","risk comparison|What makes a fair risk comparison?|Comparable populations, exposures, timeframes and outcomes."]],

const REVIEW_MAP={y11:["m1","m2","m3","m4"],y12:["m5","m6","m7","m8"],stage6:["m1","m2","m3","m4","m5","m6","m7","m8"]};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const state={teams:[],active:0,board:[],history:[],analytics:[],settings:{},selectedBanks:[],current:null,phase:"setup",finalMarks:{}};

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800);}
function beep(freq=600,dur=.09){if(!state.settings.sound)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=freq;o.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(.07,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);o.start();o.stop(audioCtx.currentTime+dur)}catch{}}
function save(){localStorage.setItem(KEY,JSON.stringify(state));localStorage.setItem(PREF,JSON.stringify(state.teams.map(t=>t.name)));}
function snapshot(label){state.history.push({label,teams:JSON.parse(JSON.stringify(state.teams)),active:state.active,board:JSON.parse(JSON.stringify(state.board)),analytics:JSON.parse(JSON.stringify(state.analytics))});if(state.history.length>80)state.history.shift();}
function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeQuestion(bank,cat,raw,difficulty,index){const [topic,q,a]=raw.split("|");const types=["text","scenario","table","graph","diagram","image"];return{id:bank+"-"+cat.replace(/\W/g,"")+"-"+index+"-"+Date.now(),bank,category:cat,topic,question:q,answer:a,difficulty,value:difficulty*100,type:types[(difficulty+index+cat.length)%types.length],used:false,daily:false,custom:false}}
function poolForBank(bank){if(REVIEW_MAP[bank])return REVIEW_MAP[bank].flatMap(b=>poolForBank(b));if(bank==="teacher")return getCustom();return (CONTENT[bank]||[]).flatMap(([cat,rows])=>rows.map((r,i)=>makeQuestion(bank,cat,r,i+1,i)))}
function categoriesFor(bank){if(REVIEW_MAP[bank])return shuffle(REVIEW_MAP[bank].flatMap(b=>(CONTENT[b]||[]).map(([c])=>({bank:b,cat:c}))));return (CONTENT[bank]||[]).map(([cat])=>({bank,cat}))}
function getCustom(){try{return JSON.parse(localStorage.getItem("scisims-is-jeopardy-custom-v2")||"[]")}catch{return[]}}
function setCustom(v){localStorage.setItem("scisims-is-jeopardy-custom-v2",JSON.stringify(v))}

  const names=(()=>{try{return JSON.parse(localStorage.getItem(PREF)||"null")}catch{return null}})()||["Team Curie","Team Newton","Team Franklin"];
  $("#teamCount").innerHTML=[2,3,4,5,6].map(n=>`<option value="${n}" ${n===names.length?"selected":""}>${n} teams</option>`).join("");
  renderTeamInputs(names);$("#teamCount").onchange=()=>renderTeamInputs(names);
  $("#bankGrid").innerHTML=BANKS.map(([id,title,sub],i)=>`<label class="bank"><input type="checkbox" value="${id}" ${i===12?"checked":""}><span><strong>${title}</strong><br><small>${sub}</small></span></label>`).join("");

function renderTeamInputs(seed=[]){const n=+$("#teamCount").value;$("#teamInputs").innerHTML=Array.from({length:n},(_,i)=>`<div class="field"><label>Team ${i+1}</label><input class="team-name" value="${esc(seed[i]||"Team "+(i+1))}" maxlength="30"></div>`).join("")}
function readSettings(){state.settings={timer:+$("#timerSetting").value,daily:$("#daily").checked,final:$("#finalOn").checked,autoReveal:$("#autoReveal").checked,sound:$("#soundOn").checked,motion:$("#motionOn").checked};state.selectedBanks=$$("#bankGrid input:checked").map(x=>x.value);state.teams=$$(".team-name").map((x,i)=>({name:x.value.trim()||"Team "+(i+1),score:0,correct:0,incorrect:0}));state.active=0}
function applyPreferences(){document.body.classList.toggle("no-motion",state.settings.motion===false)}
function generateBoard(){
  readSettings();if(!state.selectedBanks.length)return toast("Choose at least one content bank.");
  const eligible=state.selectedBanks.filter(b=>b!=="teacher"||getCustom().length);
  if(!eligible.length)return toast("Add a Teacher Pick first.");
  const catCandidates=shuffle(eligible.flatMap(categoriesFor));const chosen=[];for(const c of catCandidates){if(!chosen.some(x=>x.cat===c.cat&&x.bank===c.bank))chosen.push(c);if(chosen.length===6)break}
  while(chosen.length<6){const b=eligible[chosen.length%eligible.length],p=poolForBank(b);chosen.push({bank:b,cat:p[chosen.length%p.length]?.category||"Teacher Picks"})}
  state.board=chosen.flatMap(({bank,cat},col)=>Array.from({length:5},(_,d)=>{
    const candidates=poolForBank(bank).filter(q=>q.category===cat&&q.difficulty===d+1);
    let q=shuffle(candidates)[0]||shuffle(poolForBank(bank).filter(q=>q.difficulty===d+1))[0]||shuffle(poolForBank(bank))[0];
    q=q?{...q,id:q.id+"-"+col+"-"+Math.random().toString(36).slice(2,7)}:makeQuestion("fallback",cat,`evidence|Evaluate the evidence used in this scientific claim.|A strong response considers source, method, data quality, uncertainty and alternatives.`,d+1,col);
    return{...q,col,row:d,value:(d+1)*100,used:false,daily:false}
  }));
  if(state.settings.daily){shuffle(state.board.filter(q=>q.row>0)).slice(0,2).forEach(q=>q.daily=true)}
  state.history=[];state.analytics=[];state.phase="board";applyPreferences();save();showGame()
}
function showGame(){applyPreferences();$("#setupScreen").classList.remove("active");$("#gameScreen").classList.add("active");$("#gameScreen").style.display="block";renderScores();renderBoard();$("#finalBtn").hidden=!state.settings.final}
function renderScores(){$("#scorebar").innerHTML=state.teams.map((t,i)=>`<div class="team-card ${i===state.active?"active":""}"><button data-team="${i}" title="Make active"><strong>${esc(t.name)}</strong><span>${t.score.toLocaleString("en-AU")}</span></button></div>`).join("");$$("[data-team]").forEach(b=>b.onclick=()=>{snapshot("Change active team");state.active=+b.dataset.team;save();renderScores()})}
function renderBoard(){const cats=[...new Map(state.board.map(q=>[q.col,q.category])).values()];$("#board").innerHTML=cats.map(c=>`<div class="category">${esc(c)}</div>`).join("")+Array.from({length:5},(_,row)=>state.board.filter(q=>q.row===row).sort((a,b)=>a.col-b.col).map(q=>`<button class="tile ${q.used?"used":""}" data-id="${q.id}" ${q.used?"disabled":""}>${q.value}</button>`).join("")).join("");$$(".tile:not(.used)").forEach(b=>b.onclick=()=>openClue(b.dataset.id))}
function stimulusHtml(q){if(q.type==="graph")return `<strong>Evidence display</strong><div class="mini-graph" aria-label="Bar graph with increasing values">${[28,43,61,78,72].map((v,i)=>`<i style="height:${v}%" data-v="${[12,19,27,35,32][i]}"></i>`).join("")}</div><small>Values are illustrative. Interpret the pattern before answering.</small>`;if(q.type==="table")return `<table class="data-table"><caption>Investigation results</caption><tr><th>Trial</th><th>Condition A</th><th>Condition B</th></tr>${[[1,12,15],[2,13,18],[3,11,17],[4,12,19]].map(r=>`<tr>${r.map(v=>`<td>${v}</td>`).join("")}</tr>`).join("")}</table>`;if(q.type==="diagram")return `<div class="diagram"><div>Observation</div><b>→ evidence →</b><div>Scientific claim</div></div>`;if(q.type==="image")return `<figure style="margin:0;text-align:center"><img src="../../../invsci.png" alt="Investigating Science course image supplied as a visual stimulus" style="max-height:220px;max-width:100%;border-radius:16px"><figcaption>Visual stimulus: identify what further context or evidence would be needed before drawing a conclusion.</figcaption></figure>`;if(q.type==="scenario")return `<strong>Scenario</strong><p>A research team reports this finding after a small classroom investigation. Consider the design, evidence and limits before responding.</p>`;return""}
function openClue(id){const q=state.board.find(x=>x.id===id);if(!q)return;state.current=id;$("#clueMeta").textContent=`${q.category} • ${q.value}`;$("#question").textContent=q.question;$("#answer").innerHTML=`<strong>Expected answer:</strong> ${esc(q.answer)}`;$("#answer").classList.remove("show");const stim=stimulusHtml(q);$("#stimulus").innerHTML=stim;$("#stimulus").hidden=!stim;$("#clueModal").classList.add("open");if(q.daily)showDailyWager(q);else showQuestionActions();startTimer()}
function showQuestionActions(){$("#clueActions").innerHTML=`<button class="secondary" id="timerBtn">Start / restart timer</button><button class="secondary" id="revealBtn">Reveal answer</button><button class="secondary" id="closeClue">Return to board</button>`;$("#timerBtn").onclick=startTimer;$("#revealBtn").onclick=revealAnswer;$("#closeClue").onclick=()=>closeClue(false)}
function revealAnswer(){stopTimer();$("#answer").classList.add("show");$("#clueActions").innerHTML=`<button class="correct" id="correctBtn">✓ Correct — ${esc(state.teams[state.active].name)}</button><button class="incorrect" id="wrongBtn">✕ Incorrect — ${esc(state.teams[state.active].name)}</button><button class="secondary" id="noAnswerBtn">No answer</button>`;$("#correctBtn").onclick=()=>mark(true);$("#wrongBtn").onclick=()=>mark(false);$("#noAnswerBtn").onclick=()=>mark(false,true)}
function startTimer(){stopTimer();seconds=state.settings.timer;$("#timer").textContent=seconds?seconds+" s":"Unlimited";$("#timer").classList.remove("low");if(!seconds)return;timerId=setInterval(()=>{seconds--;$("#timer").textContent=seconds+" s";if(seconds<=5)$("#timer").classList.add("low");if(seconds<=0){stopTimer();beep(220,.25);if(state.settings.autoReveal)revealAnswer()}},1000)}
function stopTimer(){clearInterval(timerId);timerId=null}
function mark(correct,noAnswer=false){const q=state.board.find(x=>x.id===state.current),team=state.teams[state.active];snapshot(correct?"Correct":"Incorrect");const pts=q.daily?(q.wager||q.value):q.value;team.score+=correct?pts:-pts;team[correct?"correct":"incorrect"]++;state.analytics.push({time:new Date().toISOString(),team:team.name,category:q.category,difficulty:q.difficulty,value:q.value,wager:q.wager||"",result:correct?"Correct":noAnswer?"No answer":"Incorrect",question:q.question});
  q.used=true;
  beep(correct?850:180);
  if(!correct)state.active=(state.active+1)%state.teams.length;
  closeClue(true);
}
function closeClue(saveIt){stopTimer();$("#clueModal").classList.remove("open");$("#stealMsg")?.remove();state.current=null;if(saveIt)save();renderScores();renderBoard();if(state.board.every(q=>q.used)){state.settings.final?openFinal():showResults()}}
function showDailyWager(q){stopTimer();const max=Math.max(500,state.teams[state.active].score);$("#question").innerHTML=`<span style="color:#b07a00">DAILY DOUBLE</span><br>${esc(state.teams[state.active].name)}, enter a wager from 0 to ${max.toLocaleString("en-AU")}.</span>`;$("#stimulus").hidden=true;$("#clueActions").innerHTML=`<input id="wager" type="number" min="0" max="${max}" value="${Math.min(q.value,max)}" style="padding:12px;border:1px solid var(--line);border-radius:10px"><button class="correct" id="lockWager">Lock wager & show clue</button>`;$("#lockWager").onclick=()=>{q.wager=Math.max(0,Math.min(max,+$("#wager").value||0));$("#question").textContent=q.question;const stim=stimulusHtml(q);$("#stimulus").innerHTML=stim;$("#stimulus").hidden=!stim;showQuestionActions();startTimer()}}
function openCustom(){const items=getCustom();$("#genericCard").innerHTML=`<h2>Teacher Picks</h2><p class="muted">Create questions for board generation. They remain saved on this device.</p><div class="setup-grid"><div><div class="field"><label>Category</label><input id="cCat" value="Teacher Picks"></div><div class="field"><label>Question</label><textarea id="cQ" rows="3"></textarea></div><div class="field"><label>Expected answer</label><textarea id="cA" rows="3"></textarea></div><div class="field"><label>Difficulty</label><select id="cD">${[1,2,3,4,5].map(n=>`<option value="${n}">${n} — ${n*100} points</option>`).join("")}</select></div><button class="btn primary" id="addCustom">Save Teacher Pick</button></div><div><strong>Saved questions</strong><div class="custom-list">${items.map((x,i)=>`<div class="custom-item"><span><b>${esc(x.category)}</b> — ${esc(x.question)}</span><button class="secondary" data-del="${i}">Delete</button></div>`).join("")||"<p>No questions saved yet.</p>"}</div></div></div><div class="builder-actions"><button class="btn secondary" id="closeGeneric">Done</button></div>`;$("#genericModal").classList.add("open");$("#addCustom").onclick=()=>{if(!$("#cQ").value.trim()||!$("#cA").value.trim())return toast("Add both a question and answer.");const d=+$("#cD").value;items.push({id:"custom-"+Date.now(),bank:"teacher",category:$("#cCat").value.trim()||"Teacher Picks",topic:$("#cQ").value.trim().slice(0,40),question:$("#cQ").value.trim(),answer:$("#cA").value.trim(),difficulty:d,value:d*100,type:"text",custom:true});setCustom(items);openCustom()};$$("[data-del]").forEach(b=>b.onclick=()=>{items.splice(+b.dataset.del,1);setCustom(items);openCustom()});$("#closeGeneric").onclick=closeGeneric}
function closeGeneric(){$("#genericModal").classList.remove("open")}
function openFinal(){closeClue(false);$("#genericCard").innerHTML=`<h2>Final Jeopardy</h2><p class="muted">Category: <strong>Scientific evidence and society</strong>. Enter each team's secret wager, then reveal the clue.</p><div class="final-wagers">${state.teams.map((t,i)=>`<div class="final-team"><strong>${esc(t.name)}</strong><small> Score: ${t.score}</small><input type="number" min="0" max="${Math.max(0,t.score)}" value="0" data-fw="${i}"></div>`).join("")}</div><div class="builder-actions"><button class="btn primary" id="showFinalQ">Lock wagers & show clue</button><button class="btn secondary" id="cancelFinal">Back to board</button></div>`;$("#genericModal").classList.add("open");$("#showFinalQ").onclick=()=>{$$("[data-fw]").forEach(x=>state.teams[+x.dataset.fw].wager=Math.max(0,Math.min(Math.max(0,state.teams[+x.dataset.fw].score),+x.value||0)));showFinalQuestion()};$("#cancelFinal").onclick=closeGeneric}
function showFinalQuestion(){$("#genericCard").innerHTML=`<h2>Final Jeopardy</h2><div class="question">A scientific claim could lead to a major public policy change. What four features would you examine before deciding how much confidence to place in it?</div><div id="finalAnswer" class="answer"><strong>Expected answer:</strong> Any justified four such as source expertise and conflicts, study design, sample and controls, data quality, uncertainty, replication, converging evidence, limitations and plausible alternatives.</div><div class="builder-actions"><button class="btn secondary" id="finalReveal">Reveal answer</button></div><div id="finalMarks"></div>`;$("#finalReveal").onclick=()=>{$("#finalAnswer").classList.add("show");renderFinalMarks()}}
function renderFinalMarks(){$("#finalMarks").innerHTML=`<h3>Mark each team</h3><div class="final-wagers">${state.teams.map((t,i)=>`<div class="final-team"><strong>${esc(t.name)}</strong><div>Wager: ${t.wager||0}</div><div class="mark-row"><button class="correct" data-fmark="${i}:1">Correct</button><button class="incorrect" data-fmark="${i}:0">Incorrect</button></div></div>`).join("")}</div><div class="builder-actions"><button class="btn primary" id="finishFinal">Score & show results</button></div>`;$$("[data-fmark]").forEach(b=>b.onclick=()=>{const[i,v]=b.dataset.fmark.split(":");state.finalMarks[i]=v==="1";b.parentElement.querySelectorAll("button").forEach(x=>x.style.opacity=x===b?"1":".35")});$("#finishFinal").onclick=()=>{snapshot("Final Jeopardy");state.teams.forEach((t,i)=>{const ok=!!state.finalMarks[i];t.score+=ok?(t.wager||0):-(t.wager||0);state.analytics.push({time:new Date().toISOString(),team:t.name,category:"Final Jeopardy",difficulty:5,value:"",wager:t.wager||0,result:ok?"Correct":"Incorrect",question:"Evaluate a policy-relevant scientific claim."})});save();closeGeneric();showResults()}}
function showResults(){closeGeneric();const sorted=[...state.teams].sort((a,b)=>b.score-a.score),attempts=state.analytics.length,correct=state.analytics.filter(x=>x.result==="Correct").length,unanswered=state.analytics.filter(x=>x.category!=="Final Jeopardy"&&x.result!=="Correct");$("#genericCard").innerHTML=`<h2>Game results</h2><div class="results-grid"><div class="result-card"><small>Winner</small><h3>${esc(sorted[0].name)}</h3><strong>${sorted[0].score.toLocaleString("en-AU")} points</strong></div><div class="result-card"><small>Questions attempted</small><h3>${attempts}</h3></div><div class="result-card"><small>Class accuracy</small><h3>${attempts?Math.round(correct/attempts*100):0}%</h3></div></div><h3 style="margin-top:18px">Team summary</h3><table class="data-table"><tr><th>Team</th><th>Score</th><th>Correct</th><th>Incorrect</th></tr>${sorted.map(t=>`<tr><td>${esc(t.name)}</td><td>${t.score}</td><td>${t.correct}</td><td>${t.incorrect}</td></tr>`).join("")}</table><h3 style="margin-top:18px">Category performance</h3><div class="results-grid">${categoryStats().map(x=>`<div class="result-card"><strong>${esc(x.cat)}</strong><div>${x.correct}/${x.total} correct</div></div>`).join("")||"<p>No clues marked.</p>"}</div><h3 style="margin-top:18px">Difficulty performance</h3><div class="results-grid">${difficultyStats().map(x=>`<div class="result-card"><strong>${x.difficulty*100} points</strong><div>${x.correct}/${x.total} correct</div></div>`).join("")||"<p>No clues marked.</p>"}</div><h3 style="margin-top:18px">Questions nobody answered correctly</h3><div class="results-grid">${unanswered.map(x=>`<div class="result-card"><strong>${esc(x.category)} — ${x.value}</strong><div>${esc(x.question)}</div></div>`).join("")||"<p>Every attempted question was answered correctly.</p>"}</div><div class="builder-actions"><button class="btn primary" id="csvBtn">Export analytics CSV</button><button class="btn secondary" id="newGame">New game</button></div>`;$("#genericModal").classList.add("open");$("#csvBtn").onclick=exportCSV;$("#newGame").onclick=()=>{localStorage.removeItem(KEY);location.reload()}}
function categoryStats(){const m={};state.analytics.forEach(x=>{m[x.category]??={cat:x.category,total:0,correct:0};m[x.category].total++;if(x.result==="Correct")m[x.category].correct++});return Object.values(m)}
function difficultyStats(){const m={};state.analytics.filter(x=>x.category!=="Final Jeopardy").forEach(x=>{m[x.difficulty]??={difficulty:x.difficulty,total:0,correct:0};m[x.difficulty].total++;if(x.result==="Correct")m[x.difficulty].correct++});return Object.values(m).sort((a,b)=>a.difficulty-b.difficulty)}
function exportCSV(){const rows=[["Timestamp","Team","Category","Difficulty","Tile value","Wager","Result","Question"],...state.analytics.map(x=>[x.time,x.team,x.category,x.difficulty,x.value,x.wager,x.result,x.question])];const csv=rows.map(r=>r.map(v=>'"'+String(v??"").replaceAll('"','""')+'"').join(",")).join("\r\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="investigating-science-jeopardy-analytics.csv";a.click();URL.revokeObjectURL(a.href)}
function undo(){const h=state.history.pop();if(!h)return toast("Nothing to undo.");state.teams=h.teams;state.active=h.active;state.board=h.board;state.analytics=h.analytics;save();renderScores();renderBoard();toast("Undone: "+h.label)}
function loadGame(){try{Object.assign(state,JSON.parse(localStorage.getItem(KEY)));showGame()}catch{toast("Saved game could not be loaded.")}}
$("#generateBtn").onclick=generateBoard;$("#customBtn").onclick=openCustom;$("#resumeBtn").onclick=loadGame;$("#undoBtn").onclick=undo;$("#changeTeamBtn").onclick=()=>{snapshot("Change active team");state.active=(state.active+1)%state.teams.length;save();renderScores()};$("#builderBtn").onclick=()=>{save();$("#gameScreen").style.display="none";$("#gameScreen").classList.remove("active");$("#setupScreen").classList.add("active");$("#resumeBtn").hidden=false};$("#finalBtn").onclick=openFinal;$("#endBtn").onclick=showResults;$("#fitBtn").onclick=()=>document.body.classList.toggle("fit");$("#fullBtn").onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();init();
</script>
</body>
</html>
