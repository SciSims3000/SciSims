bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px}.team-card{border:2px solid #ffffff27;border-radius:14px;padding:10px;text-align:center;background:#ffffff10;position:relative}.team-card.active{border-color:var(--gold);background:#ffcf3320;transform:translateY(-2px)}.team-card button{all:unset;cursor:pointer;display:block;width:100%}.team-card strong{display:block}.team-card span{font-size:1.35rem;font-weight:950;color:var(--gold)}.game-tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.board{display:grid;grid-template-columns:repeat(6,minmax(130px,1fr));gap:8px}.category{min-height:82px;display:grid;place-items:center;text-align:center;padding:9px;border-radius:12px;background:linear-gradient(160deg,#1471e8,#0a3c99);font-weight:900;text-transform:uppercase;font-size:clamp(.72rem,1.25vw,1rem);letter-spacing:.025em}.tile{min-height:91px;border:0;border-radius:12px;background:linear-gradient(155deg,#0b4bc0,#062f82);color:var(--gold);font-size:clamp(1.35rem,2.7vw,2.25rem);font-weight:950;text-shadow:0 3px 0 #0005;position:relative}.tile:hover{filter:brightness(1.14);transform:translateY(-2px)}.tile.used{background:#081b45;color:#4f638e;cursor:default;text-shadow:none}.replace{position:absolute;right:5px;top:5px;border:0;border-radius:7px;padding:3px 6px;background:#fff2;color:#fff;font-size:.66rem}.replace:hover{background:#fff4}.modal{position:fixed;inset:0;display:none;place-items:center;background:#02091de8;z-index:30;padding:16px}.modal.open{display:grid}.clue-card{width:min(1120px,100%);max-height:95vh;overflow:auto;background:#fff;color:var(--ink);border-radius:26px;padding:clamp(20px,4vw,42px);box-shadow:0 30px 100px #0008}.clue-head{display:flex;gap:10px;justify-content:space-between;align-items:center}.clue-meta{color:var(--blue);font-weight:900;text-transform:uppercase}.timer{font-size:1.25rem;font-weight:950;padding:8px 12px;border-radius:12px;background:#eaf1ff}.timer.low{background:#ffe3e8;color:#b01835}.stimulus{margin:20px 0;padding:18px;border:1px solid var(--line);border-radius:18px;background:#f5f8ff}.question{font-size:clamp(1.35rem,3vw,2.45rem);line-height:1.25;font-weight:850;margin:22px 0}.answer{display:none;padding:18px;border-radius:16px;background:#e8f8f1;border:2px solid #8bd2b5;font-size:1.18rem}.answer.show{display:block}.clue-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}.clue-actions button{border:0;border-radius:12px;padding:12px 16px;font-weight:900}.correct{background:var(--green);color:#fff}.incorrect{background:var(--red);color:#fff}.secondary{background:#e7eefb;color:var(--ink)}.data-table{border-collapse:collapse;margin:auto;min-width:min(520px,100%)}.data-table th,.data-table td{border:1px solid #9cb0d1;padding:9px;text-align:center}.mini-graph{height:210px;display:flex;align-items:flex-end;gap:8px;padding:20px 20px 30px;border-left:3px solid #41577d;border-bottom:3px solid #41577d}.mini-graph i{flex:1;background:linear-gradient(#39d3ff,#0b4bc0);min-width:24px;position:relative}.mini-graph i::after{content:attr(data-v);position:absolute;top:-24px;width:100%;text-align:center;font-style:normal;font-weight:800}.diagram{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;text-align:center}.diagram div{padding:22px;border:2px solid #6b82a8;border-radius:50px;font-weight:850}.results-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.result-card{background:#eef3fc;border-radius:14px;padding:14px}.custom-list{max-height:190px;overflow:auto;margin-top:10px}.custom-item{display:flex;justify-content:space-between;gap:8px;padding:8px;border-bottom:1px solid var(--line)}.toast{position:fixed;bottom:20px;left:50%;translate:-50% 20px;background:#081b45;color:#fff;padding:11px 17px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;z-index:50}.toast.show{opacity:1;translate:-50% 0}.screen{display:none}.screen.active{display:block}.final-wagers{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}.final-team{padding:12px;border:1px solid var(--line);border-radius:13px}.final-team input{width:100%;padding:8px;border:1px solid var(--line);border-radius:9px}.mark-row{display:flex;gap:6px;margin-top:8px}.mark-row button{flex:1;border:0;border-radius:9px;padding:8px;font-weight:850}.fit .app{width:100%;margin:0;padding:8px}.fit #scisimsSiteNav,.fit .brand small{display:none}.fit .category{min-height:10vh}.fit .tile{min-height:13vh}@media(max-width:900px){.setup-grid{grid-template-columns:1fr}.board{overflow-x:auto;grid-template-columns:repeat(6,minmax(118px,1fr))}.teams-edit{grid-template-columns:1fr}}@media(max-width:560px){.app{width:min(100% - 12px,1550px)}.panel{padding:15px}.checks{grid-template-columns:1fr}.clue-card{border-radius:18px}.question{font-size:1.4rem}}

<script>
"use strict";
const BANKS=[["m1","Module 1 — The Foundations of Scientific Thinking","The Foundations of Scientific Thinking"],["m2","Module 2 — The Scientific Research Proposal","The Scientific Research Proposal"],["m3","Module 3 — The Data, Evidence and Decisions","The Data, Evidence and Decisions"],["m4","Module 4 — The Scientific Research Report","The Scientific Research Report"],["working","Working Scientifically","Skills across Stage 6"],["glossary","Syllabus Glossary","Terms in context"],["y11","Whole Science Extension Review","Modules 1–4"],["stage6","Mixed Science Extension Review","Modules 1–4"],["teacher","Teacher Picks","Your saved questions"]];
const CONTENT={"m1":[["The Foundations of Scientific Thinking — Foundations",["Epistemology|Define Epistemology.|The branch of philosophy concerned with the origin, nature, methods and limits of knowledge.","Empiricism|Explain the scientific significance of Empiricism.|The view that reliable knowledge is grounded in observation and experience through the senses.","Rationalism|Apply Rationalism to a relevant scientific scenario.|The view that reason and logical analysis are major sources of knowledge.","Scientific thinking|Analyse how Scientific thinking contributes to explaining or investigating a system.|Reasoning that uses evidence, testable explanations, logical argument and critical evaluation.","Scientific inquiry|Evaluate the role, usefulness or limitations of Scientific inquiry in this course.|A systematic process used to investigate questions and develop evidence-based explanations."]],["The Foundations of Scientific Thinking — Structures and systems",["Alternative ways of knowing|Define Alternative ways of knowing.|Knowledge systems or approaches that may use cultural, historical, experiential or philosophical foundations.","Cultural observation|Explain the scientific significance of Cultural observation.|Knowledge developed through repeated observations interpreted within a particular cultural context.","Traditional knowledge|Apply Traditional knowledge to a relevant scientific scenario.|Knowledge accumulated and transmitted within communities over many generations.","Aboriginal navigation|Analyse how Aboriginal navigation contributes to explaining or investigating a system.|Use of detailed knowledge of Country, sky, landscape, water and seasonal patterns to navigate.","Celestial navigation|Evaluate the role, usefulness or limitations of Celestial navigation in this course.|Determining direction or position using observed celestial objects."]],["The Foundations of Scientific Thinking — Processes",["Induction|Define Induction.|Reasoning from particular observations towards a general conclusion.","Deduction|Explain the scientific significance of Deduction.|Reasoning from accepted premises or general principles towards a specific conclusion.","Abduction|Apply Abduction to a relevant scientific scenario.|Selecting the most plausible explanation for a set of observations.","Premise|Analyse how Premise contributes to explaining or investigating a system.|A statement used as a starting point in an argument.","Conclusion|Evaluate the role, usefulness or limitations of Conclusion in this course.|A judgement supported by evidence or derived through reasoning."]],["The Foundations of Scientific Thinking — Evidence and applications",["Philosophical argument|Define Philosophical argument.|A connected series of statements presenting reasons for accepting a conclusion.","Valid argument|Explain the scientific significance of Valid argument.|An argument in which the conclusion follows logically from the premises.","Sound argument|Apply Sound argument to a relevant scientific scenario.|A valid argument whose premises are also true or well supported.","Parsimony|Analyse how Parsimony contributes to explaining or investigating a system.|Preference for the least complicated explanation that adequately accounts for the evidence.","Occam’s razor|Evaluate the role, usefulness or limitations of Occam’s razor in this course.|The principle that unnecessary assumptions should not be added when simpler explanations fit equally well."]],["The Foundations of Scientific Thinking — Analysis",["Falsifiability|Define Falsifiability.|The requirement that a scientific claim can, in principle, be shown false by evidence.","Testability|Explain the scientific significance of Testability.|The capacity of a claim or hypothesis to be examined using observations or measurements.","Reproducibility|Apply Reproducibility to a relevant scientific scenario.|The capacity for an independent investigation to obtain compatible findings using the described approach.","Confirmation bias|Analyse how Confirmation bias contributes to explaining or investigating a system.|The tendency to seek or interpret information in ways that support an existing belief.","Theory-dependence of observation|Evaluate the role, usefulness or limitations of Theory-dependence of observation in this course.|The influence of prior concepts and expectations on what is noticed and how observations are interpreted."]],["The Foundations of Scientific Thinking — Synthesis and evaluation",["Observer bias|Define Observer bias.|Systematic influence of an investigator’s expectations on observation, measurement or interpretation.","Scientific scepticism|Explain the scientific significance of Scientific scepticism.|Withholding acceptance of a claim until sufficient reliable evidence is available.","Scientific objectivity|Apply Scientific objectivity to a relevant scientific scenario.|Efforts to minimise personal influence through transparent methods, evidence and critical review.","Anomaly|Analyse how Anomaly contributes to explaining or investigating a system.|An observation or result that does not fit the current accepted explanation.","Paradigm|Evaluate the role, usefulness or limitations of Paradigm in this course.|A shared framework of concepts, assumptions, methods and standards used by a scientific community."]]],"m2":[["The Scientific Research Proposal — Foundations",["Scientific Research Project|Define Scientific Research Project.|The sustained investigation through which a student develops evidence-based responses to a research question.","Scientific Research Proposal|Explain the scientific significance of Scientific Research Proposal.|A structured plan explaining the question, hypothesis, rationale, methods, data and feasibility of proposed research.","Scientific Research Portfolio|Apply Scientific Research Portfolio to a relevant scientific scenario.|A documented collection of evidence showing the development and conduct of the research project.","Research area|Analyse how Research area contributes to explaining or investigating a system.|The broad scientific field or topic within which a research problem is identified.","Research problem|Evaluate the role, usefulness or limitations of Research problem in this course.|A significant issue, uncertainty or gap that can be investigated scientifically."]],["The Scientific Research Proposal — Structures and systems",["Research question|Define Research question.|A focused, meaningful and feasible question that directs scientific research.","Initial hypothesis|Explain the scientific significance of Initial hypothesis.|A preliminary testable explanation developed early from the research question and literature.","Final hypothesis|Apply Final hypothesis to a relevant scientific scenario.|The refined hypothesis adopted after detailed review and planning.","Causal hypothesis|Analyse how Causal hypothesis contributes to explaining or investigating a system.|A testable statement proposing that change in one variable produces change in another.","Null hypothesis|Evaluate the role, usefulness or limitations of Null hypothesis in this course.|A statistical statement proposing no effect, difference or association."]],["The Scientific Research Proposal — Processes",["Alternative hypothesis|Define Alternative hypothesis.|A statistical statement proposing an effect, difference or association.","Literature search|Explain the scientific significance of Literature search.|A systematic process for finding relevant published research and data.","Literature review|Apply Literature review to a relevant scientific scenario.|A critical synthesis of existing research used to establish context, evidence and gaps.","Peer-reviewed source|Analyse how Peer-reviewed source contributes to explaining or investigating a system.|Research evaluated by relevant experts before publication.","Scholarly journal|Evaluate the role, usefulness or limitations of Scholarly journal in this course.|A publication containing research and analysis written for an academic or professional audience."]],["The Scientific Research Proposal — Evidence and applications",["Search term|Define Search term.|A word or phrase entered into a database to locate relevant sources.","Boolean operator|Explain the scientific significance of Boolean operator.|A search command such as AND, OR or NOT used to combine search terms.","Citation searching|Apply Citation searching to a relevant scientific scenario.|Locating research through references cited by or citing a known source.","Source relevance|Analyse how Source relevance contributes to explaining or investigating a system.|The extent to which a source directly addresses the research question.","Source reliability|Evaluate the role, usefulness or limitations of Source reliability in this course.|The trustworthiness of information based on expertise, methods, evidence and transparency."]],["The Scientific Research Proposal — Analysis",["Source validity|Define Source validity.|The extent to which a source appropriately measures or supports the claim being examined.","Contemporary data set|Explain the scientific significance of Contemporary data set.|A current or recent organised collection of data relevant to the investigation.","Publicly available data set|Apply Publicly available data set to a relevant scientific scenario.|A data set that can be accessed by researchers or the public under stated conditions.","Primary data|Analyse how Primary data contributes to explaining or investigating a system.|Data collected directly by the researcher for the current investigation.","Secondary-sourced data|Evaluate the role, usefulness or limitations of Secondary-sourced data in this course.|Data originally produced by other people and used in a new investigation."]],["The Scientific Research Proposal — Synthesis and evaluation",["Large data set|Define Large data set.|A data collection large enough to require computational processing and support statistical analysis.","Open data|Explain the scientific significance of Open data.|Data made available for access, reuse and redistribution under stated conditions.","Metadata|Apply Metadata to a relevant scientific scenario.|Information describing the origin, structure, variables and conditions of a data set.","Data provenance|Analyse how Data provenance contributes to explaining or investigating a system.|A record of where data came from and how it was collected, processed and changed.","Research significance|Evaluate the role, usefulness or limitations of Research significance in this course.|The importance of the question and the value of answering it."]]],"m3":[["The Data, Evidence and Decisions — Foundations",["Data|Define Data.|Recorded observations, measurements, categories or values collected during research.","Evidence|Explain the scientific significance of Evidence.|Data interpreted in relation to a claim, hypothesis or research question.","Raw data|Apply Raw data to a relevant scientific scenario.|Data in its original collected form before substantial processing.","Processed data|Analyse how Processed data contributes to explaining or investigating a system.|Data transformed, summarised or organised to support analysis.","Qualitative data|Evaluate the role, usefulness or limitations of Qualitative data in this course.|Descriptive, textual or categorical information."]],["The Data, Evidence and Decisions — Structures and systems",["Quantitative data|Define Quantitative data.|Numerical information produced through counting or measurement.","Structured data|Explain the scientific significance of Structured data.|Data organised into defined fields or tables.","Unstructured data|Apply Unstructured data to a relevant scientific scenario.|Data without a fixed tabular form, such as text, images or audio.","Data set|Analyse how Data set contributes to explaining or investigating a system.|An organised collection of related data.","Content analysis|Evaluate the role, usefulness or limitations of Content analysis in this course.|Systematic analysis of characteristics or content within a resource."]],["The Data, Evidence and Decisions — Processes",["Thematic analysis|Define Thematic analysis.|Identification and coding of recurring themes or patterns in qualitative data.","Coding|Explain the scientific significance of Coding.|Assigning labels or categories to observations or qualitative material.","Descriptive statistics|Apply Descriptive statistics to a relevant scientific scenario.|Numerical methods used to summarise and describe features of data.","Mean|Analyse how Mean contributes to explaining or investigating a system.|The arithmetic average of numerical values.","Median|Evaluate the role, usefulness or limitations of Median in this course.|The middle value when observations are placed in order."]],["The Data, Evidence and Decisions — Evidence and applications",["Mode|Define Mode.|The most frequently occurring value or category.","Range|Explain the scientific significance of Range.|The difference between the maximum and minimum values.","Variance|Apply Variance to a relevant scientific scenario.|The average squared deviation from the mean.","Standard deviation|Analyse how Standard deviation contributes to explaining or investigating a system.|A measure of the typical spread of values around the mean.","Distribution|Evaluate the role, usefulness or limitations of Distribution in this course.|The pattern of values and their frequencies within a data set."]],["The Data, Evidence and Decisions — Analysis",["Normal distribution|Define Normal distribution.|A symmetric bell-shaped probability distribution described by its mean and standard deviation.","Skewed distribution|Explain the scientific significance of Skewed distribution.|A distribution with a longer tail on one side.","Outlier|Apply Outlier to a relevant scientific scenario.|An observation unusually distant from the general pattern of a data set.","Pattern|Analyse how Pattern contributes to explaining or investigating a system.|A repeated or recognisable arrangement within data.","Trend|Evaluate the role, usefulness or limitations of Trend in this course.|A general direction of change shown by data."]],["The Data, Evidence and Decisions — Synthesis and evaluation",["Relationship|Define Relationship.|An association or dependency between variables.","Spreadsheet|Explain the scientific significance of Spreadsheet.|Software that stores, calculates, sorts and graphs tabular data.","Graphical representation|Apply Graphical representation to a relevant scientific scenario.|A visual display of data such as a graph, chart or plot.","Scatter plot|Analyse how Scatter plot contributes to explaining or investigating a system.|A graph showing paired numerical observations for two variables.","Histogram|Evaluate the role, usefulness or limitations of Histogram in this course.|A graph showing the frequency distribution of continuous numerical data."]]],"m4":[["The Scientific Research Report — Foundations",["Scientific Research Report|Define Scientific Research Report.|A concise, structured and evidence-based account of completed scientific research.","Scientific Research Portfolio|Explain the scientific significance of Scientific Research Portfolio.|A collection documenting planning, evidence, decisions and development of the research project.","Research finding|Apply Research finding to a relevant scientific scenario.|A result or conclusion produced through analysis of research data.","Inference|Analyse how Inference contributes to explaining or investigating a system.|An interpretation drawn from observations and evidence.","Generalisation|Evaluate the role, usefulness or limitations of Generalisation in this course.|A broader statement extended from a sample or set of observations."]],["The Scientific Research Report — Structures and systems",["Scientific conclusion|Define Scientific conclusion.|A judgement addressing the research question and supported by analysed evidence.","Title|Explain the scientific significance of Title.|A concise statement identifying the focus of a scientific report.","Abstract|Apply Abstract to a relevant scientific scenario.|A brief summary of the question, method, major results and conclusion.","Introduction|Analyse how Introduction contributes to explaining or investigating a system.|The section establishing scientific background, rationale, question and hypothesis.","Methodology section|Evaluate the role, usefulness or limitations of Methodology section in this course.|The section explaining and justifying how data were obtained and analysed."]],["The Scientific Research Report — Processes",["Results section|Define Results section.|The section presenting processed findings without extensive interpretation.","Discussion section|Explain the scientific significance of Discussion section.|The section interpreting findings, comparing evidence and evaluating limitations.","Conclusion section|Apply Conclusion section to a relevant scientific scenario.|The section providing the final evidence-based response to the question or hypothesis.","Reference list|Analyse how Reference list contributes to explaining or investigating a system.|A consistently formatted list of sources cited in the report.","Bibliography|Evaluate the role, usefulness or limitations of Bibliography in this course.|A list of cited and sometimes additionally consulted sources."]],["The Scientific Research Report — Evidence and applications",["Appendix|Define Appendix.|Supplementary material placed after the main report, such as detailed raw data or procedures.","Table|Explain the scientific significance of Table.|An organised display of values in rows and columns.","Figure|Apply Figure to a relevant scientific scenario.|A visual element such as a graph, diagram, image or model included in a report.","Caption|Analyse how Caption contributes to explaining or investigating a system.|A concise title and explanation accompanying a table or figure.","Raw-data table|Evaluate the role, usefulness or limitations of Raw-data table in this course.|A table containing original observations before substantial processing."]],["The Scientific Research Report — Analysis",["Processed-data table|Define Processed-data table.|A table containing calculated, transformed or summarised data.","Uncertainty analysis|Explain the scientific significance of Uncertainty analysis.|Evaluation and communication of measurement and analytical uncertainty.","Limitation analysis|Apply Limitation analysis to a relevant scientific scenario.|Evaluation of features restricting the strength or interpretation of findings.","Modification|Analyse how Modification contributes to explaining or investigating a system.|A justified change proposed to improve a research method.","Future direction|Evaluate the role, usefulness or limitations of Future direction in this course.|A justified proposal for further research arising from findings or limitations."]],["The Scientific Research Report — Synthesis and evaluation",["Scientific language|Define Scientific language.|Precise discipline-specific terminology and expression used to communicate research.","Technical language|Explain the scientific significance of Technical language.|Specialised vocabulary and conventions used by a professional field.","Concise writing|Apply Concise writing to a relevant scientific scenario.|Communication using only the words needed to express meaning clearly.","Objective tone|Analyse how Objective tone contributes to explaining or investigating a system.|A style focused on evidence and reasoning rather than personal opinion or emotion.","Past tense|Evaluate the role, usefulness or limitations of Past tense in this course.|A grammatical tense commonly used to describe completed methods and observations."]]],"working":[["Questioning",["question|What makes a question investigable?|It can be answered with ethical collection or analysis of evidence.","prediction|What should a scientific prediction include?|An expected outcome grounded in scientific reasoning.","hypothesis|How is a hypothesis evaluated?|By deriving predictions and comparing them with evidence.","variables|Why identify variables before collecting data?|To plan valid measurements and controls.","scope|Why narrow the scope of a question?|To make the study feasible and the conclusion precise."]],["Planning",["method|What makes a method reproducible?|Clear materials, quantities, sequence, controls and measurement details.","safety|What is the hierarchy of controls?|Eliminate, substitute, engineer, administrate, then use personal protective equipment.","ethics|When is ethical approval relevant?|When research involves people, animals, sensitive data or significant impacts.","sample|How should sample size be chosen?|Using expected variation, effect size, design, feasibility and power.","pilot|What can a pilot test?|Timing, instructions, instruments, data capture and practical risks."]],["Conducting",["recording|Why record data immediately?|It reduces memory error and preserves an auditable record.","units|Why use SI units where appropriate?|They support consistent comparison and communication.","repeats|Why repeat measurements?|To estimate random variation and improve the precision of an average.","anomaly|What should happen when an anomaly appears?|Check records and method, repeat if justified and report transparently.","provenance|What is data provenance?|A record of where data came from and how it was produced or changed."]],["Processing",["table|What makes a good data table?|Clear headings, units, consistent precision and organised raw values.","graph|How is a graph type selected?|Match it to variable types and the relationship or distribution being shown.","calculation|Why show a sample calculation?|It makes processing transparent and checkable.","normalisation|What is normalisation used for?|Making values comparable by adjusting for scale or another factor.","uncertainty|How can uncertainty propagate?|Uncertainty in inputs contributes to uncertainty in calculated outputs."]],["Analysing",["pattern|What distinguishes a pattern from noise?|It is consistent enough, relative to variation, to warrant explanation.","association|Why is association not automatically causation?|Confounding, reverse causation or chance may explain it.","uncertainty|Why include uncertainty in analysis?|Point estimates alone overstate precision.","limitations|Where should limitations be considered?|In interpreting how methods and data constrain conclusions.","alternative explanation|Why test alternative explanations?|The preferred explanation should outperform credible rivals."]],["Communicating",["audience|How should communication change for an audience?|Adjust language and format without distorting evidence or uncertainty.","citation|Why cite sources?|To credit work and let readers inspect supporting evidence.","visualisation|What makes a visualisation honest?|Proportionate scales, clear labels, context and no selective omission.","conclusion|What belongs in a conclusion?|A direct evidence-based answer, uncertainty and scope.","peer feedback|What is the value of peer feedback?|It can detect errors and improve reasoning and clarity."]]],"glossary":[["Syllabus Glossary — Foundations",["Aboriginal and Torres Strait Islander Peoples|Define Aboriginal and Torres Strait Islander Peoples.|Australia’s Indigenous peoples, comprising diverse Aboriginal language groups and Torres Strait Islander cultural groups.","Content analysis|Explain the scientific significance of Content analysis.|Strategies used to analyse the characteristics or content of a resource.","Correlation|Apply Correlation to a relevant scientific scenario.|Interdependence or statistical association between variable quantities.","Cultural observations|Analyse how Cultural observations contributes to explaining or investigating a system.|Traditional knowledge based on observations interpreted through local culture, philosophy and practices.","Data cleansing|Evaluate the role, usefulness or limitations of Data cleansing in this course.|Detection and removal or correction of errors and inconsistencies to improve data quality."]],["Syllabus Glossary — Structures and systems",["Data set|Define Data set.|An organised collection of data.","Deduction|Explain the scientific significance of Deduction.|Deriving a conclusion by reasoning from known facts or accepted premises.","Descriptive statistics|Apply Descriptive statistics to a relevant scientific scenario.|Statistics that quantitatively summarise or describe features of information.","Empiricism|Analyse how Empiricism contributes to explaining or investigating a system.|The view that knowledge is based on experience derived through the senses.","Epistemology|Evaluate the role, usefulness or limitations of Epistemology in this course.|The branch of philosophy investigating the origin, nature, methods and limits of knowledge."]],["Syllabus Glossary — Processes",["Ethical framework|Define Ethical framework.|A set of principles or codes guiding behaviour and decisions.","Falsifiability|Explain the scientific significance of Falsifiability.|The requirement that a scientific theory, hypothesis or statement can be tested and potentially shown false.","Hypothesis|Apply Hypothesis to a relevant scientific scenario.|A testable statement proposing a causal relationship between an independent and dependent variable.","Induction|Analyse how Induction contributes to explaining or investigating a system.|Inferring a general conclusion from particular observations or instances.","Large data sets|Evaluate the role, usefulness or limitations of Large data sets in this course.|Data sets large enough to support statistical reliability and require computational analysis to reveal patterns."]],["Syllabus Glossary — Evidence and applications",["Model|Define Model.|A representation that describes, simplifies, clarifies or explains an ply Cultural observations to a relevant scientific scenario.|Traditional knowledge based on observations interpreted through local culture, philosophy and practices.","Data cleansing|Analyse how Data cleansing contributes to explaining or investigating a system.|Detection and removal or correction of errors and inconsistencies to improve data quality.","Data set|Evaluate the role, usefulness or limitations of Data set in this course.|An organised collection of data."]]]};

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const state={teams:[],active:0,board:[],history:[],analytics:[],settings:{},selectedBanks:[],current:null,phase:"setup",finalMarks:{}};

let timerId=null,seconds=0,audioCtx=null;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800);}
function beep(freq=600,dur=.09){if(!state.settings.sound)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=freq;o.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(.07,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);o.start();o.stop(audioCtx.currentTime+dur)}catch{}}
function save(){localStorage.setItem(KEY,JSON.stringify(state));localStorage.setItem(PREF,JSON.stringify(state.teams.map(t=>t.name)));}
function snapshot(label){state.history.push({label,teams:JSON.parse(JSON.stringify(state.teams)),active:state.active,board:JSON.parse(JSON.stringify(state.board)),analytics:JSON.parse(JSON.stringify(state.analytics))});if(state.history.length>80)state.history.shift();}
function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeQuestion(bank,cat,raw,difficulty,index){const [topic,q,a,type="text"]=raw.split("|");return{id:bank+"-"+cat.replace(/\W/g,"")+"-"+index+"-"+Date.now(),bank,category:cat,topic,question:q,answer:a,difficulty,value:difficulty*100,type,used:false,daily:false,custom:false}}
function poolForBank(bank){if(REVIEW_MAP[bank])return REVIEW_MAP[bank].flatMap(b=>poolForBank(b));if(bank==="teacher")return getCustom();return (CONTENT[bank]||[]).flatMap(([cat,rows])=>rows.map((r,i)=>makeQuestion(bank,cat,r,i+1,i)))}
function categoriesFor(bank){if(REVIEW_MAP[bank])return shuffle(REVIEW_MAP[bank].flatMap(b=>(CONTENT[b]||[]).map(([c])=>({bank:b,cat:c}))));return (CONTENT[bank]||[]).map(([cat])=>({bank,cat}))}
function getCustom(){try{return JSON.parse(localStorage.getItem("scisims-scienceextension-jeopardy-custom-v2")||"[]")}catch{return[]}}
function setCustom(v){localStorage.setItem("scisims-scienceextension-jeopardy-custom-v2",JSON.stringify(v))}
function init(){
  const names=(()=>{try{return JSON.parse(localStorage.getItem(PREF)||"null")}catch{return null}})()||["Team Curie","Team Newton","Team Franklin"];
  $("#teamCount").innerHTML=[2,3,4,5,6].map(n=>`<option value="${n}" ${n===names.length?"selected":""}>${n} teams</option>`).join("");
  renderTeamInputs(names);$("#teamCount").onchange=()=>renderTeamInputs(names);
  $("#bankGrid").innerHTML=BANKS.map(([id,title,sub],i)=>`<label class="bank"><input type="checkbox" value="${id}" ${i===12?"checked":""}><span><strong>${title}</strong><br><small>${sub}</small></span></label>`).join("");
  const requestedBank=new URLSearchParams(location.search).get("bank");if(requestedBank){$$("#bankGrid input").forEach(input=>input.checked=input.value===requestedBank)}
  const saved=localStorage.getItem(KEY);$("#resumeBtn").hidden=!saved;
}
function renderTeamInputs(seed=[]){const n=+$("#teamCount").value;$("#teamInputs").innerHTML=Array.from({length:n},(_,i)=>`<div class="field"><label>Team ${i+1}</label><input class="team-name" value="${esc(seed[i]||"Team "+(i+1))}" maxlength="30"></div>`).join("")}
function readSettings(){state.settings={timer:+$("#timerSetting").value,daily:$("#daily").checked,final:$("#finalOn").checked,autoReveal:$("#autoReveal").checked,sound:$("#soundOn").checked,motion:$("#motionOn").checked};state.selectedBanks=$$("#bankGrid input:checked").map(x=>x.value);state.teams=$$(".team-name").map((x,i)=>({name:x.value.trim()||"Team "+(i+1),score:0,correct:0,incorrect:0}));state.active=0}
function applyPreferences(){document.body.classList.toggle("no-motion",state.settings.motion===false)}
function generateBoard(){
  readSettings();if(!state.selectedBanks.length)return toast("Choose at least one content bank.");
  const eligible=state.selectedBanks.filter(b=>b!=="teacher"||getCustom().length);
  if(!eligible.length)return toast("Add a Teacher Pick first.");
  const catCandidates=shuffle(eligible.flatMap(categoriesFor));const chosen=[];for(const c of catCandidates){if(!chosen.some(x=>x.cat===c.cat&&x.bank===c.bank))chosen.push(c);if(chosen.length===6)break}
  while(chosen.length<6){const b=eligible[chosen.length%eligible.length],p=poolForBank(b);chosen.push({bank:b,cat:p[chosen.length%p.length]?.category||"Teacher Picks"})}
  state.board=chosen.flatMap(({bank,cat},col)=>Array.from({length:5},(_,d)=>{
    const candidates=poolForBank(bank).filter(q=>q.category===cat&&q.difficulty===d+1);
    let q=shuffle(candidates)[0]||shuffle(poolForBank(bank).filter(q=>q.difficulty===d+1))[0]||shuffle(poolForBank(bank))[0];
    q=q?{...q,id:q.id+"-"+col+"-"+Math.random().toString(36).slice(2,7)}:makeQuestion("fallback",cat,`evidence|Evaluate the evidence used in this scientific claim.|A strong response considers source, method, data quality, uncertainty and alternatives.`,d+1,col);
    return{...q,col,row:d,value:(d+1)*100,used:false,daily:false}
  }));
  if(state.settings.daily){shuffle(state.board.filter(q=>q.row>0)).slice(0,2).forEach(q=>q.daily=true)}
  state.history=[];state.analytics=[];state.phase="board";applyPreferences();save();showGame()
}
function showGame(){applyPreferences();$("#setupScreen").classList.remove("active");$("#gameScreen").classList.add("active");$("#gameScreen").style.display="block";renderScores();renderBoard();$("#finalBtn").hidden=!state.settings.final}
function renderScores(){$("#scorebar").innerHTML=state.teams.map((t,i)=>`<div class="team-card ${i===state.active?"active":""}"><button data-team="${i}" title="Make active"><strong>${esc(t.name)}</strong><span>${t.score.toLocaleString("en-AU")}</span></button></div>`).join("");$$("[data-team]").forEach(b=>b.onclick=()=>{snapshot("Change active team");state.active=+b.dataset.team;save();renderScores()})}
function renderBoard(){const cats=[...new Map(state.board.map(q=>[q.col,q.category])).values()];$("#board").innerHTML=cats.map(c=>`<div class="category">${esc(c)}</div>`).join("")+Array.from({length:5},(_,row)=>state.board.filter(q=>q.row===row).sort((a,b)=>a.col-b.col).map(q=>`<button class="tile ${q.used?"used":""}" data-id="${q.id}" ${q.used?"disabled":""}>${q.value}</button>`).join("")).join("");$$(".tile:not(.used)").forEach(b=>b.onclick=()=>openClue(b.dataset.id))}
function stimulusHtml(q){if(q.type==="graph")return `<strong>Evidence display</strong><div class="mini-graph" aria-label="Bar graph with increasing values">${[28,43,61,78,72].map((v,i)=>`<i style="height:${v}%" data-v="${[12,19,27,35,32][i]}"></i>`).join("")}</div><small>Values are illustrative. Interpret the pattern before answering.</small>`;if(q.type==="table")return `<table class="data-table"><caption>Investigation results</caption><tr><th>Trial</th><th>Condition A</th><th>Condition B</th></tr>${[[1,12,15],[2,13,18],[3,11,17],[4,12,19]].map(r=>`<tr>${r.map(v=>`<td>${v}</td>`).join("")}</tr>`).join("")}</table>`;if(q.type==="diagram")return `<div class="diagram"><div>Observation</div><b>→ evidence →</b><div>Scientific claim</div></div>`;if(q.type==="image")return `<figure style="margin:0;text-align:center"><img src="../../../mainbanner.png" alt="Science Extension course image supplied as a visual stimulus" style="max-height:220px;max-width:100%;border-radius:16px"><figcaption>Visual stimulus: identify what further context or evidence would be needed before drawing a conclusion.</figcaption></figure>`;if(q.type==="scenario")return `<strong>Scenario</strong><p>A research team reports this finding after a small classroom investigation. Consider the design, evidence and limits before responding.</p>`;return""}
function openClue(id){const q=state.board.find(x=>x.id===id);if(!q)return;state.current=id;$("#clueMeta").textContent=`${q.category} • ${q.value}`;$("#question").textContent=q.question;$("#answer").innerHTML=`<strong>Expected answer:</strong> ${esc(q.answer)}`;$("#answer").classList.remove("show");const stim=stimulusHtml(q);$("#stimulus").innerHTML=stim;$("#stimulus").hidden=!stim;$("#clueModal").classList.add("open");if(q.daily)showDailyWager(q);else showQuestionActions();startTimer()}
function showQuestionActions(){$("#clueActions").innerHTML=`<button class="secondary" id="timerBtn">Start / restart timer</button><button class="secondary" id="revealBtn">Reveal answer</button><button class="secondary" id="closeClue">Return to board</button>`;$("#timerBtn").onclick=startTimer;$("#revealBtn").onclick=revealAnswer;$("#closeClue").onclick=()=>closeClue(false)}
function revealAnswer(){stopTimer();$("#answer").classList.add("show");$("#clueActions").innerHTML=`<button class="correct" id="correctBtn">✓ Correct — ${esc(state.teams[state.active].name)}</button><button class="incorrect" id="wrongBtn">✕ Incorrect — ${esc(state.teams[state.active].name)}</button><button class="secondary" id="noAnswerBtn">No answer</button>`;$("#correctBtn").onclick=()=>mark(true);$("#wrongBtn").onclick=()=>mark(false);$("#noAnswerBtn").onclick=()=>mark(false,true)}
function startTimer(){stopTimer();seconds=state.settings.timer;$("#timer").textContent=seconds?seconds+" s":"Unlimited";$("#timer").classList.remove("low");if(!seconds)return;timerId=setInterval(()=>{seconds--;$("#timer").textContent=seconds+" s";if(seconds<=5)$("#timer").classList.add("low");if(seconds<=0){stopTimer();beep(220,.25);if(state.settings.autoReveal)revealAnswer()}},1000)}
function stopTimer(){clearInterval(timerId);timerId=null}
function mark(correct,noAnswer=false){const q=state.board.find(x=>x.id===state.current),team=state.teams[state.active];snapshot(correct?"Correct":"Incorrect");const pts=q.daily?(q.wager||q.value):q.value;team.score+=correct?pts:-pts;team[correct?"correct":"incorrect"]++;state.analytics.push({time:new Date().toISOString(),team:team.name,category:q.category,difficulty:q.difficulty,value:q.value,wager:q.wager||"",result:correct?"Correct":noAnswer?"No answer":"Incorrect",question:q.question});
  q.used=true;
  beep(correct?850:180);
  if(!correct)state.active=(state.active+1)%state.teams.length;
  closeClue(true);
}
function closeClue(saveIt){stopTimer();$("#clueModal").classList.remove("open");$("#stealMsg")?.remove();state.current=null;if(saveIt)save();renderScores();renderBoard();if(state.board.every(q=>q.used)){state.settings.final?openFinal():showResults()}}
function showDailyWager(q){stopTimer();const max=Math.max(500,state.teams[state.active].score);$("#question").innerHTML=`<span style="color:#b07a00">DAILY DOUBLE</span><br>${esc(state.teams[state.active].name)}, enter a wager from 0 to ${max.toLocaleString("en-AU")}.</span>`;$("#stimulus").hidden=true;$("#clueActions").innerHTML=`<input id="wager" type="number" min="0" max="${max}" value="${Math.min(q.value,max)}" style="padding:12px;border:1px solid var(--line);border-radius:10px"><button class="correct" id="lockWager">Lock wager & show clue</button>`;$("#lockWager").onclick=()=>{q.wager=Math.max(0,Math.min(max,+$("#wager").value||0));$("#question").textContent=q.question;const stim=stimulusHtml(q);$("#stimulus").innerHTML=stim;$("#stimulus").hidden=!stim;showQuestionActions();startTimer()}}
function openCustom(){const items=getCustom();$("#genericCard").innerHTML=`<h2>Teacher Picks</h2><p class="muted">Create questions for board generation. They remain saved on this device.</p><div class="setup-grid"><div><div class="field"><label>Category</label><input id="cCat" value="Teacher Picks"></div><div class="field"><label>Question</label><textarea id="cQ" rows="3"></textarea></div><div class="field"><label>Expected answer</label><textarea id="cA" rows="3"></textarea></div><div class="field"><label>Difficulty</label><select id="cD">${[1,2,3,4,5].map(n=>`<option value="${n}">${n} — ${n*100} points</option>`).join("")}</select></div><button class="btn primary" id="addCustom">Save Teacher Pick</button></div><div><strong>Saved questions</strong><div class="custom-list">${items.map((x,i)=>`<div class="custom-item"><span><b>${esc(x.category)}</b> — ${esc(x.question)}</span><button class="secondary" data-del="${i}">Delete</button></div>`).join("")||"<p>No questions saved yet.</p>"}</div></div></div><div class="builder-actions"><button class="btn secondary" id="closeGeneric">Done</button></div>`;$("#genericModal").classList.add("open");$("#addCustom").onclick=()=>{if(!$("#cQ").value.trim()||!$("#cA").value.trim())return toast("Add both a question and answer.");const d=+$("#cD").value;items.push({id:"custom-"+Date.now(),bank:"teacher",category:$("#cCat").value.trim()||"Teacher Picks",topic:$("#cQ").value.trim().slice(0,40),question:$("#cQ").value.trim(),answer:$("#cA").value.trim(),difficulty:d,value:d*100,type:"text",custom:true});setCustom(items);openCustom()};$$("[data-del]").forEach(b=>b.onclick=()=>{items.splice(+b.dataset.del,1);setCustom(items);openCustom()});$("#closeGeneric").onclick=closeGeneric}
function closeGeneric(){$("#genericModal").classList.remove("open")}
function openFinal(){closeClue(false);$("#genericCard").innerHTML=`<h2>Final Jeopardy</h2><p class="muted">Category: <strong>Scientific evidence and society</strong>. Enter each team's secret wager, then reveal the clue.</p><div class="final-wagers">${state.teams.map((t,i)=>`<div class="final-team"><strong>${esc(t.name)}</strong><small> Score: ${t.score}</small><input type="number" min="0" max="${Math.max(0,t.score)}" value="0" data-fw="${i}"></div>`).join("")}</div><div class="builder-actions"><button class="btn primary" id="showFinalQ">Lock wagers & show clue</button><button class="btn secondary" id="cancelFinal">Back to board</button></div>`;$("#genericModal").classList.add("open");$("#showFinalQ").onclick=()=>{$$("[data-fw]").forEach(x=>state.teams[+x.dataset.fw].wager=Math.max(0,Math.min(Math.max(0,state.teams[+x.dataset.fw].score),+x.value||0)));showFinalQuestion()};$("#cancelFinal").onclick=closeGeneric}
function showFinalQuestion(){$("#genericCard").innerHTML=`<h2>Final Jeopardy</h2><div class="question">A scientific claim could lead to a major public policy change. What four features would you examine before deciding how much confidence to place in it?</div><div id="finalAnswer" class="answer"><strong>Expected answer:</strong> Any justified four such as source expertise and conflicts, study design, sample and controls, data quality, uncertainty, replication, converging evidence, limitations and plausible alternatives.</div><div class="builder-actions"><button class="btn secondary" id="finalReveal">Reveal answer</button></div><div id="finalMarks"></div>`;$("#finalReveal").onclick=()=>{$("#finalAnswer").classList.add("show");renderFinalMarks()}}
function renderFinalMarks(){$("#finalMarks").innerHTML=`<h3>Mark each team</h3><div class="final-wagers">${state.teams.map((t,i)=>`<div class="final-team"><strong>${esc(t.name)}</strong><div>Wager: ${t.wager||0}</div><div class="mark-row"><button class="correct" data-fmark="${i}:1">Correct</button><button class="incorrect" data-fmark="${i}:0">Incorrect</button></div></div>`).join("")}</div><div class="builder-actions"><button class="btn primary" id="finishFinal">Score & show results</button></div>`;$$("[data-fmark]").forEach(b=>b.onclick=()=>{const[i,v]=b.dataset.fmark.split(":");state.finalMarks[i]=v==="1";b.parentElement.querySelectorAll("button").forEach(x=>x.style.opacity=x===b?"1":".35")});$("#finishFinal").onclick=()=>{snapshot("Final Jeopardy");state.teams.forEach((t,i)=>{const ok=!!state.finalMarks[i];t.score+=ok?(t.wager||0):-(t.wager||0);state.analytics.push({time:new Date().toISOString(),team:t.name,category:"Final Jeopardy",difficulty:5,value:"",wager:t.wager||0,result:ok?"Correct":"Incorrect",question:"Evaluate a policy-relevant scientific claim."})});save();closeGeneric();showResults()}}
function showResults(){closeGeneric();const sorted=[...state.teams].sort((a,b)=>b.score-a.score),attempts=state.analytics.length,correct=state.analytics.filter(x=>x.result==="Correct").length,unanswered=state.analytics.filter(x=>x.category!=="Final Jeopardy"&&x.result!=="Correct");$("#genericCard").innerHTML=`<h2>Game results</h2><div class="results-grid"><div class="result-card"><small>Winner</small><h3>${esc(sorted[0].name)}</h3><strong>${sorted[0].score.toLocaleString("en-AU")} points</strong></div><div class="result-card"><small>Questions attempted</small><h3>${attempts}</h3></div><div class="result-card"><small>Class accuracy</small><h3>${attempts?Math.round(correct/attempts*100):0}%</h3></div></div><h3 style="margin-top:18px">Team summary</h3><table class="data-table"><tr><th>Team</th><th>Score</th><th>Correct</th><th>Incorrect</th></tr>${sorted.map(t=>`<tr><td>${esc(t.name)}</td><td>${t.score}</td><td>${t.correct}</td><td>${t.incorrect}</td></tr>`).join("")}</table><h3 style="margin-top:18px">Category performance</h3><div class="results-grid">${categoryStats().map(x=>`<div class="result-card"><strong>${esc(x.cat)}</strong><div>${x.correct}/${x.total} correct</div></div>`).join("")||"<p>No clues marked.</p>"}</div><h3 style="margin-top:18px">Difficulty performance</h3><div class="results-grid">${difficultyStats().map(x=>`<div class="result-card"><strong>${x.difficulty*100} points</strong><div>${x.correct}/${x.total} correct</div></div>`).join("")||"<p>No clues marked.</p>"}</div><h3 style="margin-top:18px">Questions nobody answered correctly</h3><div class="results-grid">${unanswered.map(x=>`<div class="result-card"><strong>${esc(x.category)} — ${x.value}</strong><div>${esc(x.question)}</div></div>`).join("")||"<p>Every attempted question was answered correctly.</p>"}</div><div class="builder-actions"><button class="btn primary" id="csvBtn">Export analytics CSV</button><button class="btn secondary" id="newGame">New game</button></div>`;$("#genericModal").classList.add("open");$("#csvBtn").onclick=exportCSV;$("#newGame").onclick=()=>{localStorage.removeItem(KEY);location.reload()}}
function categoryStats(){const m={};state.analytics.forEach(x=>{m[x.category]??={cat:x.category,total:0,correct:0};m[x.category].total++;if(x.result==="Correct")m[x.category].correct++});return Object.values(m)}
function difficultyStats(){const m={};state.analytics.filter(x=>x.category!=="Final Jeopardy").forEach(x=>{m[x.difficulty]??={difficulty:x.difficulty,total:0,correct:0};m[x.difficulty].total++;if(x.result==="Correct")m[x.difficulty].correct++});return Object.values(m).sort((a,b)=>a.difficulty-b.difficulty)}
function exportCSV(){const rows=[["Timestamp","Team","Category","Difficulty","Tile value","Wager","Result","Question"],...state.analytics.map(x=>[x.time,x.team,x.category,x.difficulty,x.value,x.wager,x.result,x.question])];const csv=rows.map(r=>r.map(v=>'"'+String(v??"").replaceAll('"','""')+'"').join(",")).join("\r\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="scienceextension-jeopardy-analytics.csv";a.click();URL.revokeObjectURL(a.href)}
function undo(){const h=state.history.pop();if(!h)return toast("Nothing to undo.");state.teams=h.teams;state.active=h.active;state.board=h.board;state.analytics=h.analytics;save();renderScores();renderBoard();toast("Undone: "+h.label)}
function loadGame(){try{Object.assign(state,JSON.parse(localStorage.getItem(KEY)));showGame()}catch{toast("Saved game could not be loaded.")}}
$("#generateBtn").onclick=generateBoard;$("#customBtn").onclick=openCustom;$("#resumeBtn").onclick=loadGame;$("#undoBtn").onclick=undo;$("#changeTeamBtn").onclick=()=>{snapshot("Change active team");state.active=(state.active+1)%state.teams.length;save();renderScores()};$("#builderBtn").onclick=()=>{save();$("#gameScreen").style.display="none";$("#gameScreen").classList.remove("active");$("#setupScreen").classList.add("active");$("#resumeBtn").hidden=false};$("#finalBtn").onclick=openFinal;$("#endBtn").onclick=showResults;$("#fitBtn").onclick=()=>document.body.classList.toggle("fit");$("#fullBtn").onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();init();
</script>
</body>
</html>
