nce of Population.|Members of one species in an area.","Community|Apply Community to a relevant scientific scenario.|Interacting populations in an area.","Habitat|Analyse how Habitat contributes to explaining or investigating a system.|The place where an organism lives.","Niche|Evaluate the role, usefulness or limitations of Niche in this course.|A species role and resource use in an ecosystem."]],["Ecosystem Dynamics — Analysis",["Abundance|Define Abundance.|The number of organisms present.","Distribution|Explain the scientific significance of Distribution.|The spatial pattern of a population.","Quadrat|Apply Quadrat to a relevant scientific scenario.|A frame used to sample stationary organisms.","Transect|Analyse how Transect contributes to explaining or investigating a system.|A sampling line across an environmental gradient.","Producer|Evaluate the role, usefulness or limitations of Producer in this course.|A syllabus concept used when explaining energy transfer."]],["Ecosystem Dynamics — Synthesis and evaluation",["Primary consumer|Define Primary consumer.|A syllabus concept used when explaining energy transfer.","Secondary consumer|Explain the scientific significance of Secondary consumer.|A syllabus concept used when explaining energy transfer.","Decomposer|Apply Decomposer to a relevant scientific scenario.|A syllabus concept used when explaining energy transfer.","Birth rate|Analyse how Birth rate contributes to explaining or investigating a system.|A syllabus concept used when explaining population change.","Death rate|Evaluate the role, usefulness or limitations of Death rate in this course.|A syllabus concept used when explaining population change."]]],"m5":[["Heredity — Foundations",["Asexual reproduction|Define Asexual reproduction.|Reproduction involving one parent and no fusion of gametes, usually producing genetically similar offspring.","Sexual reproduction|Explain the scientific significance of Sexual reproduction.|Reproduction involving the fusion of gametes, producing offspring with new combinations of alleles.","External fertilisation|Apply External fertilisation to a relevant scientific scenario.|Fusion of gametes outside the body of the female, usually in an aquatic environment.","Internal fertilisation|Analyse how Internal fertilisation contributes to explaining or investigating a system.|Fusion of gametes within the reproductive tract of the female.","Binary fission|Evaluate the role, usefulness or limitations of Binary fission in this course.|Asexual reproduction in which one cell replicates its DNA and divides into two cells."]],["Heredity — Structures and systems",["Budding|Define Budding.|Asexual reproduction in which a new organism develops as an outgrowth of the parent.","Spore formation|Explain the scientific significance of Spore formation.|Asexual reproduction involving resistant reproductive cells that can disperse and develop into new organisms.","Vegetative propagation|Apply Vegetative propagation to a relevant scientific scenario.|Asexual reproduction in plants from non-reproductive structures such as stems, roots or leaves.","Pollination|Analyse how Pollination contributes to explaining or investigating a system.|Transfer of pollen from an anther to a compatible stigma.","Fertilisation|Evaluate the role, usefulness or limitations of Fertilisation in this course.|Fusion of haploid gametes to form a diploid zygote."]],["Heredity — Processes",["Implantation|Define Implantation.|Attachment and embedding of the early embryo in the uterine lining.","Placenta|Explain the scientific significance of Placenta.|An organ that allows exchange of materials between maternal and fetal blood without the blood directly mixing.","Progesterone|Apply Progesterone to a relevant scientific scenario.|A hormone that helps maintain the uterine lining during pregnancy.","Oestrogen|Analyse how Oestrogen contributes to explaining or investigating a system.|A hormone involved in the menstrual cycle, pregnancy and development of female reproductive characteristics.","Oxytocin|Evaluate the role, usefulness or limitations of Oxytocin in this course.|A hormone that stimulates uterine contractions during labour and milk ejection after birth."]],["Heredity — Evidence and applications",["Artificial insemination|Define Artificial insemination.|Placement of sperm into the female reproductive tract without sexual intercourse.","Artificial pollination|Explain the scientific significance of Artificial pollination.|Human transfer of pollen to control fertilisation and plant breeding.","Mitosis|Apply Mitosis to a relevant scientific scenario.|Nuclear division producing two genetically similar daughter nuclei with the same chromosome number.","Meiosis|Analyse how Meiosis contributes to explaining or investigating a system.|Cell division producing four genetically different haploid cells from one diploid cell.","Interphase|Evaluate the role, usefulness or limitations of Interphase in this course.|The stage of the cell cycle in which the cell grows and DNA is replicated before division."]],["Heredity — Analysis",["Homologous chromosomes|Define Homologous chromosomes.|A chromosome pair carrying the same genes at corresponding loci, with one chromosome inherited from each parent.","Sister chromatids|Explain the scientific significance of Sister chromatids.|Identical copies of a replicated chromosome joined at the centromere.","Crossing over|Apply Crossing over to a relevant scientific scenario.|Exchange of DNA between homologous chromosomes during meiosis, producing new allele combinations.","Independent assortment|Analyse how Independent assortment contributes to explaining or investigating a system.|Random orientation and separation of homologous chromosome pairs during meiosis.","DNA replication|Evaluate the role, usefulness or limitations of DNA replication in this course.|The semi-conservative process that produces two DNA molecules from one original molecule."]],["Heredity — Synthesis and evaluation",["Semi-conservative replication|Define Semi-conservative replication.|DNA replication in which each new molecule contains one original strand and one newly synthesised strand.","Nucleotide|Explain the scientific significance of Nucleotide.|The monomer of nucleic acids, consisting of a sugar, phosphate group and nitrogenous base.","Complementary base pairing|Apply Complementary base pairing to a relevant scientific scenario.|Specific pairing of adenine with thymine and cytosine with guanine in DNA.","Hydrogen bond|Analyse how Hydrogen bond contributes to explaining or investigating a system.|A weak attraction joining complementary nitrogenous bases across the DNA double helix.","DNA helicase|Evaluate the role, usefulness or limitations of DNA helicase in this course.|An enzyme that unwinds DNA and separates its strands during replication."]]],"m6":[["Genetic Change — Foundations",["Mutation|Define Mutation.|A permanent change in the nucleotide sequence or chromosome structure of genetic material.","Mutagen|Explain the scientific significance of Mutagen.|A physical, chemical or biological agent that increases the rate of mutation.","Ionising radiation|Apply Ionising radiation to a relevant scientific scenario.|High-energy radiation capable of removing electrons and damaging DNA.","Ultraviolet radiation|Analyse how Ultraviolet radiation contributes to explaining or investigating a system.|Electromagnetic radiation that can cause DNA damage such as thymine dimers.","Chemical mutagen|Evaluate the role, usefulness or limitations of Chemical mutagen in this course.|A chemical that alters DNA bases, replication or chromosome structure."]],["Genetic Change — Structures and systems",["Naturally occurring mutagen|Define Naturally occurring mutagen.|A mutation-causing factor produced by natural processes, including reactive molecules or some biological agents.","Point mutation|Explain the scientific significance of Point mutation.|A mutation affecting one nucleotide or a small number of nucleotides.","Substitution|Apply Substitution to a relevant scientific scenario.|A mutation in which one nucleotide is replaced by another.","Insertion|Analyse how Insertion contributes to explaining or investigating a system.|A mutation in which one or more nucleotides are added to a DNA sequence.","Deletion mutation|Evaluate the role, usefulness or limitations of Deletion mutation in this course.|A mutation in which one or more nucleotides are removed from a DNA sequence."]],["Genetic Change — Processes",["Frameshift mutation|Define Frameshift mutation.|A reading-frame change caused by insertion or deletion of nucleotides not in multiples of three.","Silent mutation|Explain the scientific significance of Silent mutation.|A nucleotide change that does not alter the amino acid specified.","Missense mutation|Apply Missense mutation to a relevant scientific scenario.|A nucleotide change that results in a different amino acid.","Nonsense mutation|Analyse how Nonsense mutation contributes to explaining or investigating a system.|A nucleotide change that produces a premature stop codon.","Chromosomal mutation|Evaluate the role, usefulness or limitations of Chromosomal mutation in this course.|A large-scale change to chromosome structure or number."]],["Genetic Change — Evidence and applications",["Chromosomal deletion|Define Chromosomal deletion.|Loss of a section of a chromosome.","Chromosomal duplication|Explain the scientific significance of Chromosomal duplication.|Repetition of a section of a chromosome.","Chromosomal inversion|Apply Chromosomal inversion to a relevant scientific scenario.|Reversal of a chromosome segment within the same chromosome.","Chromosomal translocation|Analyse how Chromosomal translocation contributes to explaining or investigating a system.|Movement of a chromosome segment to a different position, often on another chromosome.","Aneuploidy|Evaluate the role, usefulness or limitations of Aneuploidy in this course.|Presence of an abnormal number of particular chromosomes."]],["Genetic Change — Analysis",["Somatic mutation|Define Somatic mutation.|A mutation in a body cell that can affect the individual but is not normally inherited by offspring.","Germ-line mutation|Explain the scientific significance of Germ-line mutation.|A mutation in a cell that forms gametes and can be inherited by offspring.","Coding DNA|Apply Coding DNA to a relevant scientific scenario.|DNA sequences whose information contributes directly to a polypeptide product.","Non-coding DNA|Analyse how Non-coding DNA contributes to explaining or investigating a system.|DNA that does not code for a polypeptide but may have regulatory, structural or other functions.","Genetic variation|Evaluate the role, usefulness or limitations of Genetic variation in this course.|Differences in genetic information among individuals within a population."]],["Genetic Change — Synthesis and evaluation",["Gene flow|Define Gene flow.|Movement of alleles between populations through migration and reproduction.","Genetic drift|Explain the scientific significance of Genetic drift.|Random change in allele frequencies, with strongest effects in small populations.","Founder effect|Apply Founder effect to a relevant scientific scenario.|Genetic drift occurring when a new population is established by a small number of individuals.","Bottleneck effect|Analyse how Bottleneck effect contributes to explaining or investigating a system.|Loss of genetic variation after a population is sharply reduced in size.","Gene pool|Evaluate the role, usefulness or limitations of Gene pool in this course.|All alleles present in an interbreeding population."]]],"m7":[["Infectious Disease — Foundations",["Infectious disease|Define Infectious disease.|A disease caused by a pathogen that can be transmitted directly or indirectly between hosts.","Pathogen|Explain the scientific significance of Pathogen.|A biological or non-cellular agent capable of causing disease.","Bacterium|Apply Bacterium to a relevant scientific scenario.|A prokaryotic microorganism, some species of which cause disease.","Virus|Analyse how Virus contributes to explaining or investigating a system.|A non-cellular infectious agent containing genetic material within a protein coat and requiring a host cell to reproduce.","Fungus|Evaluate the role, usefulness or limitations of Fungus in this course.|A eukaryotic organism that may cause disease through spores, tissue invasion or toxins."]],["Infectious Disease — Structures and systems",["Protozoan|Define Protozoan.|A single-celled eukaryotic organism, some species of which are parasitic pathogens.","Macroparasite|Explain the scientific significance of Macroparasite.|A multicellular parasite, such as a worm or arthropod, that can cause disease.","Prion|Apply Prion to a relevant scientific scenario.|An infectious misfolded protein capable of inducing abnormal folding in other proteins.","Host|Analyse how Host contributes to explaining or investigating a system.|An organism that supports the survival or reproduction of a pathogen or parasite.","Reservoir|Evaluate the role, usefulness or limitations of Reservoir in this course.|A population or environment in which a pathogen normally lives and multiplies."]],["Infectious Disease — Processes",["Direct contact|Define Direct contact.|Transmission through physical contact between an infected source and a susceptible host.","Indirect contact|Explain the scientific significance of Indirect contact.|Transmission through contaminated objects, food, water, air or surfaces.","Vector transmission|Apply Vector transmission to a relevant scientific scenario.|Transmission by a living carrier such as a mosquito, tick or other animal.","Droplet transmission|Analyse how Droplet transmission contributes to explaining or investigating a system.|Spread in relatively large respiratory droplets over a short distance.","Airborne transmission|Evaluate the role, usefulness or limitations of Airborne transmission in this course.|Spread through small particles that remain suspended in air."]],["Infectious Disease — Evidence and applications",["Fomite|Define Fomite.|A contaminated non-living object that can transfer a pathogen.","Epidemic|Explain the scientific significance of Epidemic.|Occurrence of disease cases above the expected level within a population or region.","Pandemic|Apply Pandemic to a relevant scientific scenario.|An epidemic spreading across multiple countries or continents.","Koch's postulates|Analyse how Koch's postulates contributes to explaining or investigating a system.|Criteria developed to link a particular microorganism with a particular disease.","Pure culture|Evaluate the role, usefulness or limitations of Pure culture in this course.|A laboratory culture containing one identified microorganism."]],["Infectious Disease — Analysis",["Pasteur's swan-neck flask experiment|Define Pasteur's swan-neck flask experiment.|An experiment showing that microbial growth came from environmental contamination rather than spontaneous generation.","Germ theory|Explain the scientific significance of Germ theory.|The theory that many diseases are caused by microorganisms entering and multiplying in a host.","Virulence|Apply Virulence to a relevant scientific scenario.|The degree of harm or disease severity caused by a pathogen.","Toxin|Analyse how Toxin contributes to explaining or investigating a system.|A harmful substance produced by a living organism.","Capsule|Evaluate the role, usefulness or limitations of Capsule in this course.|An outer bacterial layer that can aid attachment and reduce destruction by host defences."]],["Infectious Disease — Synthesis and evaluation",["Antigenic variation|Define Antigenic variation.|Change in pathogen surface antigens that helps evade existing immune responses.","Plant pathogen|Explain the scientific significance of Plant pathogen.|A pathogen that infects plants and may reduce growth, reproduction or agricultural yield.","Animal pathogen|Apply Animal pathogen to a relevant scientific scenario.|A pathogen that infects animals, including humans and agricultural species.","Innate immunity|Analyse how Innate immunity contributes to explaining or investigating a system.|Rapid, non-specific defence mechanisms present before exposure to a particular pathogen.","Adaptive immunity|Evaluate the role, usefulness or limitations of Adaptive immunity in this course.|Specific immune defence that develops after exposure and produces immunological memory."]]],"m8":[["Non-infectious Disease and Disorders — Foundations",["Non-infectious disease|Define Non-infectious disease.|A disease that is not caused by a transmissible pathogen.","Disorder|Explain the scientific significance of Disorder.|A disturbance of normal structure or function that may not fit the usual definition of disease.","Homeostasis|Apply Homeostasis to a relevant scientific scenario.|Maintenance of a relatively stable internal environment within tolerance limits.","Negative feedback|Analyse how Negative feedback contributes to explaining or investigating a system.|A regulatory process in which a change triggers responses that oppose the original change.","Stimulus|Evaluate the role, usefulness or limitations of Stimulus in this course.|A detectable change in the internal or external environment."]],["Non-infectious Disease and Disorders — Structures and systems",["Receptor|Define Receptor.|A structure that detects a change in a regulated condition.","Control centre|Explain the scientific significance of Control centre.|A coordinating structure that compares information with a set range and sends corrective signals.","Effector|Apply Effector to a relevant scientific scenario.|A tissue, organ or cell that carries out a response to restore a regulated condition.","Set point|Analyse how Set point contributes to explaining or investigating a system.|The target value or narrow range around which a regulated condition is maintained.","Thermoregulation|Evaluate the role, usefulness or limitations of Thermoregulation in this course.|Control of internal body temperature within a suitable range."]],["Non-infectious Disease and Disorders — Processes",["Vasodilation|Define Vasodilation.|Widening of skin blood vessels, increasing heat transfer to the environment.","Vasoconstriction|Explain the scientific significance of Vasoconstriction.|Narrowing of skin blood vessels, reducing heat loss to the environment.","Sweating|Apply Sweating to a relevant scientific scenario.|Secretion of fluid onto the skin so evaporation removes heat.","Shivering|Analyse how Shivering contributes to explaining or investigating a system.|Rapid involuntary muscle contractions that increase heat production.","Piloerection|Evaluate the role, usefulness or limitations of Piloerection in this course.|Raising body hairs, which can trap an insulating layer of air."]],["Non-infectious Disease and Disorders — Evidence and applications",["Endotherm|Define Endotherm.|An animal that generates substantial metabolic heat to regulate body temperature.","Behavioural adaptation|Explain the scientific significance of Behavioural adaptation.|An action that improves survival or helps maintain internal conditions.","Structural adaptation|Apply Structural adaptation to a relevant scientific scenario.|A physical feature that improves survival or assists homeostasis.","Physiological adaptation|Analyse how Physiological adaptation contributes to explaining or investigating a system.|An internal functional process that improves survival or assists homeostasis.","Blood glucose regulation|Evaluate the role, usefulness or limitations of Blood glucose regulation in this course.|Homeostatic control of glucose concentration in the blood."]],["Non-infectious Disease and Disorders — Analysis",["Insulin|Define Insulin.|A pancreatic hormone that lowers blood glucose by promoting uptake and storage of glucose.","Glucagon|Explain the scientific significance of Glucagon.|A pancreatic hormone that raises blood glucose by promoting release of glucose from stored glycogen.","Glycogenesis|Apply Glycogenesis to a relevant scientific scenario.|Formation of glycogen from glucose for storage.","Glycogenolysis|Analyse how Glycogenolysis contributes to explaining or investigating a system.|Breakdown of glycogen to release glucose.","Neural pathway|Evaluate the role, usefulness or limitations of Neural pathway in this course.|A route through which electrical signals travel between receptors, coordinating centres and effectors."]],["Non-infectious Disease and Disorders — Synthesis and evaluation",["Hormone|Define Hormone.|A chemical messenger transported to target cells where it alters activity.","Water balance|Explain the scientific significance of Water balance.|Regulation of water gain, loss and distribution within an organism.","Transpiration|Apply Transpiration to a relevant scientific scenario.|Loss of water vapour from plant surfaces, mainly through stomata.","Stoma|Analyse how Stoma contributes to explaining or investigating a system.|A pore in the leaf epidermis that permits gas exchange and water-vapour loss.","Guard cell|Evaluate the role, usefulness or limitations of Guard cell in this course.|A specialised epidermal cell that changes shape to regulate stomatal opening."]]],"working":[["Questioning",["question|What makes a question investigable?|It can be answered with ethical collection or analysis of evidence.","prediction|What should a scientific prediction include?|An expected outcome grounded in scientific reasoning.","hypothesis|How is a hypothesis evaluated?|By deriving predictions and comparing them with evidence.","variables|Why identify variables before collecting data?|To plan valid measurements and controls.","scope|Why narrow the scope of a question?|To make the study feasible and the conclusion precise."]],["Planning",["method|What makes a method reproducible?|Clear materials, quantities, sequence, controls and measurement details.","safety|What is the hierarchy of controls?|Eliminate, substitute, engineer, administrate, then use personal protective equipment.","ethics|When is ethical approval relevant?|When research involves people, animals, sensitive data or significant impacts.","sample|How should sample size be chosen?|Using expected variation, effect size, design, feasibility and power.","pilot|What can a pilot test?|Timing, instructions, instruments, data capture and practical risks."]],["Conducting",["recording|Why record data immediately?|It reduces memory error and preserves an auditable record.","units|Why use SI units where appropriate?|They support consistent comparison and communication.","repeats|Why repeat measurements?|To estimate random variation and improve the precision of an average.","anomaly|What should happen when an anomaly appears?|Check records and method, repeat if justified and report transparently.","provenance|What is data provenance?|A record of where data came from and how it was produced or changed."]],["Processing",["table|What makes a good data table?|Clear headings, units, consistent precision and organised raw values.","graph|How is a graph type selected?|Match it to variable types and the relationship or distribution being shown.","calculation|Why show a sample calculation?|It makes processing transparent and checkable.","normalisation|What is normalisation used for?|Making values comparable by adjusting for scale or another factor.","uncertainty|How can uncertainty propagate?|Uncertainty in inputs contributes to uncertainty in calculated outputs."]],["Analysing",["pattern|What distinguishes a pattern from noise?|It is consistent enough, relative to variation, to warrant explanation.","association|Why is association not automatically causation?|Confounding, reverse causation or chance may explain it.","uncertainty|Why include uncertainty in analysis?|Point estimates alone overstate precision.","limitations|Where should limitations be considered?|In interpreting how methods and data constrain conclusions.","alternative explanation|Why test alternative explanations?|The preferred explanation should outperform credible rivals."]],["Communicating",["audience|How should communication change for an audience?|Adjust language and format without distorting evidence or uncertainty.","citation|Why cite sources?|To credit work and let readers inspect supporting evidence.","visualisation|What makes a visualisation honest?|Proportionate scales, clear labels, context and no selective omission.","conclusion|What belongs in a conclusion?|A direct evidence-based answer, uncertainty and scope.","peer feedback|What is the value of peer feedback?|It can detect errors and improve reasoning and clarity."]]],"glossary":[["Syllabus Glossary — Foundations",["Abiotic|Define Abiotic.|The non-living components of an environment.","Aboriginal and Torres Strait Islander Peoples|Explain the scientific significance of Aboriginal and Torres Strait Islander Peoples.|Australia's Indigenous peoples, comprising diverse Aboriginal language groups and Torres Strait Islander cultural groups.","Allele|Apply Allele to a relevant scientific scenario.|A variant form of a gene.","Biota (biotic)|Analyse how Biota (biotic) contributes to explaining or investigating a system.|All living organisms in a particular region or area.","Conclusion|Evaluate the role, usefulness or limitations of Conclusion in this course.|A judgement based on evidence."]],["Syllabus Glossary — Structures and systems",["Controlled variable|Define Controlled variable.|A factor kept constant, or changed consistently, during an investigation.","Country|Explain the scientific significance of Country.|Land, waters and relationships traditionally cared for by an Aboriginal language group or community, including cultural and spiritual connections.","Dependent variable|Apply Dependent variable to a relevant scientific scenario.|The factor that changes in response to the independent variable.","Digital technologies|Analyse how Digital technologies contributes to explaining or investigating a system.|Hardware and software systems that handle digital data for specific purposes.","Environment|Evaluate the role, usefulness or limitations of Environment in this course.|All living and non-living surroundings."]],["Syllabus Glossary — Processes",["Gene pool|Define Gene pool.|All gene variants present in an interbreeding population.","Hypothesis|Explain the scientific significance of Hypothesis.|A precise and testable proposed explanation that can be supported or refuted by investigation.","Independent variable|Apply Independent variable to a relevant scientific scenario.|The factor deliberately changed to observe its effect on the dependent variable.","Indigenous cultural and intellectual property|Analyse how Indigenous cultural and intellectual property contributes to explaining or investigating a system.|Indigenous cultural knowledge, objects, expressions, sites and practices belonging to particular peoples or communities.","Investigation|Evaluate the role, usefulness or limitations of Investigation in this course.|A planned scientific process for answering a question, exploring an idea or solving a problem using evidence."]],["Syllabus Glossary — Evidence and applications",["Microevolution|Define Microevolution.|A change in gene or allele frequency within a population over a relatively short period.","Model|Explain the scientific significance of Model.|A representation used to describe, simplify, explain or predict an object, system or idea.","Niche|Apply Niche to a relevant scientific scenario.|The position and functional role of a species in its habitat, including its resource requirements.","Place|Analyse how Place contributes to explaining or investigating a system.|A space recognised by Torres Strait Islander Peoples through physical, cultural and spiritual relationships.","Plan|Evaluate the role, usefulness or limitations of Plan in this course.|To decide on a course of action and make arrangements before carrying it out."]],["Syllabus Glossary — Analysis",["Practical investigation|Define Practical investigation.|A systematic scientific inquiry using equipment and hands-on methods to collect data or information.","Primary sources/primary data|Explain the scientific significance of Primary sources/primary data.|Information produced by people directly involved in a study or observation.","Protocol|Apply Protocol to a relevant scientific scenario.|Appropriate and respectful ways of behaving, communicating and working with culturally diverse communities.","Reliability|Analyse how Reliability contributes to explaining or investigating a system.|The extent to which repeated observations under the same conditions give similar results.","Secondary-sourced investigation|Evaluate the role, usefulness or limitations of Secondary-sourced investigation in this course.|A planned inquiry using data and information produced by other people."]],["Syllabus Glossary — Synthesis and evaluation",["Symbiosis|Define Symbiosis.|A close association between different species, including mutualism, commensalism and parasitism.","Technology|Explain the scientific significance of Technology.|A human-made tool, system, machine or process used to solve problems or meet needs.","Theory|Apply Theory to a relevant scientific scenario.|A testable explanatory framework supported by evidence and capable of explaining and predicting related phenomena.","Translation|Analyse how Translation contributes to explaining or investigating a system.|The process in which the codon sequence of mRNA directs the amino-acid sequence of a polypeptide.","Validity|Evaluate the role, usefulness or limitations of Validity in this course.|The extent to which a test measures what was intended and supports accurate inferences."]]]};
const juniorParams=new URLSearchParams(location.search);
const juniorYear=["7","8","9","10"].includes(juniorParams.get("year"))?juniorParams.get("year"):"7";
const juniorBank=window.SCISIMS_JUNIOR_JEOPARDY[juniorYear];
const JUNIOR_MODULE_IDS=juniorBank.banks.map(([id])=>id);
Object.keys(CONTENT).forEach(key=>delete CONTENT[key]);
Object.assign(CONTENT,juniorBank.content);
CONTENT.glossary=[["Scientific glossary",["evidence|Information used to support or challenge a scientific claim.|Evidence","hypothesis|A testable proposed explanation or prediction.|Hypothesis","variable|A factor that can change in an investigation.|Variable","accuracy|Closeness to a true or accepted value.|Accuracy","reliability|Consistency across repeated observations or trials.|Reliability"]]];
const REVIEW_MAP={m1_3:JUNIOR_MODULE_IDS.slice(0,3),m1_3g:[...JUNIOR_MODULE_IDS.slice(0,3),'glossary'],m1_4:JUNIOR_MODULE_IDS,m1_4g:[...JUNIOR_MODULE_IDS,'glossary']};
const juniorById=Object.fromEntries(juniorBank.banks.map(bank=>[bank[0],bank]));
BANKS.splice(0,BANKS.length,juniorById.m1,juniorById.m2,juniorById.m3,["m1_3","Modules 1–3 Review","First three modules"],["m1_3g","Modules 1–3 + Glossary","First three modules plus glossary"],juniorById.m4,["m1_4","Modules 1–4 Review","All four modules"],["m1_4g","Modules 1–4 + Glossary","All four modules plus glossary"],["teacher","Teacher Picks","Your saved questions"]);
document.title=juniorBank.label+" | SciSims";
document.getElementById("jeopardyTitle").innerHTML="Year "+juniorYear+" Science Jeopardy <sup>v2.0</sup>";
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const state={teams:[],active:0,board:[],history:[],analytics:[],settings:{},selectedBanks:[],current:null,phase:"setup",finalMarks:{}};
const KEY="scisims-junior-jeopardy-"+juniorYear+"-v2";
const PREF="scisims-junior-jeopardy-teams-v2";
let timerId=null,seconds=0,audioCtx=null;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800);}
function beep(freq=600,dur=.09){if(!state.settings.sound)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=freq;o.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(.07,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);o.start();o.stop(audioCtx.currentTime+dur)}catch{}}
function save(){localStorage.setItem(KEY,JSON.stringify(state));localStorage.setItem(PREF,JSON.stringify(state.teams.map(t=>t.name)));}
function snapshot(label){state.history.push({label,teams:JSON.parse(JSON.stringify(state.teams)),active:state.active,board:JSON.parse(JSON.stringify(state.board)),analytics:JSON.parse(JSON.stringify(state.analytics))});if(state.history.length>80)state.history.shift();}
function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeQuestion(bank,cat,raw,difficulty,index){const [topic,q,a,type="text"]=raw.split("|");return{id:bank+"-"+cat.replace(/\W/g,"")+"-"+index+"-"+Date.now(),bank,category:cat,topic,question:a,answer:`What is ${topic}?`,sourcePrompt:q,difficulty,value:difficulty*100,type,used:false,daily:false,custom:false}}
function poolForBank(bank){if(REVIEW_MAP[bank])return REVIEW_MAP[bank].flatMap(b=>poolForBank(b));if(bank==="teacher")return getCustom();return (CONTENT[bank]||[]).flatMap(([cat,rows])=>rows.map((r,i)=>makeQuestion(bank,cat,r,i+1,i)))}
function categoriesFor(bank){if(REVIEW_MAP[bank])return shuffle(REVIEW_MAP[bank].flatMap(b=>(CONTENT[b]||[]).map(([c])=>({bank:b,cat:c}))));return (CONTENT[bank]||[]).map(([cat])=>({bank,cat}))}
function getCustom(){try{return JSON.parse(localStorage.getItem("scisims-junior-jeopardy-"+juniorYear+"-custom-v2")||"[]")}catch{return[]}}
function setCustom(v){localStorage.setItem("scisims-junior-jeopardy-"+juniorYear+"-custom-v2",JSON.stringify(v))}
function init(){
  const names=(()=>{try{return JSON.parse(localStorage.getItem(PREF)||"null")}catch{return null}})()||["Team Curie","Team Newton","Team Franklin"];
  $("#teamCount").innerHTML=[2,3,4,5,6].map(n=>`<option value="${n}" ${n===names.length?"selected":""}>${n} teams</option>`).join("");
  renderTeamInputs(names);$("#teamCount").onchange=()=>renderTeamInputs(names);
  $("#bankGrid").innerHTML=BANKS.map(([id,title,sub],i)=>`<label class="bank"><input type="checkbox" value="${id}" ${i===12?"checked":""}><span><strong>${title}</strong><br><small>${sub}</small></span></label>`).join("");
  const bankInputs=$$("#bankGrid input");if(!bankInputs.some(input=>input.checked)&&bankInputs[0])bankInputs[0].checked=true;
  const requestedBank=new URLSearchParams(location.search).get("bank");if(requestedBank&&bankInputs.some(input=>input.value===requestedBank)){bankInputs.forEach(input=>input.checked=input.value===requestedBank)}
  const saved=localStorage.getItem(KEY);$("#resumeBtn").hidden=!saved;
}
function renderTeamInputs(seed=[]){const n=+$("#teamCount").value;$("#teamInputs").innerHTML=Array.from({length:n},(_,i)=>`<div class="field"><label>Team ${i+1}</label><input class="team-name" value="${esc(seed[i]||"Team "+(i+1))}" maxlength="30"></div>`).join("")}
function readSettings(){state.settings={timer:+$("#timerSetting").value,daily:$("#daily").checked,final:$("#finalOn").checked,autoReveal:$("#autoReveal").checked,sound:$("#soundOn").checked,motion:$("#motionOn").checked};state.selectedBanks=$$("#bankGrid input:checked").map(x=>x.value);state.teams=$$(".team-name").map((x,i)=>({name:x.value.trim()||"Team "+(i+1),score:0,correct:0,incorrect:0}));state.active=0}
function applyPreferences(){document.body.classList.toggle("no-motion",state.settings.motion===false)}
function generateBoard(){
  readSettings();if(!state.selectedBanks.length)return toast("Choose at least one content bank.");
  const eligible=state.selectedBanks.filter(b=>b!=="teacher"||getCustom().length);
  if(!eligible.length)return toast("Add a Teacher Pick first.");
  const catCandidates=shuffle(eligible.flatMap(categoriesFor));const chosen=[];for(const c of catCandidates){if(!chosen.some(x=>x.cat===c.cat&&x.bank===c.bank))chosen.push(c);if(chosen.length===6)break}
  while(chosen.length<6){const b=eligible[chosen.length%eligible.length],p=poolForBank(b);chosen.push({bank:b,cat:p[chosen.length%p.length]?.category||"Teacher Picks"})}
  state.board=chosen.flatMap(({bank,cat},col)=>Array.from({length:5},(_,d)=>{
    const candidates=poolForBank(bank).filter(q=>q.category===cat&&q.difficulty===d+1);
    let q=shuffle(candidates)[0]||shuffle(poolForBank(bank).filter(q=>q.difficulty===d+1))[0]||shuffle(poolForBank(bank))[0];
    q=q?{...q,id:q.id+"-"+col+"-"+Math.random().toString(36).slice(2,7)}:makeQuestion("fallback",cat,`evidence|Evaluate the evidence used in this scientific claim.|A strong response considers source, method, data quality, uncertainty and alternatives.`,d+1,col);
    return{...q,col,row:d,value:(d+1)*100,used:false,daily:false}
  }));
  if(state.settings.daily){shuffle(state.board.filter(q=>q.row>0)).slice(0,2).forEach(q=>q.daily=true)}
  state.history=[];state.analytics=[];state.phase="board";applyPreferences();save();showGame()
}
function showGame(){applyPreferences();$("#setupScreen").classList.remove("active");$("#gameScreen").classList.add("active");$("#gameScreen").style.display="block";renderScores();renderBoard();$("#finalBtn").hidden=!state.settings.final}
function renderScores(){$("#scorebar").innerHTML=state.teams.map((t,i)=>`<div class="team-card ${i===state.active?"active":""}"><button data-team="${i}" title="Make active"><strong>${esc(t.name)}</strong><span>${t.score.toLocaleString("en-AU")}</span></button></div>`).join("");$$("[data-team]").forEach(b=>b.onclick=()=>{snapshot("Change active team");state.active=+b.dataset.team;save();renderScores()})}
function renderBoard(){const cats=[...new Map(state.board.map(q=>[q.col,q.category])).values()];$("#board").innerHTML=cats.map(c=>`<div class="category">${esc(c)}</div>`).join("")+Array.from({length:5},(_,row)=>state.board.filter(q=>q.row===row).sort((a,b)=>a.col-b.col).map(q=>`<button class="tile ${q.used?"used":""}" data-id="${q.id}" ${q.used?"disabled":""}>${q.value}</button>`).join("")).join("");$$(".tile:not(.used)").forEach(b=>b.onclick=()=>openClue(b.dataset.id))}
function stimulusHtml(q){if(q.type==="graph")return `<strong>Evidence display</strong><div class="mini-graph" aria-label="Bar graph with increasing values">${[28,43,61,78,72].map((v,i)=>`<i style="height:${v}%" data-v="${[12,19,27,35,32][i]}"></i>`).join("")}</div><small>Values are illustrative. Interpret the pattern before answering.</small>`;if(q.type==="table")return `<table class="data-table"><caption>Investigation results</caption><tr><th>Trial</th><th>Condition A</th><th>Condition B</th></tr>${[[1,12,15],[2,13,18],[3,11,17],[4,12,19]].map(r=>`<tr>${r.map(v=>`<td>${v}</td>`).join("")}</tr>`).join("")}</table>`;if(q.type==="diagram")return `<div class="diagram"><div>Observation</div><b>→ evidence →</b><div>Scientific claim</div></div>`;if(q.type==="image")return `<figure style="margin:0;text-align:center"><img src="../../../biosims.png" alt="Biology course image supplied as a visual stimulus" style="max-height:220px;max-width:100%;border-radius:16px"><figcaption>Visual stimulus: identify what further context or evidence would be needed before drawing a conclusion.</figcaption></figure>`;if(q.type==="scenario")return `<strong>Scenario</strong><p>A research team reports this finding after a small classroom investigation. Consider the design, evidence and limits before responding.</p>`;return""}
function openClue(id){const q=state.board.find(x=>x.id===id);if(!q)return;state.current=id;$("#clueMeta").textContent=`${q.category} • ${q.value}`;$("#question").textContent=q.question;$("#answer").innerHTML=`<strong>Expected question:</strong> ${esc(q.answer)}`;$("#answer").classList.remove("show");const stim=stimulusHtml(q);$("#stimulus").innerHTML=stim;$("#stimulus").hidden=!stim;$("#clueModal").classList.add("open");if(q.daily)showDailyWager(q);else showQuestionActions();startTimer()}
function showQuestionActions(){$("#clueActions").innerHTML=`<button class="secondary" id="timerBtn">Start / restart timer</button><button class="secondary" id="revealBtn">Reveal answer</button><button class="secondary" id="closeClue">Return to board</button>`;$("#timerBtn").onclick=startTimer;$("#revealBtn").onclick=revealAnswer;$("#closeClue").onclick=()=>closeClue(false)}
function revealAnswer(){stopTimer();$("#answer").classList.add("show");$("#clueActions").innerHTML=`<button class="correct" id="correctBtn">✓ Correct — ${esc(state.teams[state.active].name)}</button><button class="incorrect" id="wrongBtn">✕ Incorrect — ${esc(state.teams[state.active].name)}</button><button class="secondary" id="noAnswerBtn">No answer</button>`;$("#correctBtn").onclick=()=>mark(true);$("#wrongBtn").onclick=()=>mark(false);$("#noAnswerBtn").onclick=()=>mark(false,true)}
function startTimer(){stopTimer();seconds=state.settings.timer;$("#timer").textContent=seconds?seconds+" s":"Unlimited";$("#timer").classList.remove("low");if(!seconds)return;timerId=setInterval(()=>{seconds--;$("#timer").textContent=seconds+" s";if(seconds<=5)$("#timer").classList.add("low");if(seconds<=0){stopTimer();beep(220,.25);if(state.settings.autoReveal)revealAnswer()}},1000)}
function stopTimer(){clearInterval(timerId);timerId=null}
function mark(correct,noAnswer=false){const q=state.board.find(x=>x.id===state.current),team=state.teams[state.active];snapshot(correct?"Correct":"Incorrect");const pts=q.daily?(q.wager||q.value):q.value;team.score+=correct?pts:-pts;team[correct?"correct":"incorrect"]++;state.analytics.push({time:new Date().toISOString(),team:team.name,category:q.category,difficulty:q.difficulty,value:q.value,wager:q.wager||"",result:correct?"Correct":noAnswer?"No answer":"Incorrect",question:q.question});
  q.used=true;
  beep(correct?850:180);
  if(!correct)state.active=(state.active+1)%state.teams.length;
  closeClue(true);
}
function closeClue(saveIt){stopTimer();$("#clueModal").classList.remove("open");$("#stealMsg")?.remove();state.current=null;if(saveIt)save();renderScores();renderBoard();if(state.board.every(q=>q.used)){state.settings.final?openFinal():showResults()}}
function showDailyWager(q){stopTimer();const max=Math.max(500,state.teams[state.active].score);$("#question").innerHTML=`<span style="color:#b07a00">DAILY DOUBLE</span><br>${esc(state.teams[state.active].name)}, enter a wager from 0 to ${max.toLocaleString("en-AU")}.</span>`;$("#stimulus").hidden=true;$("#clueActions").innerHTML=`<input id="wager" type="number" min="0" max="${max}" value="${Math.min(q.value,max)}" style="padding:12px;border:1px solid var(--line);border-radius:10px"><button class="correct" id="lockWager">Lock wager & show clue</button>`;$("#lockWager").onclick=()=>{q.wager=Math.max(0,Math.min(max,+$("#wager").value||0));$("#question").textContent=q.question;const stim=stimulusHtml(q);$("#stimulus").innerHTML=stim;$("#stimulus").hidden=!stim;showQuestionActions();startTimer()}}
function openCustom(){const items=getCustom();$("#genericCard").innerHTML=`<h2>Teacher Picks</h2><p class="muted">Create questions for board generation. They remain saved on this device.</p><div class="setup-grid"><div><div class="field"><label>Category</label><input id="cCat" value="Teacher Picks"></div><div class="field"><label>Clue (answer)</label><textarea id="cQ" rows="3"></textarea></div><div class="field"><label>Expected question</label><textarea id="cA" rows="3"></textarea></div><div class="field"><label>Difficulty</label><select id="cD">${[1,2,3,4,5].map(n=>`<option value="${n}">${n} — ${n*100} points</option>`).join("")}</select></div><button class="btn primary" id="addCustom">Save Teacher Pick</button></div><div><strong>Saved questions</strong><div class="custom-list">${items.map((x,i)=>`<div class="custom-item"><span><b>${esc(x.category)}</b> — ${esc(x.question)}</span><button class="secondary" data-del="${i}">Delete</button></div>`).join("")||"<p>No questions saved yet.</p>"}</div></div></div><div class="builder-actions"><button class="btn secondary" id="closeGeneric">Done</button></div>`;$("#genericModal").classList.add("open");$("#addCustom").onclick=()=>{if(!$("#cQ").value.trim()||!$("#cA").value.trim())return toast("Add both a clue and expected question.");const d=+$("#cD").value;items.push({id:"custom-"+Date.now(),bank:"teacher",category:$("#cCat").value.trim()||"Teacher Picks",topic:$("#cQ").value.trim().slice(0,40),question:$("#cQ").value.trim(),answer:$("#cA").value.trim(),difficulty:d,value:d*100,type:"text",custom:true});setCustom(items);openCustom()};$$("[data-del]").forEach(b=>b.onclick=()=>{items.splice(+b.dataset.del,1);setCustom(items);openCustom()});$("#closeGeneric").onclick=closeGeneric}
function closeGeneric(){$("#genericModal").classList.remove("open")}
function openFinal(){closeClue(false);$("#genericCard").innerHTML=`<h2>Final Jeopardy</h2><p class="muted">Category: <strong>Scientific evidence and society</strong>. Enter each team's secret wager, then reveal the clue.</p><div class="final-wagers">${state.teams.map((t,i)=>`<div class="final-team"><strong>${esc(t.name)}</strong><small> Score: ${t.score}</small><input type="number" min="0" max="${Math.max(0,t.score)}" value="0" data-fw="${i}"></div>`).join("")}</div><div class="builder-actions"><button class="btn primary" id="showFinalQ">Lock wagers & show clue</button><button class="btn secondary" id="cancelFinal">Back to board</button></div>`;$("#genericModal").classList.add("open");$("#showFinalQ").onclick=()=>{$$("[data-fw]").forEach(x=>state.teams[+x.dataset.fw].wager=Math.max(0,Math.min(Math.max(0,state.teams[+x.dataset.fw].score),+x.value||0)));showFinalQuestion()};$("#cancelFinal").onclick=closeGeneric}
function showFinalQuestion(){$("#genericCard").innerHTML=`<h2>Final Jeopardy</h2><div class="question">Source expertise and conflicts, study design, sample and controls, data quality, uncertainty, replication and plausible alternatives are features used to judge this.</div><div id="finalAnswer" class="answer"><strong>Expected question:</strong> What is confidence in a policy-relevant scientific claim?</div><div class="builder-actions"><button class="btn secondary" id="finalReveal">Reveal answer</button></div><div id="finalMarks"></div>`;$("#finalReveal").onclick=()=>{$("#finalAnswer").classList.add("show");renderFinalMarks()}}
function renderFinalMarks(){$("#finalMarks").innerHTML=`<h3>Mark each team</h3><div class="final-wagers">${state.teams.map((t,i)=>`<div class="final-team"><strong>${esc(t.name)}</strong><div>Wager: ${t.wager||0}</div><div class="mark-row"><button class="correct" data-fmark="${i}:1">Correct</button><button class="incorrect" data-fmark="${i}:0">Incorrect</button></div></div>`).join("")}</div><div class="builder-actions"><button class="btn primary" id="finishFinal">Score & show results</button></div>`;$$("[data-fmark]").forEach(b=>b.onclick=()=>{const[i,v]=b.dataset.fmark.split(":");state.finalMarks[i]=v==="1";b.parentElement.querySelectorAll("button").forEach(x=>x.style.opacity=x===b?"1":".35")});$("#finishFinal").onclick=()=>{snapshot("Final Jeopardy");state.teams.forEach((t,i)=>{const ok=!!state.finalMarks[i];t.score+=ok?(t.wager||0):-(t.wager||0);state.analytics.push({time:new Date().toISOString(),team:t.name,category:"Final Jeopardy",difficulty:5,value:"",wager:t.wager||0,result:ok?"Correct":"Incorrect",question:"Evaluate a policy-relevant scientific claim."})});save();closeGeneric();showResults()}}
function showResults(){closeGeneric();const sorted=[...state.teams].sort((a,b)=>b.score-a.score),attempts=state.analytics.length,correct=state.analytics.filter(x=>x.result==="Correct").length,unanswered=state.analytics.filter(x=>x.category!=="Final Jeopardy"&&x.result!=="Correct");$("#genericCard").innerHTML=`<h2>Game results</h2><div class="results-grid"><div class="result-card"><small>Winner</small><h3>${esc(sorted[0].name)}</h3><strong>${sorted[0].score.toLocaleString("en-AU")} points</strong></div><div class="result-card"><small>Questions attempted</small><h3>${attempts}</h3></div><div class="result-card"><small>Class accuracy</small><h3>${attempts?Math.round(correct/attempts*100):0}%</h3></div></div><h3 style="margin-top:18px">Team summary</h3><table class="data-table"><tr><th>Team</th><th>Score</th><th>Correct</th><th>Incorrect</th></tr>${sorted.map(t=>`<tr><td>${esc(t.name)}</td><td>${t.score}</td><td>${t.correct}</td><td>${t.incorrect}</td></tr>`).join("")}</table><h3 style="margin-top:18px">Category performance</h3><div class="results-grid">${categoryStats().map(x=>`<div class="result-card"><strong>${esc(x.cat)}</strong><div>${x.correct}/${x.total} correct</div></div>`).join("")||"<p>No clues marked.</p>"}</div><h3 style="margin-top:18px">Difficulty performance</h3><div class="results-grid">${difficultyStats().map(x=>`<div class="result-card"><strong>${x.difficulty*100} points</strong><div>${x.correct}/${x.total} correct</div></div>`).join("")||"<p>No clues marked.</p>"}</div><h3 style="margin-top:18px">Questions nobody answered correctly</h3><div class="results-grid">${unanswered.map(x=>`<div class="result-card"><strong>${esc(x.category)} — ${x.value}</strong><div>${esc(x.question)}</div></div>`).join("")||"<p>Every attempted question was answered correctly.</p>"}</div><div class="builder-actions"><button class="btn primary" id="csvBtn">Export analytics CSV</button><button class="btn secondary" id="newGame">New game</button></div>`;$("#genericModal").classList.add("open");$("#csvBtn").onclick=exportCSV;$("#newGame").onclick=()=>{localStorage.removeItem(KEY);location.reload()}}
function categoryStats(){const m={};state.analytics.forEach(x=>{m[x.category]??={cat:x.category,total:0,correct:0};m[x.category].total++;if(x.result==="Correct")m[x.category].correct++});return Object.values(m)}
function difficultyStats(){const m={};state.analytics.filter(x=>x.category!=="Final Jeopardy").forEach(x=>{m[x.difficulty]??={difficulty:x.difficulty,total:0,correct:0};m[x.difficulty].total++;if(x.result==="Correct")m[x.difficulty].correct++});return Object.values(m).sort((a,b)=>a.difficulty-b.difficulty)}
function exportCSV(){const rows=[["Timestamp","Team","Category","Difficulty","Tile value","Wager","Result","Question"],...state.analytics.map(x=>[x.time,x.team,x.category,x.difficulty,x.value,x.wager,x.result,x.question])];const csv=rows.map(r=>r.map(v=>'"'+String(v??"").replaceAll('"','""')+'"').join(",")).join("\r\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="biology-jeopardy-analytics.csv";a.click();URL.revokeObjectURL(a.href)}
function undo(){const h=state.history.pop();if(!h)return toast("Nothing to undo.");state.teams=h.teams;state.active=h.active;state.board=h.board;state.analytics=h.analytics;save();renderScores();renderBoard();toast("Undone: "+h.label)}
function loadGame(){try{Object.assign(state,JSON.parse(localStorage.getItem(KEY)));showGame()}catch{toast("Saved game could not be loaded.")}}
$("#generateBtn").onclick=generateBoard;$("#customBtn").onclick=openCustom;$("#resumeBtn").onclick=loadGame;$("#undoBtn").onclick=undo;$("#changeTeamBtn").onclick=()=>{snapshot("Change active team");state.active=(state.active+1)%state.teams.length;save();renderScores()};$("#builderBtn").onclick=()=>{save();$("#gameScreen").style.display="none";$("#gameScreen").classList.remove("active");$("#setupScreen").classList.add("active");$("#resumeBtn").hidden=false};$("#finalBtn").onclick=openFinal;$("#endBtn").onclick=showResults;$("#fitBtn").onclick=()=>document.body.classList.toggle("fit");$("#fullBtn").onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();init();
</script>
</body>
</html>
