tmosphere to a relevant scientific scenario.|The layers of gases surrounding Earth.","Hydrosphere|Analyse how Hydrosphere contributes to explaining or investigating a system.|All liquid water on, beneath and above Earth’s surface.","Origin of life|Evaluate the role, usefulness or limitations of Origin of life in this course.|The development of the first self-replicating living systems from non-living chemistry."]],["Earth’s Processes — Structures and systems",["Organic molecule|Define Organic molecule.|A carbon-based molecule associated with living systems or their chemical building blocks.","Abiogenesis|Explain the scientific significance of Abiogenesis.|The proposed natural origin of life from non-living matter.","Miller–Urey experiment|Apply Miller–Urey experiment to a relevant scientific scenario.|An experiment showing that organic molecules can form under simulated early-Earth conditions.","Reducing atmosphere|Analyse how Reducing atmosphere contributes to explaining or investigating a system.|An atmosphere with little free oxygen and gases capable of donating electrons in chemical reactions.","Electrical discharge|Evaluate the role, usefulness or limitations of Electrical discharge in this course.|The simulated lightning energy source used in the Miller–Urey experiment."]],["Earth’s Processes — Processes",["Primordial soup|Define Primordial soup.|A proposed early-Earth mixture of water and organic molecules from which life may have developed.","Hydrothermal vent|Explain the scientific significance of Hydrothermal vent.|A seafloor opening that releases geothermally heated, mineral-rich water.","Black smoker|Apply Black smoker to a relevant scientific scenario.|A high-temperature hydrothermal vent producing dark mineral-rich plumes.","Chemosynthesis|Analyse how Chemosynthesis contributes to explaining or investigating a system.|Production of organic matter using energy released from inorganic chemical reactions.","Extremophile|Evaluate the role, usefulness or limitations of Extremophile in this course.|An organism adapted to conditions that are extreme for most life."]],["Earth’s Processes — Evidence and applications",["Panspermia|Define Panspermia.|The hypothesis that life or its chemical precursors arrived on Earth from space.","Meteorite|Explain the scientific significance of Meteorite.|A fragment of extraterrestrial material that survives passage through the atmosphere and reaches Earth’s surface.","Cyanobacteria|Apply Cyanobacteria to a relevant scientific scenario.|Photosynthetic prokaryotes that contributed to increasing atmospheric oxygen.","Stromatolite|Analyse how Stromatolite contributes to explaining or investigating a system.|A layered structure formed by microbial communities, especially cyanobacteria.","Photosynthesis|Evaluate the role, usefulness or limitations of Photosynthesis in this course.|A process using light energy to produce organic molecules, commonly releasing oxygen."]],["Earth’s Processes — Analysis",["Great Oxidation Event|Define Great Oxidation Event.|The major increase in atmospheric oxygen caused largely by photosynthetic microorganisms.","Banded iron formation|Explain the scientific significance of Banded iron formation.|Layered iron-rich rock formed when dissolved iron reacted with oxygen in ancient oceans.","Ozone layer|Apply Ozone layer to a relevant scientific scenario.|A stratospheric region rich in ozone that absorbs much ultraviolet radiation.","Aerobic respiration|Analyse how Aerobic respiration contributes to explaining or investigating a system.|Energy-releasing cellular respiration that uses oxygen as the final electron acceptor.","Multicellular organism|Evaluate the role, usefulness or limitations of Multicellular organism in this course.|An organism made of many specialised, interdependent cells."]],["Earth’s Processes — Synthesis and evaluation",["Ediacaran biota|Define Ediacaran biota.|Soft-bodied multicellular organisms known from late Precambrian fossils.","Cambrian explosion|Explain the scientific significance of Cambrian explosion.|A geologically rapid diversification of many animal body plans early in the Cambrian Period.","Cambrian fauna|Apply Cambrian fauna to a relevant scientific scenario.|Organisms represented in the diverse fossil record of the Cambrian Period.","Conquest of land|Analyse how Conquest of land contributes to explaining or investigating a system.|The evolutionary expansion of plants and animals from aquatic environments onto land.","Vascular plant|Evaluate the role, usefulness or limitations of Vascular plant in this course.|A plant possessing specialised tissues that transport water and nutrients."]]],"m6":[["Hazards — Foundations",["Natural hazard|Define Natural hazard.|A naturally occurring process or event capable of causing harm.","Natural disaster|Explain the scientific significance of Natural disaster.|A hazardous event that causes serious disruption and exceeds a community’s capacity to cope.","Risk|Apply Risk to a relevant scientific scenario.|The likelihood and potential consequence of harm from a hazard.","Exposure|Analyse how Exposure contributes to explaining or investigating a system.|The people, infrastructure or ecosystems located where a hazard may occur.","Vulnerability|Evaluate the role, usefulness or limitations of Vulnerability in this course.|The degree to which exposed people, systems or environments are susceptible to harm."]],["Hazards — Structures and systems",["Resilience|Define Resilience.|The capacity to prepare for, withstand, recover from and adapt to a hazardous event.","Mitigation|Explain the scientific significance of Mitigation.|Action taken to reduce the probability or consequences of a hazard.","Preparedness|Apply Preparedness to a relevant scientific scenario.|Planning and capacity-building undertaken before a hazard occurs.","Response|Analyse how Response contributes to explaining or investigating a system.|Immediate actions taken during and shortly after a disaster.","Recovery|Evaluate the role, usefulness or limitations of Recovery in this course.|Longer-term restoration and rebuilding after a disaster."]],["Hazards — Processes",["Earthquake|Define Earthquake.|Sudden ground movement caused by rapid release of stored elastic energy.","Focus|Explain the scientific significance of Focus.|The point within Earth where an earthquake rupture begins.","Epicentre|Apply Epicentre to a relevant scientific scenario.|The point on Earth’s surface directly above an earthquake focus.","Fault|Analyse how Fault contributes to explaining or investigating a system.|A fracture in rock along which movement has occurred.","Elastic rebound|Evaluate the role, usefulness or limitations of Elastic rebound in this course.|Release of accumulated strain when rocks rupture and move along a fault."]],["Hazards — Evidence and applications",["Seismic wave|Define Seismic wave.|An energy wave produced by an earthquake or other ground disturbance.","Primary wave|Explain the scientific significance of Primary wave.|A compressional seismic body wave that travels fastest through solids and fluids.","Secondary wave|Apply Secondary wave to a relevant scientific scenario.|A transverse seismic body wave that travels through solids but not liquids.","Surface wave|Analyse how Surface wave contributes to explaining or investigating a system.|A seismic wave travelling along Earth’s surface and commonly producing strong damaging motion.","Seismometer|Evaluate the role, usefulness or limitations of Seismometer in this course.|An instrument that detects and records ground motion."]],["Hazards — Analysis",["Seismogram|Define Seismogram.|The recorded trace of seismic motion over time.","Earthquake magnitude|Explain the scientific significance of Earthquake magnitude.|A measure of the energy released by an earthquake.","Earthquake intensity|Apply Earthquake intensity to a relevant scientific scenario.|A measure of observed shaking and damage at a location.","Moment magnitude scale|Analyse how Moment magnitude scale contributes to explaining or investigating a system.|A logarithmic scale based on seismic moment and total earthquake energy release.","Modified Mercalli scale|Evaluate the role, usefulness or limitations of Modified Mercalli scale in this course.|An intensity scale based on observed earthquake effects and damage."]],["Hazards — Synthesis and evaluation",["Aftershock|Define Aftershock.|A smaller earthquake following the main shock in the same region.","Foreshock|Explain the scientific significance of Foreshock.|A smaller earthquake that precedes a larger main shock.","Tsunami|Apply Tsunami to a relevant scientific scenario.|A series of long ocean waves generated by sudden displacement of a large volume of water.","Convergent boundary|Analyse how Convergent boundary contributes to explaining or investigating a system.|A plate boundary where plates move towards one another.","Divergent boundary|Evaluate the role, usefulness or limitations of Divergent boundary in this course.|A plate boundary where plates move apart."]]],"m7":[["Climate Science — Foundations",["Weather|Define Weather.|Short-term atmospheric conditions at a particular place and time.","Climate|Explain the scientific significance of Climate.|Long-term patterns and averages of weather conditions for a region or the globe.","Climate variation|Apply Climate variation to a relevant scientific scenario.|Change in climate conditions over timescales from years to geological intervals.","Climate proxy|Analyse how Climate proxy contributes to explaining or investigating a system.|Indirect evidence used to reconstruct past climate conditions.","Natural greenhouse effect|Evaluate the role, usefulness or limitations of Natural greenhouse effect in this course.|Natural atmospheric warming caused by greenhouse gases absorbing and re-emitting infrared radiation."]],["Climate Science — Structures and systems",["Enhanced greenhouse effect|Define Enhanced greenhouse effect.|Additional warming caused by increased greenhouse-gas concentrations, largely from human activity.","Greenhouse gas|Explain the scientific significance of Greenhouse gas.|An atmospheric gas that absorbs and emits infrared radiation.","Carbon dioxide|Apply Carbon dioxide to a relevant scientific scenario.|A greenhouse gas released naturally and through activities such as fossil-fuel combustion and land clearing.","Methane|Analyse how Methane contributes to explaining or investigating a system.|A potent greenhouse gas emitted from wetlands, agriculture, fossil fuels and decomposition.","Nitrous oxide|Evaluate the role, usefulness or limitations of Nitrous oxide in this course.|A long-lived greenhouse gas associated with soils, fertilisers and combustion."]],["Climate Science — Processes",["Water vapour|Define Water vapour.|The most abundant greenhouse gas and an important climate feedback.","Infrared radiation|Explain the scientific significance of Infrared radiation.|Long-wave electromagnetic radiation emitted by Earth’s surface and atmosphere.","Short-wave radiation|Apply Short-wave radiation to a relevant scientific scenario.|Solar energy reaching Earth mainly as visible, ultraviolet and near-infrared radiation.","Radiative balance|Analyse how Radiative balance contributes to explaining or investigating a system.|The balance between incoming solar energy and outgoing energy from Earth.","Albedo|Evaluate the role, usefulness or limitations of Albedo in this course.|The proportion of incoming radiation reflected by a surface."]],["Climate Science — Evidence and applications",["Positive feedback|Define Positive feedback.|A process that amplifies an initial climate change.","Negative feedback|Explain the scientific significance of Negative feedback.|A process that reduces an initial climate change.","Ice–albedo feedback|Apply Ice–albedo feedback to a relevant scientific scenario.|Warming reduces reflective ice, increasing absorption and causing further warming.","Carbon sink|Analyse how Carbon sink contributes to explaining or investigating a system.|A reservoir that absorbs more carbon than it releases over a stated period.","Carbon source|Evaluate the role, usefulness or limitations of Carbon source in this course.|A reservoir or activity that releases more carbon than it absorbs."]],["Climate Science — Analysis",["Plate tectonic supercycle|Define Plate tectonic supercycle.|Long-term assembly and breakup of continents that alters ocean circulation, weathering and climate.","Large igneous province|Explain the scientific significance of Large igneous province.|A vast region formed by unusually large volcanic outpourings.","Deccan Traps|Apply Deccan Traps to a relevant scientific scenario.|A large igneous province in India linked to major volcanic climate effects.","Siberian Traps|Analyse how Siberian Traps contributes to explaining or investigating a system.|A vast volcanic province associated with severe environmental change and the end-Permian extinction.","Volcanic cooling|Evaluate the role, usefulness or limitations of Volcanic cooling in this course.|Short-term climate cooling caused when sulfate aerosols reflect incoming solar radiation."]],["Climate Science — Synthesis and evaluation",["Volcanic warming|Define Volcanic warming.|Potential longer-term warming associated with volcanic greenhouse-gas release.","Orbital eccentricity|Explain the scientific significance of Orbital eccentricity.|Variation in the shape of Earth’s orbit around the Sun.","Axial tilt|Apply Axial tilt to a relevant scientific scenario.|The angle between Earth’s rotational axis and the perpendicular to its orbital plane.","Precession|Analyse how Precession contributes to explaining or investigating a system.|Slow change in the direction of Earth’s rotational axis.","Milankovitch cycles|Evaluate the role, usefulness or limitations of Milankovitch cycles in this course.|Long-term orbital variations that alter the distribution of solar energy received by Earth."]]],"m8":[["Resource Management — Foundations",["Natural resource|Define Natural resource.|A material, organism or energy source obtained from the environment for human use.","Renewable resource|Explain the scientific significance of Renewable resource.|A resource replenished naturally on a timescale comparable with its use.","Non-renewable resource|Apply Non-renewable resource to a relevant scientific scenario.|A finite resource formed or replenished much more slowly than it is consumed.","Agricultural resource|Analyse how Agricultural resource contributes to explaining or investigating a system.|A biological, soil or water resource used to produce food, fibre or other products.","Terrestrial agriculture|Evaluate the role, usefulness or limitations of Terrestrial agriculture in this course.|Food or fibre production based on land ecosystems."]],["Resource Management — Structures and systems",["Aquaculture|Define Aquaculture.|Farming of aquatic organisms such as fish, shellfish or algae.","Water resource|Explain the scientific significance of Water resource.|Surface water, groundwater or captured water available for ecological or human use.","Energy resource|Apply Energy resource to a relevant scientific scenario.|A natural source that can be converted into useful energy.","Mineral resource|Analyse how Mineral resource contributes to explaining or investigating a system.|A concentration of naturally occurring material with potential economic value.","Ore|Evaluate the role, usefulness or limitations of Ore in this course.|Rock containing a valuable material at a concentration that may be economically extracted."]],["Resource Management — Processes",["Ore grade|Define Ore grade.|The concentration of a valuable component within an ore.","Reserve|Explain the scientific significance of Reserve.|A known resource that can be economically extracted under current conditions.","Resource exploration|Apply Resource exploration to a relevant scientific scenario.|Search for deposits using geological, geophysical and geochemical evidence.","Remote sensing|Analyse how Remote sensing contributes to explaining or investigating a system.|Collection of information about Earth without direct contact, commonly from aircraft or satellites.","Open-pit mining|Evaluate the role, usefulness or limitations of Open-pit mining in this course.|Extraction from a large surface excavation."]],["Resource Management — Evidence and applications",["Underground mining|Define Underground mining.|Extraction through shafts, tunnels or other workings beneath the surface.","Onshore drilling|Explain the scientific significance of Onshore drilling.|Drilling for fluids or geological information from a land-based site.","Offshore drilling|Apply Offshore drilling to a relevant scientific scenario.|Drilling beneath the seabed from a marine platform or vessel.","Overburden|Analyse how Overburden contributes to explaining or investigating a system.|Soil and rock removed to expose an underlying resource.","Tailings|Evaluate the role, usefulness or limitations of Tailings in this course.|Fine waste material remaining after valuable minerals are separated from ore."]],["Resource Management — Analysis",["Waste rock|Define Waste rock.|Excavated rock that does not contain an economically recoverable concentration of the target material.","Acid mine drainage|Explain the scientific significance of Acid mine drainage.|Acidic water produced when sulfide minerals react with oxygen and water.","Leachate|Apply Leachate to a relevant scientific scenario.|Contaminated liquid that drains through waste or disturbed material.","Heavy-metal contamination|Analyse how Heavy-metal contamination contributes to explaining or investigating a system.|Pollution by metals that can be toxic at elevated concentrations.","Sediment pollution|Evaluate the role, usefulness or limitations of Sediment pollution in this course.|Excess soil or particles entering waterways and affecting water quality or habitat."]],["Resource Management — Synthesis and evaluation",["Habitat fragmentation|Define Habitat fragmentation.|Division of habitat into smaller, isolated patches.","Aboriginal cultural site|Explain the scientific significance of Aboriginal cultural site.|A place with cultural, spiritual, historical or archaeological significance to Aboriginal Peoples.","Traditional owner|Apply Traditional owner to a relevant scientific scenario.|An Aboriginal or Torres Strait Islander person or group with recognised cultural connection and responsibility for Country or Place.","Environmental impact assessment|Analyse how Environmental impact assessment contributes to explaining or investigating a system.|A structured evaluation of likely environmental consequences before a project proceeds.","Mine rehabilitation|Evaluate the role, usefulness or limitations of Mine rehabilitation in this course.|Repair and stabilisation of land affected by mining."]]],"working":[["Questioning",["question|What makes a question investigable?|It can be answered with ethical collection or analysis of evidence.","prediction|What should a scientific prediction include?|An expected outcome grounded in scientific reasoning.","hypothesis|How is a hypothesis evaluated?|By deriving predictions and comparing them with evidence.","variables|Why identify variables before collecting data?|To plan valid measurements and controls.","scope|Why narrow the scope of a question?|To make the study feasible and the conclusion precise."]],["Planning",["method|What makes a method reproducible?|Clear materials, quantities, sequence, controls and measurement details.","safety|What is the hierarchy of controls?|Eliminate, substitute, engineer, administrate, then use personal protective equipment.","ethics|When is ethical approval relevant?|When research involves people, animals, sensitive data or significant impacts.","sample|How should sample size be chosen?|Using expected variation, effect size, design, feasibility and power.","pilot|What can a pilot test?|Timing, instructions, instruments, data capture and practical risks."]],["Conducting",["recording|Why record data immediately?|It reduces memory error and preserves an auditable record.","units|Why use SI units where appropriate?|They support consistent comparison and communication.","repeats|Why repeat measurements?|To estimate random variation and improve the precision of an average.","anomaly|What should happen when an anomaly appears?|Check records and method, repeat if justified and report transparently.","provenance|What is data provenance?|A record of where data came from and how it was produced or changed."]],["Processing",["table|What makes a good data table?|Clear headings, units, consistent precision and organised raw values.","graph|How is a graph type selected?|Match it to variable types and the relationship or distribution being shown.","calculation|Why show a sample calculation?|It makes processing transparent and checkable.","normalisation|What is normalisation used for?|Making values comparable by adjusting for scale or another factor.","uncertainty|How can uncertainty propagate?|Uncertainty in inputs contributes to uncertainty in calculated outputs."]],["Analysing",["pattern|What distinguishes a pattern from noise?|It is consistent enough, relative to variation, to warrant explanation.","association|Why is association not automatically causation?|Confounding, reverse causation or chance may explain it.","uncertainty|Why include uncertainty in analysis?|Point estimates alone overstate precision.","limitations|Where should limitations be considered?|In interpreting how methods and data constrain conclusions.","alternative explanation|Why test alternative explanations?|The preferred explanation should outperform credible rivals."]],["Communicating",["audience|How should communication change for an audience?|Adjust language and format without distorting evidence or uncertainty.","citation|Why cite sources?|To credit work and let readers inspect supporting evidence.","visualisation|What makes a visualisation honest?|Proportionate scales, clear labels, context and no selective omission.","conclusion|What belongs in a conclusion?|A direct evidence-based answer, uncertainty and scope.","peer feedback|What is the value of peer feedback?|It can detect errors and improve reasoning and clarity."]]],"glossary":[["Syllabus Glossary — Foundations",["Aboriginal and Torres Strait Islander Peoples|Define Aboriginal and Torres Strait Islander Peoples.|Australia’s Indigenous peoples, comprising diverse Aboriginal language groups and Torres Strait Islander cultural groups.","Abiotic|Explain the scientific significance of Abiotic.|The non-living components of an environment.","Anthropogenic climate variation|Apply Anthropogenic climate variation to a relevant scientific scenario.|Variation in climate caused or influenced by human activity.","Biota (biotic)|Analyse how Biota (biotic) contributes to explaining or investigating a system.|All living organisms in a specific region or area.","Conclusion|Evaluate the role, usefulness or limitations of Conclusion in this course.|A judgement based on evidence."]],["Syllabus Glossary — Structures and systems",["Controlled variable|Define Controlled variable.|A factor kept constant, or changed consistently, during an investigation.","Country|Explain the scientific significance of Country.|An area traditionally owned and cared for by an Aboriginal language group or community, including cultural and spiritual relationships.","Cryosphere|Apply Cryosphere to a relevant scientific scenario.|The frozen-water component of Earth’s system.","Dendrochronology|Analyse how Dendrochronology contributes to explaining or investigating a system.|Use of annual tree rings to date and investigate past events or environmental conditions.","Dependent variable|Evaluate the role, usefulness or limitations of Dependent variable in this course.|The factor that changes in response to the independent variable."]],["Syllabus Glossary — Processes",["Digital technologies|Define Digital technologies.|Hardware and software systems that handle digital data for specific purposes.","Environment|Explain the scientific significance of Environment.|All living and non-living surroundings.","Geo-engineering|Apply Geo-engineering to a relevant scientific scenario.|Large-scale deliberate manipulation of climate systems using carbon dioxide removal or solar-radiation management.","Hypothesis|Analyse how Hypothesis contributes to explaining or investigating a system.|A precise, testable proposed explanation that can be supported or refuted by investigation.","Independent variable|Evaluate the role, usefulness or limitations of Independent variable in this course.|The factor deliberately changed to observe its effect on the dependent variable."]],["Syllabus Glossary — Evidence and applications",["Inquiry question|Define Inquiry question.|The driving question for an investigation.","Investigation|Explain the scientific significance of Investigation.|A planned scientific process for answering a question, exploring an idea or solving a problem using evidence.","Model|Apply Model to a relevant scientific scenario.|A representation used to describe, simplify, explain or predict an object, system or idea.","Place|Analyse how Place contributes to explaining or investigating a system.|A space recognised by Torres Strait Islander Peoples through physical, cultural and spiritual relationships.","Practical investigations|Evaluate the role, usefulness or limitations of Practical investigations in this course.|Systematic scientific inquiries using equipment and hands-on methods, including laboratory work and fieldwork."]],["Syllabus Glossary — Analysis",["Primary sources/primary data|Define Primary sources/primary data.|Information produced by people directly involved in a study or observation.","Reliability|Explain the scientific significance of Reliability.|The extent to which repeated observations under the same conditions give similar results.","Secondary-sourced investigation/data|Apply Secondary-sourced investigation/data to a relevant scientific scenario.|A planned inquiry using data or information produced by other people.","Superposition|Analyse how Superposition contributes to explaining or investigating a system.|The principle that the lowest undisturbed sedimentary layer was deposited first.","Technology|Evaluate the role, usefulness or limitations of Technology in this course.|A human-made tool, system, machine or process used to solve problems or meet needs."]],["Syllabus Glossary — Synthesis and evaluation",["Theory|Define Theory.|A broad, testable explanatory framework supported by reproducible evidence and capable of prediction.","Uniformitarianism|Explain the scientific significance of Uniformitarianism.|The principle that geological processes operating today also operated in the past.","Validity|Apply Validity to a relevant scientific scenario.|The extent to which a test measures what was intended and supports accurate inferences.","Variable|Analyse how Variable contributes to explaining or investigating a system.|A factor in an investigation that can be changed, maintained or measured.","Aboriginal and Torres Strait Islander Peoples|Evaluate the role, usefulness or limitations of Aboriginal and Torres Strait Islander Peoples in this course.|Australia’s Indigenous peoples, comprising diverse Aboriginal language groups and Torres Strait Islander cultural groups."]]]};
const REVIEW_MAP={y11:["m1","m2","m3","m4"],y12:["m5","m6","m7","m8"],stage6:["m1","m2","m3","m4","m5","m6","m7","m8"]};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const state={teams:[],active:0,board:[],history:[],analytics:[],settings:{},selectedBanks:[],current:null,phase:"setup",finalMarks:{}};
const KEY="scisims-earthenvironmentalscience-jeopardy-v2";
const PREF="scisims-earthenvironmentalscience-jeopardy-teams-v2";
let timerId=null,seconds=0,audioCtx=null;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800);}
function beep(freq=600,dur=.09){if(!state.settings.sound)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=freq;o.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(.07,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);o.start();o.stop(audioCtx.currentTime+dur)}catch{}}
function save(){localStorage.setItem(KEY,JSON.stringify(state));localStorage.setItem(PREF,JSON.stringify(state.teams.map(t=>t.name)));}
function snapshot(label){state.history.push({label,teams:JSON.parse(JSON.stringify(state.teams)),active:state.active,board:JSON.parse(JSON.stringify(state.board)),analytics:JSON.parse(JSON.stringify(state.analytics))});if(state.history.length>80)state.history.shift();}
function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeQuestion(bank,cat,raw,difficulty,index){const [topic,q,a]=raw.split("|");const types=["text","scenario","table","graph","diagram","image"];return{id:bank+"-"+cat.replace(/\W/g,"")+"-"+index+"-"+Date.now(),bank,category:cat,topic,question:q,answer:a,difficulty,value:difficulty*100,type:types[(difficulty+index+cat.length)%types.length],used:false,daily:false,custom:false}}
function poolForBank(bank){if(REVIEW_MAP[bank])return REVIEW_MAP[bank].flatMap(b=>poolForBank(b));if(bank==="teacher")return getCustom();return (CONTENT[bank]||[]).flatMap(([cat,rows])=>rows.map((r,i)=>makeQuestion(bank,cat,r,i+1,i)))}
function categoriesFor(bank){if(REVIEW_MAP[bank])return shuffle(REVIEW_MAP[bank].flatMap(b=>(CONTENT[b]||[]).map(([c])=>({bank:b,cat:c}))));return (CONTENT[bank]||[]).map(([cat])=>({bank,cat}))}
function getCustom(){try{return JSON.parse(localStorage.getItem("scisims-earthenvironmentalscience-jeopardy-custom-v2")||"[]")}catch{return[]}}
function setCustom(v){localStorage.setItem("scisims-earthenvironmentalscience-jeopardy-custom-v2",JSON.stringify(v))}
function init(){
  const names=(()=>{try{return JSON.parse(localStorage.getItem(PREF)||"null")}catch{return null}})()||["Team Curie","Team Newton","Team Franklin"];
  $("#teamCount").innerHTML=[2,3,4,5,6].map(n=>`<option value="${n}" ${n===names.length?"selected":""}>${n} teams</option>`).join("");
  renderTeamInputs(names);$("#teamCount").onchange=()=>renderTeamInputs(names);
  $("#bankGrid").innerHTML=BANKS.map(([id,title,sub],i)=>`<label class="bank"><input type="checkbox" value="${id}" ${i===12?"checked":""}><span><strong>${title}</strong><br><small>${sub}</small></span></label>`).join("");
  const requestedBank=new URLSearchParams(location.search).get("bank");if(requestedBank){$$("#bankGrid input").forEach(input=>input.checked=input.value===requestedBank)}
  const saved=localStorage.getItem(KEY);$("#resumeBtn").hidden=!saved;
}
function renderTeamInputs(seed=[]){const n=+$("#teamCount").value;$("#teamInputs").innerHTML=Array.from({length:n},(_,i)=>`<div class="field"><label>Team ${i+1}</label><input class="team-name" value="${esc(seed[i]||"Team "+(i+1))}" maxlength="30"></div>`).join("")}
function readSettings(){state.settings={timer:+$("#timerSetting").value,daily:$("#daily").checked,final:$("#finalOn").checked,autoReveal:$("#autoReveal").checked,sound:$("#soundOn").checked,motion:$("#motionOn").checked};state.selectedBanks=$$("#bankGrid input:checked").map(x=>x.value);state.teams=$$(".team-name").map((x,i)=>({name:x.value.trim()||"Team "+(i+1),score:0,correct:0,incorrect:0}));state.active=0}
function applyPreferences(){document.body.classList.toggle("no-motion",state.settings.motion===false)}
function generateBoard(){
  readSettings();if(!state.selectedBanks.length)return toast("Choose at least one content bank.");
  const eligible=state.selectedBanks.filter(b=>b!=="teacher"||getCustom().length);
  if(!eligible.length)return toast("Add a Teacher Pick first.");
  const catCandidates=shuffle(eligible.flatMap(categoriesFor));const chosen=[];for(const c of catCandidates){if(!chosen.some(x=>x.cat===c.cat&&x.bank===c.bank))chosen.push(c);if(chosen.length===6)break}
  while(chosen.length<6){const b=eligible[chosen.length%eligible.length],p=poolForBank(b);chosen.push({bank:b,cat:p[chosen.length%p.length]?.category||"Teacher Picks"})}
  state.board=chosen.flatMap(({bank,cat},col)=>Array.from({length:5},(_,d)=>{
    const candidates=poolForBank(bank).filter(q=>q.category===cat&&q.difficulty===d+1);
    let q=shuffle(candidates)[0]||shuffle(poolForBank(bank).filter(q=>q.difficulty===d+1))[0]||shuffle(poolForBank(bank))[0];
    q=q?{...q,id:q.id+"-"+col+"-"+Math.random().toString(36).slice(2,7)}:makeQuestion("fallback",cat,`evidence|Evaluate the evidence used in this scientific claim.|A strong response considers source, method, data quality, uncertainty and alternatives.`,d+1,col);
    return{...q,col,row:d,value:(d+1)*100,used:false,daily:false}
  }));
  if(state.settings.daily){shuffle(state.board.filter(q=>q.row>0)).slice(0,2).forEach(q=>q.daily=true)}
  state.history=[];state.analytics=[];state.phase="board";applyPreferences();save();showGame()
}
function showGame(){applyPreferences();$("#setupScreen").classList.remove("active");$("#gameScreen").classList.add("active");$("#gameScreen").style.display="block";renderScores();renderBoard();$("#finalBtn").hidden=!state.settings.final}
function renderScores(){$("#scorebar").innerHTML=state.teams.map((t,i)=>`<div class="team-card ${i===state.active?"active":""}"><button data-team="${i}" title="Make active"><strong>${esc(t.name)}</strong><span>${t.score.toLocaleString("en-AU")}</span></button></div>`).join("");$$("[data-team]").forEach(b=>b.onclick=()=>{snapshot("Change active team");state.active=+b.dataset.team;save();renderScores()})}
function renderBoard(){const cats=[...new Map(state.board.map(q=>[q.col,q.category])).values()];$("#board").innerHTML=cats.map(c=>`<div class="category">${esc(c)}</div>`).join("")+Array.from({length:5},(_,row)=>state.board.filter(q=>q.row===row).sort((a,b)=>a.col-b.col).map(q=>`<button class="tile ${q.used?"used":""}" data-id="${q.id}" ${q.used?"disabled":""}>${q.value}</button>`).join("")).join("");$$(".tile:not(.used)").forEach(b=>b.onclick=()=>openClue(b.dataset.id))}
function stimulusHtml(q){if(q.type==="graph")return `<strong>Evidence display</strong><div class="mini-graph" aria-label="Bar graph with increasing values">${[28,43,61,78,72].map((v,i)=>`<i style="height:${v}%" data-v="${[12,19,27,35,32][i]}"></i>`).join("")}</div><small>Values are illustrative. Interpret the pattern before answering.</small>`;if(q.type==="table")return `<table class="data-table"><caption>Investigation results</caption><tr><th>Trial</th><th>Condition A</th><th>Condition B</th></tr>${[[1,12,15],[2,13,18],[3,11,17],[4,12,19]].map(r=>`<tr>${r.map(v=>`<td>${v}</td>`).join("")}</tr>`).join("")}</table>`;if(q.type==="diagram")return `<div class="diagram"><div>Observation</div><b>→ evidence →</b><div>Scientific claim</div></div>`;if(q.type==="image")return `<figure style="margin:0;text-align:center"><img src="../../../earthsims.png" alt="Earth and Environmental Science course image supplied as a visual stimulus" style="max-height:220px;max-width:100%;border-radius:16px"><figcaption>Visual stimulus: identify what further context or evidence would be needed before drawing a conclusion.</figcaption></figure>`;if(q.type==="scenario")return `<strong>Scenario</strong><p>A research team reports this finding after a small classroom investigation. Consider the design, evidence and limits before responding.</p>`;return""}
function openClue(id){const q=state.board.find(x=>x.id===id);if(!q)return;state.current=id;$("#clueMeta").textContent=`${q.category} • ${q.value}`;$("#question").textContent=q.question;$("#answer").innerHTML=`<strong>Expected answer:</strong> ${esc(q.answer)}`;$("#answer").classList.remove("show");const stim=stimulusHtml(q);$("#stimulus").innerHTML=stim;$("#stimulus").hidden=!stim;$("#clueModal").classList.add("open");if(q.daily)showDailyWager(q);else showQuestionActions();startTimer()}
function showQuestionActions(){$("#clueActions").innerHTML=`<button class="secondary" id="timerBtn">Start / restart timer</button><button class="secondary" id="revealBtn">Reveal answer</button><button class="secondary" id="closeClue">Return to board</button>`;$("#timerBtn").onclick=startTimer;$("#revealBtn").onclick=revealAnswer;$("#closeClue").onclick=()=>closeClue(false)}
function revealAnswer(){stopTimer();$("#answer").classList.add("show");$("#clueActions").innerHTML=`<button class="correct" id="correctBtn">✓ Correct — ${esc(state.teams[state.active].name)}</button><button class="incorrect" id="wrongBtn">✕ Incorrect — ${esc(state.teams[state.active].name)}</button><button class="secondary" id="noAnswerBtn">No answer</button>`;$("#correctBtn").onclick=()=>mark(true);$("#wrongBtn").onclick=()=>mark(false);$("#noAnswerBtn").onclick=()=>mark(false,true)}
function startTimer(){stopTimer();seconds=state.settings.timer;$("#timer").textContent=seconds?seconds+" s":"Unlimited";$("#timer").classList.remove("low");if(!seconds)return;timerId=setInterval(()=>{seconds--;$("#timer").textContent=seconds+" s";if(seconds<=5)$("#timer").classList.add("low");if(seconds<=0){stopTimer();beep(220,.25);if(state.settings.autoReveal)revealAnswer()}},1000)}
function stopTimer(){clearInterval(timerId);timerId=null}
function mark(correct,noAnswer=false){const q=state.board.find(x=>x.id===state.current),team=state.teams[state.active];snapshot(correct?"Correct":"Incorrect");const pts=q.daily?(q.wager||q.value):q.value;team.score+=correct?pts:-pts;team[correct?"correct":"incorrect"]++;state.analytics.push({time:new Date().toISOString(),team:team.name,category:q.category,difficulty:q.difficulty,value:q.value,wager:q.wager||"",result:correct?"Correct":noAnswer?"No answer":"Incorrect",question:q.question});
  q.used=true;
  beep(correct?850:180);
  if(!correct)state.active=(state.active+1)%state.teams.length;
  closeClue(true);
}
function closeClue(saveIt){stopTimer();$("#clueModal").classList.remove("open");$("#stealMsg")?.remove();state.current=null;if(saveIt)save();renderScores();renderBoard();if(state.board.every(q=>q.used)){state.settings.final?openFinal():showResults()}}
function showDailyWager(q){stopTimer();const max=Math.max(500,state.teams[state.active].score);$("#question").innerHTML=`<span style="color:#b07a00">DAILY DOUBLE</span><br>${esc(state.teams[state.active].name)}, enter a wager from 0 to ${max.toLocaleString("en-AU")}.</span>`;$("#stimulus").hidden=true;$("#clueActions").innerHTML=`<input id="wager" type="number" min="0" max="${max}" value="${Math.min(q.value,max)}" style="padding:12px;border:1px solid var(--line);border-radius:10px"><button class="correct" id="lockWager">Lock wager & show clue</button>`;$("#lockWager").onclick=()=>{q.wager=Math.max(0,Math.min(max,+$("#wager").value||0));$("#question").textContent=q.question;const stim=stimulusHtml(q);$("#stimulus").innerHTML=stim;$("#stimulus").hidden=!stim;showQuestionActions();startTimer()}}
function openCustom(){const items=getCustom();$("#genericCard").innerHTML=`<h2>Teacher Picks</h2><p class="muted">Create questions for board generation. They remain saved on this device.</p><div class="setup-grid"><div><div class="field"><label>Category</label><input id="cCat" value="Teacher Picks"></div><div class="field"><label>Question</label><textarea id="cQ" rows="3"></textarea></div><div class="field"><label>Expected answer</label><textarea id="cA" rows="3"></textarea></div><div class="field"><label>Difficulty</label><select id="cD">${[1,2,3,4,5].map(n=>`<option value="${n}">${n} — ${n*100} points</option>`).join("")}</select></div><button class="btn primary" id="addCustom">Save Teacher Pick</button></div><div><strong>Saved questions</strong><div class="custom-list">${items.map((x,i)=>`<div class="custom-item"><span><b>${esc(x.category)}</b> — ${esc(x.question)}</span><button class="secondary" data-del="${i}">Delete</button></div>`).join("")||"<p>No questions saved yet.</p>"}</div></div></div><div class="builder-actions"><button class="btn secondary" id="closeGeneric">Done</button></div>`;$("#genericModal").classList.add("open");$("#addCustom").onclick=()=>{if(!$("#cQ").value.trim()||!$("#cA").value.trim())return toast("Add both a question and answer.");const d=+$("#cD").value;items.push({id:"custom-"+Date.now(),bank:"teacher",category:$("#cCat").value.trim()||"Teacher Picks",topic:$("#cQ").value.trim().slice(0,40),question:$("#cQ").value.trim(),answer:$("#cA").value.trim(),difficulty:d,value:d*100,type:"text",custom:true});setCustom(items);openCustom()};$$("[data-del]").forEach(b=>b.onclick=()=>{items.splice(+b.dataset.del,1);setCustom(items);openCustom()});$("#closeGeneric").onclick=closeGeneric}
function closeGeneric(){$("#genericModal").classList.remove("open")}
function openFinal(){closeClue(false);$("#genericCard").innerHTML=`<h2>Final Jeopardy</h2><p class="muted">Category: <strong>Scientific evidence and society</strong>. Enter each team's secret wager, then reveal the clue.</p><div class="final-wagers">${state.teams.map((t,i)=>`<div class="final-team"><strong>${esc(t.name)}</strong><small> Score: ${t.score}</small><input type="number" min="0" max="${Math.max(0,t.score)}" value="0" data-fw="${i}"></div>`).join("")}</div><div class="builder-actions"><button class="btn primary" id="showFinalQ">Lock wagers & show clue</button><button class="btn secondary" id="cancelFinal">Back to board</button></div>`;$("#genericModal").classList.add("open");$("#showFinalQ").onclick=()=>{$$("[data-fw]").forEach(x=>state.teams[+x.dataset.fw].wager=Math.max(0,Math.min(Math.max(0,state.teams[+x.dataset.fw].score),+x.value||0)));showFinalQuestion()};$("#cancelFinal").onclick=closeGeneric}
function showFinalQuestion(){$("#genericCard").innerHTML=`<h2>Final Jeopardy</h2><div class="question">A scientific claim could lead to a major public policy change. What four features would you examine before deciding how much confidence to place in it?</div><div id="finalAnswer" class="answer"><strong>Expected answer:</strong> Any justified four such as source expertise and conflicts, study design, sample and controls, data quality, uncertainty, replication, converging evidence, limitations and plausible alternatives.</div><div class="builder-actions"><button class="btn secondary" id="finalReveal">Reveal answer</button></div><div id="finalMarks"></div>`;$("#finalReveal").onclick=()=>{$("#finalAnswer").classList.add("show");renderFinalMarks()}}
function renderFinalMarks(){$("#finalMarks").innerHTML=`<h3>Mark each team</h3><div class="final-wagers">${state.teams.map((t,i)=>`<div class="final-team"><strong>${esc(t.name)}</strong><div>Wager: ${t.wager||0}</div><div class="mark-row"><button class="correct" data-fmark="${i}:1">Correct</button><button class="incorrect" data-fmark="${i}:0">Incorrect</button></div></div>`).join("")}</div><div class="builder-actions"><button class="btn primary" id="finishFinal">Score & show results</button></div>`;$$("[data-fmark]").forEach(b=>b.onclick=()=>{const[i,v]=b.dataset.fmark.split(":");state.finalMarks[i]=v==="1";b.parentElement.querySelectorAll("button").forEach(x=>x.style.opacity=x===b?"1":".35")});$("#finishFinal").onclick=()=>{snapshot("Final Jeopardy");state.teams.forEach((t,i)=>{const ok=!!state.finalMarks[i];t.score+=ok?(t.wager||0):-(t.wager||0);state.analytics.push({time:new Date().toISOString(),team:t.name,category:"Final Jeopardy",difficulty:5,value:"",wager:t.wager||0,result:ok?"Correct":"Incorrect",question:"Evaluate a policy-relevant scientific claim."})});save();closeGeneric();showResults()}}
function showResults(){closeGeneric();const sorted=[...state.teams].sort((a,b)=>b.score-a.score),attempts=state.analytics.length,correct=state.analytics.filter(x=>x.result==="Correct").length,unanswered=state.analytics.filter(x=>x.category!=="Final Jeopardy"&&x.result!=="Correct");$("#genericCard").innerHTML=`<h2>Game results</h2><div class="results-grid"><div class="result-card"><small>Winner</small><h3>${esc(sorted[0].name)}</h3><strong>${sorted[0].score.toLocaleString("en-AU")} points</strong></div><div class="result-card"><small>Questions attempted</small><h3>${attempts}</h3></div><div class="result-card"><small>Class accuracy</small><h3>${attempts?Math.round(correct/attempts*100):0}%</h3></div></div><h3 style="margin-top:18px">Team summary</h3><table class="data-table"><tr><th>Team</th><th>Score</th><th>Correct</th><th>Incorrect</th></tr>${sorted.map(t=>`<tr><td>${esc(t.name)}</td><td>${t.score}</td><td>${t.correct}</td><td>${t.incorrect}</td></tr>`).join("")}</table><h3 style="margin-top:18px">Category performance</h3><div class="results-grid">${categoryStats().map(x=>`<div class="result-card"><strong>${esc(x.cat)}</strong><div>${x.correct}/${x.total} correct</div></div>`).join("")||"<p>No clues marked.</p>"}</div><h3 style="margin-top:18px">Difficulty performance</h3><div class="results-grid">${difficultyStats().map(x=>`<div class="result-card"><strong>${x.difficulty*100} points</strong><div>${x.correct}/${x.total} correct</div></div>`).join("")||"<p>No clues marked.</p>"}</div><h3 style="margin-top:18px">Questions nobody answered correctly</h3><div class="results-grid">${unanswered.map(x=>`<div class="result-card"><strong>${esc(x.category)} — ${x.value}</strong><div>${esc(x.question)}</div></div>`).join("")||"<p>Every attempted question was answered correctly.</p>"}</div><div class="builder-actions"><button class="btn primary" id="csvBtn">Export analytics CSV</button><button class="btn secondary" id="newGame">New game</button></div>`;$("#genericModal").classList.add("open");$("#csvBtn").onclick=exportCSV;$("#newGame").onclick=()=>{localStorage.removeItem(KEY);location.reload()}}
function categoryStats(){const m={};state.analytics.forEach(x=>{m[x.category]??={cat:x.category,total:0,correct:0};m[x.category].total++;if(x.result==="Correct")m[x.category].correct++});return Object.values(m)}
function difficultyStats(){const m={};state.analytics.filter(x=>x.category!=="Final Jeopardy").forEach(x=>{m[x.difficulty]??={difficulty:x.difficulty,total:0,correct:0};m[x.difficulty].total++;if(x.result==="Correct")m[x.difficulty].correct++});return Object.values(m).sort((a,b)=>a.difficulty-b.difficulty)}
function exportCSV(){const rows=[["Timestamp","Team","Category","Difficulty","Tile value","Wager","Result","Question"],...state.analytics.map(x=>[x.time,x.team,x.category,x.difficulty,x.value,x.wager,x.result,x.question])];const csv=rows.map(r=>r.map(v=>'"'+String(v??"").replaceAll('"','""')+'"').join(",")).join("\r\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="earthenvironmentalscience-jeopardy-analytics.csv";a.click();URL.revokeObjectURL(a.href)}
function undo(){const h=state.history.pop();if(!h)return toast("Nothing to undo.");state.teams=h.teams;state.active=h.active;state.board=h.board;state.analytics=h.analytics;save();renderScores();renderBoard();toast("Undone: "+h.label)}
function loadGame(){try{Object.assign(state,JSON.parse(localStorage.getItem(KEY)));showGame()}catch{toast("Saved game could not be loaded.")}}
$("#generateBtn").onclick=generateBoard;$("#customBtn").onclick=openCustom;$("#resumeBtn").onclick=loadGame;$("#undoBtn").onclick=undo;$("#changeTeamBtn").onclick=()=>{snapshot("Change active team");state.active=(state.active+1)%state.teams.length;save();renderScores()};$("#builderBtn").onclick=()=>{save();$("#gameScreen").style.display="none";$("#gameScreen").classList.remove("active");$("#setupScreen").classList.add("active");$("#resumeBtn").hidden=false};$("#finalBtn").onclick=openFinal;$("#endBtn").onclick=showResults;$("#fitBtn").onclick=()=>document.body.classList.toggle("fit");$("#fullBtn").onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();init();
</script>
</body>
</html>
