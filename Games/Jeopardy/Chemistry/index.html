ture in this course.|A syllabus concept used when explaining gas quantities."]],["Introduction to Quantitative Chemistry — Evidence and applications",["Pressure|Define Pressure.|A syllabus concept used when explaining gas quantities.","Mole|Explain the scientific significance of Mole.|The amount containing Avogadro’s number of entities.","Avogadro constant|Apply Avogadro constant to a relevant scientific scenario.|The number of entities in one mole.","Molar mass|Analyse how Molar mass contributes to explaining or investigating a system.|The mass of one mole of a substance.","Empirical formula|Evaluate the role, usefulness or limitations of Empirical formula in this course.|The simplest whole-number atom ratio in a compound."]],["Introduction to Quantitative Chemistry — Analysis",["Concentration|Define Concentration.|Amount of solute per volume of solution.","Solute|Explain the scientific significance of Solute.|The substance dissolved in a solution.","Solvent|Apply Solvent to a relevant scientific scenario.|The substance that dissolves the solute.","Dilution|Analyse how Dilution contributes to explaining or investigating a system.|Lowering concentration by adding solvent.","Balanced equation|Evaluate the role, usefulness or limitations of Balanced equation in this course.|A syllabus concept used when explaining stoichiometric tools."]],["Introduction to Quantitative Chemistry — Synthesis and evaluation",["Mole ratio|Define Mole ratio.|A syllabus concept used when explaining stoichiometric tools.","Limiting reagent|Explain the scientific significance of Limiting reagent.|A syllabus concept used when explaining stoichiometric tools.","Percentage yield|Apply Percentage yield to a relevant scientific scenario.|A syllabus concept used when explaining stoichiometric tools.","Gas volume|Analyse how Gas volume contributes to explaining or investigating a system.|A syllabus concept used when explaining gas quantities.","Molar volume|Evaluate the role, usefulness or limitations of Molar volume in this course.|A syllabus concept used when explaining gas quantities."]]],"m3":[["Reactive Chemistry — Foundations",["Colour change|Define Colour change.|A visible change that may indicate new substances.","Gas production|Explain the scientific significance of Gas production.|Formation of a gaseous reaction product.","Precipitate|Apply Precipitate to a relevant scientific scenario.|An insoluble solid formed from solution.","Temperature change|Analyse how Temperature change contributes to explaining or investigating a system.|Evidence of energy transfer during reaction.","Synthesis|Evaluate the role, usefulness or limitations of Synthesis in this course.|Two or more reactants forming one product."]],["Reactive Chemistry — Structures and systems",["Decomposition|Define Decomposition.|One compound breaking into simpler substances.","Combustion|Explain the scientific significance of Combustion.|Rapid reaction with oxygen releasing energy.","Displacement|Apply Displacement to a relevant scientific scenario.|A more reactive element replacing another.","Oxidation|Analyse how Oxidation contributes to explaining or investigating a system.|A syllabus concept used when explaining redox language.","Reduction|Evaluate the role, usefulness or limitations of Reduction in this course.|A syllabus concept used when explaining redox language."]],["Reactive Chemistry — Processes",["Oxidising agent|Define Oxidising agent.|A syllabus concept used when explaining redox language.","Reducing agent|Explain the scientific significance of Reducing agent.|A syllabus concept used when explaining redox language.","Concentration|Apply Concentration to a relevant scientific scenario.|A syllabus concept used when explaining reaction rate factors.","Temperature|Analyse how Temperature contributes to explaining or investigating a system.|A syllabus concept used when explaining reaction rate factors.","Surface area|Evaluate the role, usefulness or limitations of Surface area in this course.|A syllabus concept used when explaining reaction rate factors."]],["Reactive Chemistry — Evidence and applications",["Catalyst|Define Catalyst.|A syllabus concept used when explaining reaction rate factors.","Colour change|Explain the scientific significance of Colour change.|A visible change that may indicate new substances.","Gas production|Apply Gas production to a relevant scientific scenario.|Formation of a gaseous reaction product.","Precipitate|Analyse how Precipitate contributes to explaining or investigating a system.|An insoluble solid formed from solution.","Temperature change|Evaluate the role, usefulness or limitations of Temperature change in this course.|Evidence of energy transfer during reaction."]],["Reactive Chemistry — Analysis",["Synthesis|Define Synthesis.|Two or more reactants forming one product.","Decomposition|Explain the scientific significance of Decomposition.|One compound breaking into simpler substances.","Combustion|Apply Combustion to a relevant scientific scenario.|Rapid reaction with oxygen releasing energy.","Displacement|Analyse how Displacement contributes to explaining or investigating a system.|A more reactive element replacing another.","Oxidation|Evaluate the role, usefulness or limitations of Oxidation in this course.|A syllabus concept used when explaining redox language."]],["Reactive Chemistry — Synthesis and evaluation",["Reduction|Define Reduction.|A syllabus concept used when explaining redox language.","Oxidising agent|Explain the scientific significance of Oxidising agent.|A syllabus concept used when explaining redox language.","Reducing agent|Apply Reducing agent to a relevant scientific scenario.|A syllabus concept used when explaining redox language.","Concentration|Analyse how Concentration contributes to explaining or investigating a system.|A syllabus concept used when explaining reaction rate factors.","Temperature|Evaluate the role, usefulness or limitations of Temperature in this course.|A syllabus concept used when explaining reaction rate factors."]]],"m4":[["Drivers of Reactions — Foundations",["Exothermic reaction|Define Exothermic reaction.|A reaction releasing heat to the surroundings.","Endothermic reaction|Explain the scientific significance of Endothermic reaction.|A reaction absorbing heat from the surroundings.","Activation energy|Apply Activation energy to a relevant scientific scenario.|The minimum energy required for reaction.","Enthalpy change|Analyse how Enthalpy change contributes to explaining or investigating a system.|Heat change at constant pressure.","Collision|Evaluate the role, usefulness or limitations of Collision in this course.|An encounter between reacting particles."]],["Drivers of Reactions — Structures and systems",["Effective collision|Define Effective collision.|A collision with enough energy and suitable orientation.","Reaction rate|Explain the scientific significance of Reaction rate.|Change in reactant or product amount per time.","Catalyst|Apply Catalyst to a relevant scientific scenario.|A substance providing a lower-energy pathway.","Calorimeter|Analyse how Calorimeter contributes to explaining or investigating a system.|A syllabus concept used when explaining calorimetry.","Specific heat capacity|Evaluate the role, usefulness or limitations of Specific heat capacity in this course.|A syllabus concept used when explaining calorimetry."]],["Drivers of Reactions — Processes",["Temperature change|Define Temperature change.|A syllabus concept used when explaining calorimetry.","Heat transfer|Explain the scientific significance of Heat transfer.|A syllabus concept used when explaining calorimetry.","Entropy|Apply Entropy to a relevant scientific scenario.|A syllabus concept used when explaining spontaneity ideas.","Energy dispersal|Analyse how Energy dispersal contributes to explaining or investigating a system.|A syllabus concept used when explaining spontaneity ideas.","System|Evaluate the role, usefulness or limitations of System in this course.|A syllabus concept used when explaining spontaneity ideas."]],["Drivers of Reactions — Evidence and applications",["Surroundings|Define Surroundings.|A syllabus concept used when explaining spontaneity ideas.","Exothermic reaction|Explain the scientific significance of Exothermic reaction.|A reaction releasing heat to the surroundings.","Endothermic reaction|Apply Endothermic reaction to a relevant scientific scenario.|A reaction absorbing heat from the surroundings.","Activation energy|Analyse how Activation energy contributes to explaining or investigating a system.|The minimum energy required for reaction.","Enthalpy change|Evaluate the role, usefulness or limitations of Enthalpy change in this course.|Heat change at constant pressure."]],["Drivers of Reactions — Analysis",["Collision|Define Collision.|An encounter between reacting particles.","Effective collision|Explain the scientific significance of Effective collision.|A collision with enough energy and suitable orientation.","Reaction rate|Apply Reaction rate to a relevant scientific scenario.|Change in reactant or product amount per time.","Catalyst|Analyse how Catalyst contributes to explaining or investigating a system.|A substance providing a lower-energy pathway.","Calorimeter|Evaluate the role, usefulness or limitations of Calorimeter in this course.|A syllabus concept used when explaining calorimetry."]],["Drivers of Reactions — Synthesis and evaluation",["Specific heat capacity|Define Specific heat capacity.|A syllabus concept used when explaining calorimetry.","Temperature change|Explain the scientific significance of Temperature change.|A syllabus concept used when explaining calorimetry.","Heat transfer|Apply Heat transfer to a relevant scientific scenario.|A syllabus concept used when explaining calorimetry.","Entropy|Analyse how Entropy contributes to explaining or investigating a system.|A syllabus concept used when explaining spontaneity ideas.","Energy dispersal|Evaluate the role, usefulness or limitations of Energy dispersal in this course.|A syllabus concept used when explaining spontaneity ideas."]]],"m5":[["Equilibrium and Acid Reactions — Foundations",["Open system|Define Open system.|A system that can exchange both matter and energy with its surroundings.","Closed system|Explain the scientific significance of Closed system.|A system that can exchange energy but not matter with its surroundings.","Reversible reaction|Apply Reversible reaction to a relevant scientific scenario.|A reaction in which products can react to reform the original reactants.","Irreversible reaction|Analyse how Irreversible reaction contributes to explaining or investigating a system.|A reaction that proceeds overwhelmingly in one direction under the stated conditions.","Static equilibrium|Evaluate the role, usefulness or limitations of Static equilibrium in this course.|A state in which no opposing processes are occurring and no macroscopic change is observed."]],["Equilibrium and Acid Reactions — Structures and systems",["Dynamic equilibrium|Define Dynamic equilibrium.|A state in a closed system where forward and reverse reactions continue at equal rates.","Equilibrium position|Explain the scientific significance of Equilibrium position.|The relative proportions of reactants and products present at equilibrium.","Forward reaction|Apply Forward reaction to a relevant scientific scenario.|The reaction written from reactants to products.","Reverse reaction|Analyse how Reverse reaction contributes to explaining or investigating a system.|The reaction in which products form the original reactants.","Macroscopic properties|Evaluate the role, usefulness or limitations of Macroscopic properties in this course.|Observable properties such as colour, pressure and concentration that remain constant at equilibrium."]],["Equilibrium and Acid Reactions — Processes",["Reaction rate|Define Reaction rate.|The change in concentration of a reactant or product per unit time.","Collision theory|Explain the scientific significance of Collision theory.|A model stating that particles must collide with sufficient energy and suitable orientation to react.","Effective collision|Apply Effective collision to a relevant scientific scenario.|A collision with enough energy and the correct orientation to form products.","Activation energy|Analyse how Activation energy contributes to explaining or investigating a system.|The minimum energy required for a successful reaction collision.","Catalyst|Evaluate the role, usefulness or limitations of Catalyst in this course.|A substance that increases reaction rate by providing a lower-activation-energy pathway and is regenerated."]],["Equilibrium and Acid Reactions — Evidence and applications",["Le Chatelier’s principle|Define Le Chatelier’s principle.|When an equilibrium system is disturbed, it shifts in the direction that partially opposes the disturbance.","Concentration change|Explain the scientific significance of Concentration change.|A disturbance caused by adding or removing a reactant or product.","Pressure change|Apply Pressure change to a relevant scientific scenario.|A disturbance affecting gas equilibria when the container volume is changed.","Volume change|Analyse how Volume change contributes to explaining or investigating a system.|A change that alters gas pressure and can shift an equilibrium involving unequal gas mole numbers.","Temperature change|Evaluate the role, usefulness or limitations of Temperature change in this course.|A disturbance that changes the equilibrium position and the value of the equilibrium constant."]],["Equilibrium and Acid Reactions — Analysis",["Endothermic reaction|Define Endothermic reaction.|A reaction that absorbs heat from its surroundings and has a positive enthalpy change.","Exothermic reaction|Explain the scientific significance of Exothermic reaction.|A reaction that releases heat to its surroundings and has a negative enthalpy change.","Enthalpy|Apply Enthalpy to a relevant scientific scenario.|A thermodynamic quantity associated with the heat content of a system at constant pressure.","Entropy|Analyse how Entropy contributes to explaining or investigating a system.|A measure of the dispersal of energy or the number of possible arrangements in a system.","Equilibrium constant|Evaluate the role, usefulness or limitations of Equilibrium constant in this course.|A constant relating equilibrium concentrations of products and reactants at a specified temperature."]],["Equilibrium and Acid Reactions — Synthesis and evaluation",["Equilibrium expression|Define Equilibrium expression.|The mathematical ratio of equilibrium product concentrations to reactant concentrations, each raised to stoichiometric powers.","Keq|Explain the scientific significance of Keq.|The equilibrium constant for a specified reversible reaction at a given temperature.","Large Keq|Apply Large Keq to a relevant scientific scenario.|An equilibrium constant much greater than one, indicating that products are favoured at equilibrium.","Small Keq|Analyse how Small Keq contributes to explaining or investigating a system.|An equilibrium constant much less than one, indicating that reactants are favoured at equilibrium.","Homogeneous equilibrium|Evaluate the role, usefulness or limitations of Homogeneous equilibrium in this course.|An equilibrium in which all reactants and products are in the same physical state."]]],"m6":[["Acid/Base Reactions — Foundations",["Acid|Define Acid.|A substance described by a model as producing hydrogen ions or donating a proton.","Base|Explain the scientific significance of Base.|A substance described by a model as producing hydroxide ions or accepting a proton.","Arrhenius acid|Apply Arrhenius acid to a relevant scientific scenario.|A substance that increases the concentration of H⁺ or H₃O⁺ in aqueous solution.","Arrhenius base|Analyse how Arrhenius base contributes to explaining or investigating a system.|A substance that increases the concentration of OH⁻ in aqueous solution.","Brønsted–Lowry acid|Evaluate the role, usefulness or limitations of Brønsted–Lowry acid in this course.|A proton donor."]],["Acid/Base Reactions — Structures and systems",["Brønsted–Lowry base|Define Brønsted–Lowry base.|A proton acceptor.","Proton transfer|Explain the scientific significance of Proton transfer.|Movement of H⁺ from a Brønsted–Lowry acid to a Brønsted–Lowry base.","Conjugate acid|Apply Conjugate acid to a relevant scientific scenario.|The species formed when a base accepts a proton.","Conjugate base|Analyse how Conjugate base contributes to explaining or investigating a system.|The species formed when an acid donates a proton.","Conjugate acid–base pair|Evaluate the role, usefulness or limitations of Conjugate acid–base pair in this course.|Two species differing by one proton."]],["Acid/Base Reactions — Processes",["Amphiprotic species|Define Amphiprotic species.|A species capable of both donating and accepting a proton.","Hydronium ion|Explain the scientific significance of Hydronium ion.|The H₃O⁺ ion formed when water accepts a proton.","Hydroxide ion|Apply Hydroxide ion to a relevant scientific scenario.|The OH⁻ ion associated with basic aqueous solutions.","Ionisation|Analyse how Ionisation contributes to explaining or investigating a system.|Formation of ions when a molecular substance reacts with a solvent such as water.","Neutralisation|Evaluate the role, usefulness or limitations of Neutralisation in this course.|A reaction between an acid and a base that forms products such as a salt and water."]],["Acid/Base Reactions — Evidence and applications",["Salt|Define Salt.|An ionic compound formed when the replaceable hydrogen ion of an acid is replaced by a cation.","Acid–metal reaction|Explain the scientific significance of Acid–metal reaction.|A reaction producing a salt and hydrogen gas when a suitable metal reacts with an acid.","Acid–carbonate reaction|Apply Acid–carbonate reaction to a relevant scientific scenario.|A reaction producing a salt, carbon dioxide and water.","Acid–base reaction|Analyse how Acid–base reaction contributes to explaining or investigating a system.|A proton-transfer or neutralisation reaction between an acid and a base.","Enthalpy of neutralisation|Evaluate the role, usefulness or limitations of Enthalpy of neutralisation in this course.|The enthalpy change when an acid and base react to form one mole of water under specified conditions."]],["Acid/Base Reactions — Analysis",["Indicator|Define Indicator.|A substance whose colour depends on the acidity of a solution.","Universal indicator|Explain the scientific significance of Universal indicator.|A mixture of indicators showing a range of colours across a broad pH scale.","Natural indicator|Apply Natural indicator to a relevant scientific scenario.|A coloured substance from a natural source whose form and colour depend on pH.","Strong acid|Analyse how Strong acid contributes to explaining or investigating a system.|An acid that ionises essentially completely in water.","Weak acid|Evaluate the role, usefulness or limitations of Weak acid in this course.|An acid that establishes an equilibrium and ionises only partially in water."]],["Acid/Base Reactions — Synthesis and evaluation",["Strong base|Define Strong base.|A base that dissociates or reacts essentially completely to produce hydroxide ions in water.","Weak base|Explain the scientific significance of Weak base.|A base that reacts only partially with water to form its conjugate acid and hydroxide ions.","Concentrated solution|Apply Concentrated solution to a relevant scientific scenario.|A solution containing a relatively large amount of solute per unit volume.","Dilute solution|Analyse how Dilute solution contributes to explaining or investigating a system.|A solution containing a relatively small amount of solute per unit volume.","Monoprotic acid|Evaluate the role, usefulness or limitations of Monoprotic acid in this course.|An acid able to donate one proton per molecule."]]],"m7":[["Organic Chemistry — Foundations",["Organic compound|Define Organic compound.|A carbon-based compound, generally containing carbon–hydrogen bonds, studied within organic chemistry.","Hydrocarbon|Explain the scientific significance of Hydrocarbon.|A compound containing only carbon and hydrogen.","Homologous series|Apply Homologous series to a relevant scientific scenario.|A family of compounds with the same functional group and general formula, showing systematic trends.","Functional group|Analyse how Functional group contributes to explaining or investigating a system.|An atom or group of atoms responsible for characteristic reactions of an organic compound.","IUPAC nomenclature|Evaluate the role, usefulness or limitations of IUPAC nomenclature in this course.|An internationally agreed system for naming chemical compounds."]],["Organic Chemistry — Structures and systems",["Molecular formula|Define Molecular formula.|A formula showing the actual number of each type of atom in a molecule.","Structural formula|Explain the scientific significance of Structural formula.|A representation showing how atoms are connected within a molecule.","Condensed structural formula|Apply Condensed structural formula to a relevant scientific scenario.|A compact formula showing the sequence of bonded groups without drawing every bond.","Skeletal formula|Analyse how Skeletal formula contributes to explaining or investigating a system.|A line-angle representation in which carbon atoms and attached hydrogens are implied.","General formula|Evaluate the role, usefulness or limitations of General formula in this course.|A formula representing the common composition pattern of a homologous series."]],["Organic Chemistry — Processes",["Structural isomer|Define Structural isomer.|A compound with the same molecular formula as another compound but different atom connectivity.","Chain isomer|Explain the scientific significance of Chain isomer.|A structural isomer differing in the arrangement of the carbon skeleton.","Position isomer|Apply Position isomer to a relevant scientific scenario.|A structural isomer differing in the position of a functional group, substituent or multiple bond.","Functional-group isomer|Analyse how Functional-group isomer contributes to explaining or investigating a system.|A structural isomer with a different functional group.","Saturated hydrocarbon|Evaluate the role, usefulness or limitations of Saturated hydrocarbon in this course.|A hydrocarbon containing only carbon–carbon single bonds."]],["Organic Chemistry — Evidence and applications",["Unsaturated hydrocarbon|Define Unsaturated hydrocarbon.|A hydrocarbon containing at least one carbon–carbon double or triple bond.","Alkane|Explain the scientific significance of Alkane.|A saturated hydrocarbon with only carbon–carbon single bonds.","Alkene|Apply Alkene to a relevant scientific scenario.|An unsaturated hydrocarbon containing a carbon–carbon double bond.","Alkyne|Analyse how Alkyne contributes to explaining or investigating a system.|An unsaturated hydrocarbon containing a carbon–carbon triple bond.","Methyl substituent|Evaluate the role, usefulness or limitations of Methyl substituent in this course.|A –CH₃ branch attached to the main carbon chain."]],["Organic Chemistry — Analysis",["Ethyl substituent|Define Ethyl substituent.|A –CH₂CH₃ branch attached to the main carbon chain.","Sigma bond|Explain the scientific significance of Sigma bond.|A covalent bond formed by head-on overlap of orbitals along the internuclear axis.","Pi bond|Apply Pi bond to a relevant scientific scenario.|A covalent bond formed by sideways overlap of orbitals above and below the bond axis.","Tetrahedral geometry|Analyse how Tetrahedral geometry contributes to explaining or investigating a system.|The approximately 109.5° arrangement around a carbon atom with four single bonds.","Trigonal planar geometry|Evaluate the role, usefulness or limitations of Trigonal planar geometry in this course.|The approximately 120° planar arrangement around each carbon in a carbon–carbon double bond."]],["Organic Chemistry — Synthesis and evaluation",["Linear geometry|Define Linear geometry.|The 180° arrangement around each carbon in a carbon–carbon triple bond.","Dispersion force|Explain the scientific significance of Dispersion force.|An intermolecular attraction arising from temporary and induced dipoles.","Hydrogen bonding|Apply Hydrogen bonding to a relevant scientific scenario.|A strong intermolecular attraction involving H bonded to N, O or F and a lone pair on another molecule.","Boiling-point trend|Analyse how Boiling-point trend contributes to explaining or investigating a system.|The systematic change in boiling point associated with molecular size, shape and intermolecular forces.","Volatility|Evaluate the role, usefulness or limitations of Volatility in this course.|The tendency of a substance to vaporise."]]],"m8":[["Applying Chemical Ideas — Foundations",["Qualitative analysis|Define Qualitative analysis.|Analysis used to identify which substances or ions are present.","Quantitative analysis|Explain the scientific significance of Quantitative analysis.|Analysis used to determine the amount or concentration of a substance.","Flame test|Apply Flame test to a relevant scientific scenario.|A qualitative test in which characteristic emission colours help identify some metal ions.","Precipitation test|Analyse how Precipitation test contributes to explaining or investigating a system.|A qualitative test identifying ions through formation and properties of an insoluble solid.","Complexation reaction|Evaluate the role, usefulness or limitations of Complexation reaction in this course.|Formation of a coordination complex, often producing a characteristic colour."]],["Applying Chemical Ideas — Structures and systems",["Barium ion|Define Barium ion.|Ba²⁺, a cation identified through characteristic precipitation reactions.","Calcium ion|Explain the scientific significance of Calcium ion.|Ca²⁺, a cation that can be investigated using flame and precipitation tests.","Magnesium ion|Apply Magnesium ion to a relevant scientific scenario.|Mg²⁺, a cation commonly identified through hydroxide or carbonate precipitation.","Lead(II) ion|Analyse how Lead(II) ion contributes to explaining or investigating a system.|Pb²⁺, a toxic cation forming characteristic precipitates with several anions.","Silver ion|Evaluate the role, usefulness or limitations of Silver ion in this course.|Ag⁺, a cation commonly used to test for halide ions through precipitate formation."]],["Applying Chemical Ideas — Processes",["Copper(II) ion|Define Copper(II) ion.|Cu²⁺, a coloured cation forming blue solutions and characteristic complexes or precipitates.","Iron(II) ion|Explain the scientific significance of Iron(II) ion.|Fe²⁺, a cation that commonly forms pale green solutions and hydroxide precipitates.","Iron(III) ion|Apply Iron(III) ion to a relevant scientific scenario.|Fe³⁺, a cation that commonly forms yellow-brown solutions and coloured complexes.","Chloride ion|Analyse how Chloride ion contributes to explaining or investigating a system.|Cl⁻, an anion forming a white precipitate with silver ions under suitable test conditions.","Bromide ion|Evaluate the role, usefulness or limitations of Bromide ion in this course.|Br⁻, an anion forming a cream precipitate with silver ions."]],["Applying Chemical Ideas — Evidence and applications",["Iodide ion|Define Iodide ion.|I⁻, an anion forming a yellow precipitate with silver ions.","Hydroxide ion|Explain the scientific significance of Hydroxide ion.|OH⁻, an anion identified through pH and characteristic metal-hydroxide precipitates.","Acetate ion|Apply Acetate ion to a relevant scientific scenario.|CH₃COO⁻, the conjugate base of ethanoic acid.","Carbonate ion|Analyse how Carbonate ion contributes to explaining or investigating a system.|CO₃²⁻, an anion that releases carbon dioxide when acidified.","Sulfate ion|Evaluate the role, usefulness or limitations of Sulfate ion in this course.|SO₄²⁻, an anion forming a white precipitate with barium ions under suitable conditions."]],["Applying Chemical Ideas — Analysis",["Phosphate ion|Define Phosphate ion.|PO₄³⁻, an anion that forms precipitates with several metal ions.","Gravimetric analysis|Explain the scientific significance of Gravimetric analysis.|Quantitative analysis based on measuring the mass of a product of known composition.","Precipitation titration|Apply Precipitation titration to a relevant scientific scenario.|A titration in which the analyte and titrant form a sparingly soluble precipitate.","Colourimetry|Analyse how Colourimetry contributes to explaining or investigating a system.|Determination of concentration by measuring absorption or transmission of selected visible light.","Ultraviolet–visible spectrophotometry|Evaluate the role, usefulness or limitations of Ultraviolet–visible spectrophotometry in this course.|Measurement of ultraviolet or visible light absorption as a function of wavelength."]],["Applying Chemical Ideas — Synthesis and evaluation",["Atomic absorption spectroscopy|Define Atomic absorption spectroscopy.|Determination of metal concentration by measuring light absorbed by gaseous ground-state atoms.","Calibration curve|Explain the scientific significance of Calibration curve.|A graph of instrument response against known concentration used to determine an unknown concentration.","Standard solution|Apply Standard solution to a relevant scientific scenario.|A solution with an accurately known concentration used for calibration or analysis.","Blank solution|Analyse how Blank solution contributes to explaining or investigating a system.|A reference containing all components except the analyte, used to correct background instrument response.","Absorbance|Evaluate the role, usefulness or limitations of Absorbance in this course.|A logarithmic measure of the amount of light absorbed by a sample."]]],"working":[["Questioning",["question|What makes a question investigable?|It can be answered with ethical collection or analysis of evidence.","prediction|What should a scientific prediction include?|An expected outcome grounded in scientific reasoning.","hypothesis|How is a hypothesis evaluated?|By deriving predictions and comparing them with evidence.","variables|Why identify variables before collecting data?|To plan valid measurements and controls.","scope|Why narrow the scope of a question?|To make the study feasible and the conclusion precise."]],["Planning",["method|What makes a method reproducible?|Clear materials, quantities, sequence, controls and measurement details.","safety|What is the hierarchy of controls?|Eliminate, substitute, engineer, administrate, then use personal protective equipment.","ethics|When is ethical approval relevant?|When research involves people, animals, sensitive data or significant impacts.","sample|How should sample size be chosen?|Using expected variation, effect size, design, feasibility and power.","pilot|What can a pilot test?|Timing, instructions, instruments, data capture and practical risks."]],["Conducting",["recording|Why record data immediately?|It reduces memory error and preserves an auditable record.","units|Why use SI units where appropriate?|They support consistent comparison and communication.","repeats|Why repeat measurements?|To estimate random variation and improve the precision of an average.","anomaly|What should happen when an anomaly appears?|Check records and method, repeat if justified and report transparently.","provenance|What is data provenance?|A record of where data came from and how it was produced or changed."]],["Processing",["table|What makes a good data table?|Clear headings, units, consistent precision and organised raw values.","graph|How is a graph type selected?|Match it to variable types and the relationship or distribution being shown.","calculation|Why show a sample calculation?|It makes processing transparent and checkable.","normalisation|What is normalisation used for?|Making values comparable by adjusting for scale or another factor.","uncertainty|How can uncertainty propagate?|Uncertainty in inputs contributes to uncertainty in calculated outputs."]],["Analysing",["pattern|What distinguishes a pattern from noise?|It is consistent enough, relative to variation, to warrant explanation.","association|Why is association not automatically causation?|Confounding, reverse causation or chance may explain it.","uncertainty|Why include uncertainty in analysis?|Point estimates alone overstate precision.","limitations|Where should limitations be considered?|In interpreting how methods and data constrain conclusions.","alternative explanation|Why test alternative explanations?|The preferred explanation should outperform credible rivals."]],["Communicating",["audience|How should communication change for an audience?|Adjust language and format without distorting evidence or uncertainty.","citation|Why cite sources?|To credit work and let readers inspect supporting evidence.","visualisation|What makes a visualisation honest?|Proportionate scales, clear labels, context and no selective omission.","conclusion|What belongs in a conclusion?|A direct evidence-based answer, uncertainty and scope.","peer feedback|What is the value of peer feedback?|It can detect errors and improve reasoning and clarity."]]],"glossary":[["Syllabus Glossary — Foundations",["Aboriginal and Torres Strait Islander Peoples|Define Aboriginal and Torres Strait Islander Peoples.|Australia’s Indigenous peoples, comprising diverse Aboriginal language groups and Torres Strait Islander cultural groups.","Conclusion|Explain the scientific significance of Conclusion.|A judgement based on evidence.","Controlled variable|Apply Controlled variable to a relevant scientific scenario.|A factor kept constant, or changed consistently, during an investigation.","Country|Analyse how Country contributes to explaining or investigating a system.|Land and waters traditionally cared for by an Aboriginal language group or community, including cultural and spiritual relationships.","Dependent variable|Evaluate the role, usefulness or limitations of Dependent variable in this course.|The factor that changes in response to the independent variable."]],["Syllabus Glossary — Structures and systems",["Digital technologies|Define Digital technologies.|Hardware and software systems that handle digital data for particular purposes.","Enthalpy|Explain the scientific significance of Enthalpy.|A thermodynamic quantity associated with the total heat content of a system.","Entropy|Apply Entropy to a relevant scientific scenario.|The degree of energy dispersal or disorder in a system.","Environment|Analyse how Environment contributes to explaining or investigating a system.|All living and non-living surroundings.","Hypothesis|Evaluate the role, usefulness or limitations of Hypothesis in this course.|A precise, testable proposed explanation that can be supported or refuted by investigation."]],["Syllabus Glossary — Processes",["Independent variable|Define Independent variable.|The factor deliberately changed to observe its effect on the dependent variable.","Investigation|Explain the scientific significance of Investigation.|A planned scientific process for answering a question, exploring an idea or solving a problem using evidence.","Law|Apply Law to a relevant scientific scenario.|A statement describing an invariant relationship under specified conditions, often expressed mathematically.","Model|Analyse how Model contributes to explaining or investigating a system.|A representation used to describe, simplify, explain or predict an object, system or idea.","Molar mass|Evaluate the role, usefulness or limitations of Molar mass in this course.|The mass of one mole of a substance."]],["Syllabus Glossary — Evidence and applications",["Place|Define Place.|A space recognised by Torres Strait Islander Peoples through physical, cultural and spiritual relationships.","Plan|Explain the scientific significance of Plan.|To decide on a course of action and make arrangements before carrying it out.","Practical investigation|Apply Practical investigation to a relevant scientific scenario.|A systematic inquiry using equipment and hands-on methods to collect data or information.","Primary sources/primary data|Analyse how Primary sources/primary data contributes to explaining or investigating a system.|Information produced by people directly involved in a study or observation.","Qualitative|Evaluate the role, usefulness or limitations of Qualitative in this course.|Relating to descriptions or the quality of something rather than numerical quantity."]],["Syllabus Glossary — Analysis",["Quantitative|Define Quantitative.|Relating to numerical measurement or quantity.","Redox|Explain the scientific significance of Redox.|A reaction in which oxidation and reduction occur together through electron transfer or oxidation-state change.","Reliability|Apply Reliability to a relevant scientific scenario.|The extent to which repeated observations under the same conditions give similar results.","Secondary-sourced investigation|Analyse how Secondary-sourced investigation contributes to explaining or investigating a system.|A planned inquiry using data and information produced by other people.","Technology|Evaluate the role, usefulness or limitations of Technology in this course.|A human-made tool, system, machine or process used to solve problems or meet needs."]],["Syllabus Glossary — Synthesis and evaluation",["Theory|Define Theory.|A broad, testable explanatory framework supported by evidence and capable of prediction.","Validity|Explain the scientific significance of Validity.|The extent to which a test measures what was intended and supports accurate inferences.","Variable|Apply Variable to a relevant scientific scenario.|A factor in an investigation that can be changed, controlled or measured.","Vector|Analyse how Vector contributes to explaining or investigating a system.|A quantity possessing both magnitude and direction.","Aboriginal and Torres Strait Islander Peoples|Evaluate the role, usefulness or limitations of Aboriginal and Torres Strait Islander Peoples in this course.|Australia’s Indigenous peoples, comprising diverse Aboriginal language groups and Torres Strait Islander cultural groups."]]]};

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const state={teams:[],active:0,board:[],history:[],analytics:[],settings:{},selectedBanks:[],current:null,phase:"setup",finalMarks:{}};
const KEY="scisims-chemistry-jeopardy-v2";
const PREF="scisims-chemistry-jeopardy-teams-v2";
let timerId=null,seconds=0,audioCtx=null;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800);}
function beep(freq=600,dur=.09){if(!state.settings.sound)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=freq;o.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(.07,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);o.start();o.stop(audioCtx.currentTime+dur)}catch{}}
function save(){localStorage.setItem(KEY,JSON.stringify(state));localStorage.setItem(PREF,JSON.stringify(state.teams.map(t=>t.name)));}
function snapshot(label){state.history.push({label,teams:JSON.parse(JSON.stringify(state.teams)),active:state.active,board:JSON.parse(JSON.stringify(state.board)),analytics:JSON.parse(JSON.stringify(state.analytics))});if(state.history.length>80)state.history.shift();}
function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeQuestion(bank,cat,raw,difficulty,index){const [topic,q,a,type="text"]=raw.split("|");return{id:bank+"-"+cat.replace(/\W/g,"")+"-"+index+"-"+Date.now(),bank,category:cat,topic,question:q,answer:a,difficulty,value:difficulty*100,type,used:false,daily:false,custom:false}}
function poolForBank(bank){if(REVIEW_MAP[bank])return REVIEW_MAP[bank].flatMap(b=>poolForBank(b));if(bank==="teacher")return getCustom();return (CONTENT[bank]||[]).flatMap(([cat,rows])=>rows.map((r,i)=>makeQuestion(bank,cat,r,i+1,i)))}
function categoriesFor(bank){if(REVIEW_MAP[bank])return shuffle(REVIEW_MAP[bank].flatMap(b=>(CONTENT[b]||[]).map(([c])=>({bank:b,cat:c}))));return (CONTENT[bank]||[]).map(([cat])=>({bank,cat}))}
function getCustom(){try{return JSON.parse(localStorage.getItem("scisims-chemistry-jeopardy-custom-v2")||"[]")}catch{return[]}}
function setCustom(v){localStorage.setItem("scisims-chemistry-jeopardy-custom-v2",JSON.stringify(v))}
function init(){
  const names=(()=>{try{return JSON.parse(localStorage.getItem(PREF)||"null")}catch{return null}})()||["Team Curie","Team Newton","Team Franklin"];
  $("#teamCount").innerHTML=[2,3,4,5,6].map(n=>`<option value="${n}" ${n===names.length?"selected":""}>${n} teams</option>`).join("");
  renderTeamInputs(names);$("#teamCount").onchange=()=>renderTeamInputs(names);
  $("#bankGrid").innerHTML=BANKS.map(([id,title,sub],i)=>`<label class="bank"><input type="checkbox" value="${id}" ${i===12?"checked":""}><span><strong>${title}</strong><br><small>${sub}</small></span></label>`).join("");
  const requestedBank=new URLSearchParams(location.search).get("bank");if(requestedBank){$$("#bankGrid input").forEach(input=>input.checked=input.value===requestedBank)}
  const saved=localStorage.getItem(KEY);$("#resumeBtn").hidden=!saved;
}
function renderTeamInputs(seed=[]){const n=+$("#teamCount").value;$("#teamInputs").innerHTML=Array.from({length:n},(_,i)=>`<div class="field"><label>Team ${i+1}</label><input class="team-name" value="${esc(seed[i]||"Team "+(i+1))}" maxlength="30"></div>`).join("")}
function readSettings(){state.settings={timer:+$("#timerSetting").value,daily:$("#daily").checked,final:$("#finalOn").checked,autoReveal:$("#autoReveal").checked,sound:$("#soundOn").checked,motion:$("#motionOn").checked};state.selectedBanks=$$("#bankGrid input:checked").map(x=>x.value);state.teams=$$(".team-name").map((x,i)=>({name:x.value.trim()||"Team "+(i+1),score:0,correct:0,incorrect:0}));state.active=0}
function applyPreferences(){document.body.classList.toggle("no-motion",state.settings.motion===false)}
function generateBoard(){
  readSettings();if(!state.selectedBanks.length)return toast("Choose at least one content bank.");
  const eligible=state.selectedBanks.filter(b=>b!=="teacher"||getCustom().length);
  if(!eligible.length)return toast("Add a Teacher Pick first.");
  const catCandidates=shuffle(eligible.flatMap(categoriesFor));const chosen=[];for(const c of catCandidates){if(!chosen.some(x=>x.cat===c.cat&&x.bank===c.bank))chosen.push(c);if(chosen.length===6)break}
  while(chosen.length<6){const b=eligible[chosen.length%eligible.length],p=poolForBank(b);chosen.push({bank:b,cat:p[chosen.length%p.length]?.category||"Teacher Picks"})}
  state.board=chosen.flatMap(({bank,cat},col)=>Array.from({length:5},(_,d)=>{
    const candidates=poolForBank(bank).filter(q=>q.category===cat&&q.difficulty===d+1);
    let q=shuffle(candidates)[0]||shuffle(poolForBank(bank).filter(q=>q.difficulty===d+1))[0]||shuffle(poolForBank(bank))[0];
    q=q?{...q,id:q.id+"-"+col+"-"+Math.random().toString(36).slice(2,7)}:makeQuestion("fallback",cat,`evidence|Evaluate the evidence used in this scientific claim.|A strong response considers source, method, data quality, uncertainty and alternatives.`,d+1,col);
    return{...q,col,row:d,value:(d+1)*100,used:false,daily:false}
  }));
  if(state.settings.daily){shuffle(state.board.filter(q=>q.row>0)).slice(0,2).forEach(q=>q.daily=true)}
  state.history=[];state.analytics=[];state.phase="board";applyPreferences();save();showGame()
}
function showGame(){applyPreferences();$("#setupScreen").classList.remove("active");$("#gameScreen").classList.add("active");$("#gameScreen").style.display="block";renderScores();renderBoard();$("#finalBtn").hidden=!state.settings.final}
function renderScores(){$("#scorebar").innerHTML=state.teams.map((t,i)=>`<div class="team-card ${i===state.active?"active":""}"><button data-team="${i}" title="Make active"><strong>${esc(t.name)}</strong><span>${t.score.toLocaleString("en-AU")}</span></button></div>`).join("");$$("[data-team]").forEach(b=>b.onclick=()=>{snapshot("Change active team");state.active=+b.dataset.team;save();renderScores()})}
function renderBoard(){const cats=[...new Map(state.board.map(q=>[q.col,q.category])).values()];$("#board").innerHTML=cats.map(c=>`<div class="category">${esc(c)}</div>`).join("")+Array.from({length:5},(_,row)=>state.board.filter(q=>q.row===row).sort((a,b)=>a.col-b.col).map(q=>`<button class="tile ${q.used?"used":""}" data-id="${q.id}" ${q.used?"disabled":""}>${q.value}</button>`).join("")).join("");$$(".tile:not(.used)").forEach(b=>b.onclick=()=>openClue(b.dataset.id))}
function stimulusHtml(q){if(q.type==="graph")return `<strong>Evidence display</strong><div class="mini-graph" aria-label="Bar graph with increasing values">${[28,43,61,78,72].map((v,i)=>`<i style="height:${v}%" data-v="${[12,19,27,35,32][i]}"></i>`).join("")}</div><small>Values are illustrative. Interpret the pattern before answering.</small>`;if(q.type==="table")return `<table class="data-table"><caption>Investigation results</caption><tr><th>Trial</th><th>Condition A</th><th>Condition B</th></tr>${[[1,12,15],[2,13,18],[3,11,17],[4,12,19]].map(r=>`<tr>${r.map(v=>`<td>${v}</td>`).join("")}</tr>`).join("")}</table>`;if(q.type==="diagram")return `<div class="diagram"><div>Observation</div><b>→ evidence →</b><div>Scientific claim</div></div>`;if(q.type==="image")return `<figure style="margin:0;text-align:center"><img src="../../../chemsims.png" alt="Chemistry course image supplied as a visual stimulus" style="max-height:220px;max-width:100%;border-radius:16px"><figcaption>Visual stimulus: identify what further context or evidence would be needed before drawing a conclusion.</figcaption></figure>`;if(q.type==="scenario")return `<strong>Scenario</strong><p>A research team reports this finding after a small classroom investigation. Consider the design, evidence and limits before responding.</p>`;return""}
function openClue(id){const q=state.board.find(x=>x.id===id);if(!q)return;state.current=id;$("#clueMeta").textContent=`${q.category} • ${q.value}`;$("#question").textContent=q.question;$("#answer").innerHTML=`<strong>Expected answer:</strong> ${esc(q.answer)}`;$("#answer").classList.remove("show");const stim=stimulusHtml(q);$("#stimulus").innerHTML=stim;$("#stimulus").hidden=!stim;$("#clueModal").classList.add("open");if(q.daily)showDailyWager(q);else showQuestionActions();startTimer()}
function showQuestionActions(){$("#clueActions").innerHTML=`<button class="secondary" id="timerBtn">Start / restart timer</button><button class="secondary" id="revealBtn">Reveal answer</button><button class="secondary" id="closeClue">Return to board</button>`;$("#timerBtn").onclick=startTimer;$("#revealBtn").onclick=revealAnswer;$("#closeClue").onclick=()=>closeClue(false)}
function revealAnswer(){stopTimer();$("#answer").classList.add("show");$("#clueActions").innerHTML=`<button class="correct" id="correctBtn">✓ Correct — ${esc(state.teams[state.active].name)}</button><button class="incorrect" id="wrongBtn">✕ Incorrect — ${esc(state.teams[state.active].name)}</button><button class="secondary" id="noAnswerBtn">No answer</button>`;$("#correctBtn").onclick=()=>mark(true);$("#wrongBtn").onclick=()=>mark(false);$("#noAnswerBtn").onclick=()=>mark(false,true)}
function startTimer(){stopTimer();seconds=state.settings.timer;$("#timer").textContent=seconds?seconds+" s":"Unlimited";$("#timer").classList.remove("low");if(!seconds)return;timerId=setInterval(()=>{seconds--;$("#timer").textContent=seconds+" s";if(seconds<=5)$("#timer").classList.add("low");if(seconds<=0){stopTimer();beep(220,.25);if(state.settings.autoReveal)revealAnswer()}},1000)}
function stopTimer(){clearInterval(timerId);timerId=null}
function mark(correct,noAnswer=false){const q=state.board.find(x=>x.id===state.current),team=state.teams[state.active];snapshot(correct?"Correct":"Incorrect");const pts=q.daily?(q.wager||q.value):q.value;team.score+=correct?pts:-pts;team[correct?"correct":"incorrect"]++;state.analytics.push({time:new Date().toISOString(),team:team.name,category:q.category,difficulty:q.difficulty,value:q.value,wager:q.wager||"",result:correct?"Correct":noAnswer?"No answer":"Incorrect",question:q.question});
  q.used=true;
  beep(correct?850:180);
  if(!correct)state.active=(state.active+1)%state.teams.length;
  closeClue(true);
}
function closeClue(saveIt){stopTimer();$("#clueModal").classList.remove("open");$("#stealMsg")?.remove();state.current=null;if(saveIt)save();renderScores();renderBoard();if(state.board.every(q=>q.used)){state.settings.final?openFinal():showResults()}}
function showDailyWager(q){stopTimer();const max=Math.max(500,state.teams[state.active].score);$("#question").innerHTML=`<span style="color:#b07a00">DAILY DOUBLE</span><br>${esc(state.teams[state.active].name)}, enter a wager from 0 to ${max.toLocaleString("en-AU")}.</span>`;$("#stimulus").hidden=true;$("#clueActions").innerHTML=`<input id="wager" type="number" min="0" max="${max}" value="${Math.min(q.value,max)}" style="padding:12px;border:1px solid var(--line);border-radius:10px"><button class="correct" id="lockWager">Lock wager & show clue</button>`;$("#lockWager").onclick=()=>{q.wager=Math.max(0,Math.min(max,+$("#wager").value||0));$("#question").textContent=q.question;const stim=stimulusHtml(q);$("#stimulus").innerHTML=stim;$("#stimulus").hidden=!stim;showQuestionActions();startTimer()}}
function openCustom(){const items=getCustom();$("#genericCard").innerHTML=`<h2>Teacher Picks</h2><p class="muted">Create questions for board generation. They remain saved on this device.</p><div class="setup-grid"><div><div class="field"><label>Category</label><input id="cCat" value="Teacher Picks"></div><div class="field"><label>Question</label><textarea id="cQ" rows="3"></textarea></div><div class="field"><label>Expected answer</label><textarea id="cA" rows="3"></textarea></div><div class="field"><label>Difficulty</label><select id="cD">${[1,2,3,4,5].map(n=>`<option value="${n}">${n} — ${n*100} points</option>`).join("")}</select></div><button class="btn primary" id="addCustom">Save Teacher Pick</button></div><div><strong>Saved questions</strong><div class="custom-list">${items.map((x,i)=>`<div class="custom-item"><span><b>${esc(x.category)}</b> — ${esc(x.question)}</span><button class="secondary" data-del="${i}">Delete</button></div>`).join("")||"<p>No questions saved yet.</p>"}</div></div></div><div class="builder-actions"><button class="btn secondary" id="closeGeneric">Done</button></div>`;$("#genericModal").classList.add("open");$("#addCustom").onclick=()=>{if(!$("#cQ").value.trim()||!$("#cA").value.trim())return toast("Add both a question and answer.");const d=+$("#cD").value;items.push({id:"custom-"+Date.now(),bank:"teacher",category:$("#cCat").value.trim()||"Teacher Picks",topic:$("#cQ").value.trim().slice(0,40),question:$("#cQ").value.trim(),answer:$("#cA").value.trim(),difficulty:d,value:d*100,type:"text",custom:true});setCustom(items);openCustom()};$$("[data-del]").forEach(b=>b.onclick=()=>{items.splice(+b.dataset.del,1);setCustom(items);openCustom()});$("#closeGeneric").onclick=closeGeneric}
function closeGeneric(){$("#genericModal").classList.remove("open")}
function openFinal(){closeClue(false);$("#genericCard").innerHTML=`<h2>Final Jeopardy</h2><p class="muted">Category: <strong>Scientific evidence and society</strong>. Enter each team's secret wager, then reveal the clue.</p><div class="final-wagers">${state.teams.map((t,i)=>`<div class="final-team"><strong>${esc(t.name)}</strong><small> Score: ${t.score}</small><input type="number" min="0" max="${Math.max(0,t.score)}" value="0" data-fw="${i}"></div>`).join("")}</div><div class="builder-actions"><button class="btn primary" id="showFinalQ">Lock wagers & show clue</button><button class="btn secondary" id="cancelFinal">Back to board</button></div>`;$("#genericModal").classList.add("open");$("#showFinalQ").onclick=()=>{$$("[data-fw]").forEach(x=>state.teams[+x.dataset.fw].wager=Math.max(0,Math.min(Math.max(0,state.teams[+x.dataset.fw].score),+x.value||0)));showFinalQuestion()};$("#cancelFinal").onclick=closeGeneric}
function showFinalQuestion(){$("#genericCard").innerHTML=`<h2>Final Jeopardy</h2><div class="question">A scientific claim could lead to a major public policy change. What four features would you examine before deciding how much confidence to place in it?</div><div id="finalAnswer" class="answer"><strong>Expected answer:</strong> Any justified four such as source expertise and conflicts, study design, sample and controls, data quality, uncertainty, replication, converging evidence, limitations and plausible alternatives.</div><div class="builder-actions"><button class="btn secondary" id="finalReveal">Reveal answer</button></div><div id="finalMarks"></div>`;$("#finalReveal").onclick=()=>{$("#finalAnswer").classList.add("show");renderFinalMarks()}}
function renderFinalMarks(){$("#finalMarks").innerHTML=`<h3>Mark each team</h3><div class="final-wagers">${state.teams.map((t,i)=>`<div class="final-team"><strong>${esc(t.name)}</strong><div>Wager: ${t.wager||0}</div><div class="mark-row"><button class="correct" data-fmark="${i}:1">Correct</button><button class="incorrect" data-fmark="${i}:0">Incorrect</button></div></div>`).join("")}</div><div class="builder-actions"><button class="btn primary" id="finishFinal">Score & show results</button></div>`;$$("[data-fmark]").forEach(b=>b.onclick=()=>{const[i,v]=b.dataset.fmark.split(":");state.finalMarks[i]=v==="1";b.parentElement.querySelectorAll("button").forEach(x=>x.style.opacity=x===b?"1":".35")});$("#finishFinal").onclick=()=>{snapshot("Final Jeopardy");state.teams.forEach((t,i)=>{const ok=!!state.finalMarks[i];t.score+=ok?(t.wager||0):-(t.wager||0);state.analytics.push({time:new Date().toISOString(),team:t.name,category:"Final Jeopardy",difficulty:5,value:"",wager:t.wager||0,result:ok?"Correct":"Incorrect",question:"Evaluate a policy-relevant scientific claim."})});save();closeGeneric();showResults()}}
function showResults(){closeGeneric();const sorted=[...state.teams].sort((a,b)=>b.score-a.score),attempts=state.analytics.length,correct=state.analytics.filter(x=>x.result==="Correct").length,unanswered=state.analytics.filter(x=>x.category!=="Final Jeopardy"&&x.result!=="Correct");$("#genericCard").innerHTML=`<h2>Game results</h2><div class="results-grid"><div class="result-card"><small>Winner</small><h3>${esc(sorted[0].name)}</h3><strong>${sorted[0].score.toLocaleString("en-AU")} points</strong></div><div class="result-card"><small>Questions attempted</small><h3>${attempts}</h3></div><div class="result-card"><small>Class accuracy</small><h3>${attempts?Math.round(correct/attempts*100):0}%</h3></div></div><h3 style="margin-top:18px">Team summary</h3><table class="data-table"><tr><th>Team</th><th>Score</th><th>Correct</th><th>Incorrect</th></tr>${sorted.map(t=>`<tr><td>${esc(t.name)}</td><td>${t.score}</td><td>${t.correct}</td><td>${t.incorrect}</td></tr>`).join("")}</table><h3 style="margin-top:18px">Category performance</h3><div class="results-grid">${categoryStats().map(x=>`<div class="result-card"><strong>${esc(x.cat)}</strong><div>${x.correct}/${x.total} correct</div></div>`).join("")||"<p>No clues marked.</p>"}</div><h3 style="margin-top:18px">Difficulty performance</h3><div class="results-grid">${difficultyStats().map(x=>`<div class="result-card"><strong>${x.difficulty*100} points</strong><div>${x.correct}/${x.total} correct</div></div>`).join("")||"<p>No clues marked.</p>"}</div><h3 style="margin-top:18px">Questions nobody answered correctly</h3><div class="results-grid">${unanswered.map(x=>`<div class="result-card"><strong>${esc(x.category)} — ${x.value}</strong><div>${esc(x.question)}</div></div>`).join("")||"<p>Every attempted question was answered correctly.</p>"}</div><div class="builder-actions"><button class="btn primary" id="csvBtn">Export analytics CSV</button><button class="btn secondary" id="newGame">New game</button></div>`;$("#genericModal").classList.add("open");$("#csvBtn").onclick=exportCSV;$("#newGame").onclick=()=>{localStorage.removeItem(KEY);location.reload()}}
function categoryStats(){const m={};state.analytics.forEach(x=>{m[x.category]??={cat:x.category,total:0,correct:0};m[x.category].total++;if(x.result==="Correct")m[x.category].correct++});return Object.values(m)}
function difficultyStats(){const m={};state.analytics.filter(x=>x.category!=="Final Jeopardy").forEach(x=>{m[x.difficulty]??={difficulty:x.difficulty,total:0,correct:0};m[x.difficulty].total++;if(x.result==="Correct")m[x.difficulty].correct++});return Object.values(m).sort((a,b)=>a.difficulty-b.difficulty)}
function exportCSV(){const rows=[["Timestamp","Team","Category","Difficulty","Tile value","Wager","Result","Question"],...state.analytics.map(x=>[x.time,x.team,x.category,x.difficulty,x.value,x.wager,x.result,x.question])];const csv=rows.map(r=>r.map(v=>'"'+String(v??"").replaceAll('"','""')+'"').join(",")).join("\r\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="chemistry-jeopardy-analytics.csv";a.click();URL.revokeObjectURL(a.href)}
function undo(){const h=state.history.pop();if(!h)return toast("Nothing to undo.");state.teams=h.teams;state.active=h.active;state.board=h.board;state.analytics=h.analytics;save();renderScores();renderBoard();toast("Undone: "+h.label)}
function loadGame(){try{Object.assign(state,JSON.parse(localStorage.getItem(KEY)));showGame()}catch{toast("Saved game could not be loaded.")}}
$("#generateBtn").onclick=generateBoard;$("#customBtn").onclick=openCustom;$("#resumeBtn").onclick=loadGame;$("#undoBtn").onclick=undo;$("#changeTeamBtn").onclick=()=>{snapshot("Change active team");state.active=(state.active+1)%state.teams.length;save();renderScores()};$("#builderBtn").onclick=()=>{save();$("#gameScreen").style.display="none";$("#gameScreen").classList.remove("active");$("#setupScreen").classList.add("active");$("#resumeBtn").hidden=false};$("#finalBtn").onclick=openFinal;$("#endBtn").onclick=showResults;$("#fitBtn").onclick=()=>document.body.classList.toggle("fit");$("#fullBtn").onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();init();
</script>
</body>
</html>
