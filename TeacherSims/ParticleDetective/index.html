const KEY='scisims-particle-detective-v1',chapters=['States','Substances','Mixtures','Changes','Reactions','Evidence'],cases=[];
function model(state,molecules,speed=1,volume=1){return {state,molecules,speed,volume}}const many=(s,n)=>Array(n).fill(s);
function add(title,evidence,scenes,answer,wrong,question,whyAnswer,whyWrong,explain){cases.push({title,evidence,scenes,answer,choices:[answer,...wrong],question,whyAnswer,whyChoices:[whyAnswer,...whyWrong],explain})}
const solid=model('solid',many('A',8)),liquid=model('liquid',many('A',8)),gas=model('gas',many('A',8));
add('A fixed arrangement','Particles remain close in regular positions and vibrate around those positions.',[['Sample',solid]],'Solid',['Liquid','Gas'],'Why can the sample keep its own shape?','Particles remain around fixed relative positions.',['Particles never move at all.','There are no forces between its particles.'],'Solid particles still move; vibration is consistent with a solid.');
add('Close, but able to flow','Particles remain close together but can change neighbours.',[['Sample',liquid]],'Liquid',['Solid','Gas'],'Which description fits a liquid?','It can flow while maintaining an approximately fixed volume.',['It must fill every available space.','Its particles have fixed positions.'],'Liquids have close particles without a permanent lattice.');
add('Spread through the chamber','Particles are widely spaced and move throughout the container.',[['Sample',gas]],'Gas',['Liquid','Solid'],'Why can a gas be compressed substantially?','There is considerable space between its particles.',['Each atom is mostly squashed to a smaller size.','Gas particles have no mass.'],'Compression mainly reduces particle spacing, not atomic size.');
add('Compare the same gas','The particles have equal mass. The right sample has a greater average particle speed. The motion is illustrative, not a calibrated thermometer.',[['Left',model('gas',many('A',6),1)],['Right',model('gas',many('A',6),2)]],'Right sample has higher average kinetic energy.',['Left sample has higher average kinetic energy.','Both must have the same average kinetic energy.'],'For the same kind of gas, higher average kinetic energy indicates…','Higher temperature.',['A different element must have formed.','The particles have lost all mass.'],'For a given species, greater average translational kinetic energy corresponds to higher temperature.');
add('One atom type','A and B identify different elements. One letter on a particle indicates one atom.',[['Sample',model('gas',many('A',6))]],'Pure element',['Pure compound','Mixture'],'What makes it an element in this model?','All atoms are of one element.',['Every element must be a single unbonded atom.','The particles are far apart.'],'An element contains only one type of atom. State does not determine whether it is an element.');
add('Identical bonded pairs','Every particle is a bonded A–A pair. A bond is shown by a line.',[['Sample',model('gas',many('AA',6))]],'Pure element',['Pure compound','Mixture of elements'],'Why is A₂ not a compound?','Its bonded atoms are of the same element.',['Molecules cannot be elements.','Two atoms always make a compound.'],'An elemental substance can be molecular. A compound needs more than one element chemically combined.');
add('Unlike atoms bonded','Every particle contains one A atom bonded to one B atom.',[['Sample',model('gas',many('AB',6))]],'Pure compound',['Pure element','Mixture'],'What is the atom ratio in each particle?','A:B = 1:1',['A:B = 2:1','A:B = 1:2'],'All particles are the same compound, with a fixed atom ratio.');
add('Two elemental molecules','The sample has A–A molecules and B–B molecules, with no A–B bonds.',[['Sample',model('gas',['AA','BB','AA','BB','AA','BB'])]],'Mixture of two elements',['Pure compound','Pure element'],'Does merely sharing a container make a compound?','No; the unlike atoms must be chemically combined.',['Yes; any two colours form a compound.','Yes; all gases are compounds.'],'Both elements remain as their own particles in this mixture.');
add('Three atoms per molecule','All particles have one A atom and two B atoms bonded together.',[['Sample',model('gas',many('ABB',5))]],'Pure compound',['Mixture of elements','Pure element'],'What formula matches each particle?','AB₂',['A₂B','A₂B₂'],'A single compound may contain several atoms in each molecule. Count atom types, not colours alone.');
add('Element plus compound','Some particles are A atoms. Others are bonded A–B molecules.',[['Sample',model('gas',['A','AB','A','AB','A','AB'])]],'Mixture of an element and a compound',['Pure compound','Two pure elements in separate containers'],'Why is the whole sample not pure?','There is more than one kind of substance present.',['Every particle has a different temperature.','A mixture must contain a solid.'],'The unbonded A substance and AB compound coexist without all particles becoming identical.');
add('Unbonded unlike atoms','Both A and B atoms are present. There are no bonds between them.',[['Sample',model('gas',['A','B','A','B','A','B','A','B'])]],'Mixture of two elements',['Pure AB compound','Pure element'],'What observation would distinguish an AB compound here?','A and B atoms consistently bonded into AB particles.',['A and B drawn next to the same wall.','The chamber becoming larger.'],'Proximity in a picture does not itself represent a chemical bond.');
add('Same volume, different amount','Both chambers have equal volume and contain identical A atoms at the same temperature. Left has eight particles; right has four.',[['Left',model('gas',many('A',8))],['Right',model('gas',many('A',4))]],'Left has twice the mass density.',['Right has twice the mass density.','Their mass densities must be equal.'],'Why compare equal volumes?','Density is mass divided by volume.',['Density is particle colour divided by speed.','Density never depends on the amount of matter.'],'With identical atoms, particle count is proportional to mass. At fixed volume, twice the count means twice the mass density.');
add('The lattice breaks up','The same eight A atoms are shown before and after warming.',[['Before',solid],['After',liquid]],'Physical change: melting',['Chemical reaction','Physical change: condensation'],'What stays unchanged?','The identity and number of atoms.',['The relative positions remain fixed.','No energy can be transferred.'],'Melting changes arrangement and movement, not the elemental identity of the atoms.');
add('Molecules leave a liquid','All particles are AB molecules. The same six molecules are shown in each panel.',[['Before',model('liquid',many('AB',6))],['After',model('gas',many('AB',6))]],'Physical change: vaporisation',['Chemical decomposition','Physical change: freezing'],'What happens to the AB bonds in this model?','They remain within each molecule.',['Every AB molecule splits into separate atoms.','The B atoms disappear.'],'A change from liquid to gas separates molecules; it does not necessarily break their internal chemical bonds.');
add('Squeeze a gas','The same six A atoms are confined to half the original volume, without a chemical reaction.',[['Before',model('gas',many('A',6),1,1)],['After',model('gas',many('A',6),1,.5)]],'Physical change: compression',['Chemical reaction','New element formation'],'What mainly decreases?','The average space between particles.',['The number of protons in every atom.','The mass of each atom.'],'The container is smaller; the particles themselves are not shown turning into smaller atoms.');
add('Bonds have changed','Compare two A₂ and two B₂ molecules with four AB molecules. This is a closed-system model.',[['Before',model('gas',['AA','AA','BB','BB'])],['After',model('gas',many('AB',4))]],'Chemical change',['Only a change of state','Atoms created from nothing'],'What is conserved?','Four A atoms and four B atoms.',['The number of molecules must remain unchanged.','Every original bond must remain intact.'],'Atoms are rearranged into new bonded particles. Molecule count and bond pattern can change while atom counts are conserved.');
add('Audit a balanced reaction','A closed system contains two A₂ and two B₂ molecules before reaction, and four AB molecules after.',[['Before',model('gas',['AA','AA','BB','BB'])],['After',model('gas',many('AB',4))]],'Balanced: each element is conserved',['Unbalanced: A atoms disappear','Unbalanced: B atoms appear'],'Why may molecule count differ?','Molecules can be broken up and recombined.',['Atoms are destroyed to make fewer molecules.','A bond has the same meaning as an atom.'],'Count atoms of each element on both sides, rather than requiring the same number of molecules.');
add('Spot the missing matter','The report claims a complete closed-system change. No particles are omitted from either panel.',[['Before',model('gas',['AA','AA','BB','BB'])],['Reported after',model('gas',many('AB',3))]],'Invalid report: one A and one B atom are missing',['Balanced report','Valid because all particles move faster'],'Can ordinary chemical reactions simply remove those atoms?','No; the closed-system atom account must balance.',['Yes; a chemical bond destroys atoms.','Yes; gases have no atoms.'],'Before has four A and four B atoms. The reported after-panel has only three of each.');
add('A decomposition audit','Compare the complete before and after diagrams for a closed system.',[['Before',model('gas',['ABB','ABB'])],['After',model('gas',['AB','AB','BB'])]],'Balanced: 2 A atoms and 4 B atoms on each side',['Unbalanced: two B atoms are missing','No chemical change occurred'],'Which bond pattern shows a new substance?','B₂ molecules appear among the products.',['A atoms become C atoms.','Every product is still AB₂.'],'A rearrangement can conserve atoms while changing which molecules are present.');
add('Deduce the product formula','Four A₂ and two B₂ molecules react completely to make four identical product molecules. Inspect one product to identify its formula.',[['Reactants',model('gas',['AA','AA','AA','AA','BB','BB'])],['Products',model('gas',many('AAB',4))]],'A₂B',['AB₂','AB'],'How many A atoms are accounted for?','Eight',['Four','Two'],'Four A₂ molecules contain eight A atoms; four A₂B products also contain eight A atoms.');
add('What can the colours tell you?','The colour key identifies A and B as different elements. It provides no calibration relating colour or brightness to temperature.',[['Sample',model('gas',['A','B','A','B','A','B'])]],'Temperature cannot be read from colour alone',['A is hotter because it is blue','B is hotter because it is gold'],'What is the colour key for?','Identifying atom types in this model.',['Measuring atom temperature directly.','Showing actual atoms as visible coloured balls.'],'Model colours are labels. They are not a temperature scale unless a scale is explicitly supplied.');
add('Speed and kinetic energy','Identical A atoms have speed v on the left and 2v on the right. Use kinetic energy = ½mv²; mass is unchanged.',[['Speed v',model('gas',many('A',6),1)],['Speed 2v',model('gas',many('A',6),2)]],'Right particles have 4 times the kinetic energy',['Right particles have 2 times the kinetic energy','Both have equal kinetic energy'],'Which part of the equation explains the factor?','Speed is squared.',['Mass is squared.','Kinetic energy is independent of speed.'],'For the specified individual speeds and equal masses, (2v)² = 4v².');
add('Predict a pressure change','Compare an ideal-gas model at equal temperature and equal container volume. All particles are identical A atoms.',[['Before',model('gas',many('A',4))],['After adding gas',model('gas',many('A',8))]],'Pressure increases',['Pressure must fall to zero','The gas must turn into a solid'],'Why does pressure increase in this model?','More particles produce more wall collisions per unit time.',['Each atom has become a new element.','The container must have expanded.'],'At fixed volume and temperature, adding ideal-gas particles increases pressure. The animation is illustrative, not a collision simulation.');
add('The model’s limits','These circles and bond lines are a classroom representation. Positions, motion paths, sizes and colours are simplified.',[['A model compound',model('gas',many('ABB',5))]],'Atom ratio can be read; actual atomic size cannot',['Every drawn gap gives an exact real-world distance','The model proves atoms are coloured hard balls'],'Which claim is supported by the drawing?','Each molecule contains one A and two B atoms.',['The real atoms are exactly 16 pixels wide.','Every real molecule follows a repeating animation path.'],'Use a model for the information its key supports. Do not treat illustrative size, colour or motion as a direct measurement.');
Object.assign(cases[20],{title:'Investigate gas compression',evidence:'Record a baseline at volume 4 and a trial at volume 2. Keep particle count and temperature fixed. Use the readings to compare pressure.',answer:'Halving volume doubles the relative pressure.',choices:['Halving volume doubles the relative pressure.','Halving volume halves the relative pressure.','Volume has no effect on pressure.'],question:'What makes this comparison a controlled test?',whyAnswer:'Particle count and temperature stay the same.',whyChoices:['Particle count and temperature stay the same.','Every input changes at once.','Atom colour supplies an exact pressure reading.'],explain:'For this ideal-gas model at fixed particle count and temperature, pressure is inversely proportional to volume. Compare the recorded readings, not the illustrative spacing alone.'});
Object.assign(cases[21],{title:'Measure the effect of speed',answer:'At 2v, kinetic energy is four times the reading at v.',choices:['At 2v, kinetic energy is four times the reading at v.','At 2v, kinetic energy is twice the reading at v.','Speed has no effect on kinetic energy.'],evidence:'Record the meter at speed v, then at speed 2v. Compare those two recorded readings; all particles have equal mass.'});
Object.assign(cases[22],{title:'Design a fair pressure test',evidence:'Record trials with 4 and 8 particles while keeping BOTH volume and temperature unchanged. Trials where other variables change do not isolate the effect of particle number.',answer:'Doubling particle number doubles the relative pressure.',choices:['Doubling particle number doubles the relative pressure.','Doubling particle number halves the relative pressure.','Particle number has no effect on pressure.']});

try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Number.isInteger(s.level)&&s.level>=0&&s.level<24&&s.rounds&&s.records){S=s;S.paused=!!s.paused;for(const [k,v] of Object.entries(S.records))if(!/^\d+$/.test(k)||Number(k)>23||!v||!Number.isInteger(v.stars)||v.stars<1||v.stars>3)delete S.records[k]}}catch(e){}
function unlocked(i){return i%4===0||!!S.records[i-1]}if(!unlocked(S.level))S.level=Math.floor(S.level/4)*4;
function draft(){let d=S.rounds[S.level];if(!d||typeof d.solved!=='boolean'||typeof d.quiz!=='boolean'||!Number.isSafeInteger(d.hints)||d.hints<0||!Array.isArray(d.wrong)||!Array.isArray(d.quizWrong)||[...d.wrong,...d.quizWrong].some(j=>!Number.isInteger(j)||j<0||j>2))d=S.rounds[S.level]={solved:false,quiz:false,hints:0,wrong:[],quizWrong:[]};if(!d.lab||!d.lab.values||!Array.isArray(d.lab.log))d.lab={values:{volume:4,number:4,temperature:300,speed:1},log:[],composition:false,scale:false};for(const [key,allowed] of Object.entries({volume:[1,2,4],number:[4,8,12],temperature:[200,300,600],speed:[1,2,3]}))if(!allowed.includes(d.lab.values[key]))d.lab.values[key]=allowed[0];if(S.level>=20&&d.lab.version!==2){d.solved=false;d.quiz=false;d.lab.version=2}d.lab.log=d.lab.log.filter(row=>row&&[1,2,4].includes(row.volume)&&[4,8,12].includes(row.number)&&[200,300,600].includes(row.temperature)&&[1,2,3].includes(row.speed)).slice(-20);return d}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}function atoms(molecules){return molecules.join('').split('').reduce((sum,key)=>(sum[key]=(sum[key]||0)+1,sum),{})}function formula(s){return [...new Set(s)].map(k=>k+(s.split(k).length-1>1?(s.split(k).length-1):'')).join('')}
function optionOrder(){const a=[0,1,2],shift=S.level%3;return a.slice(shift).concat(a.slice(0,shift))}
function experimentReady(){if(S.level<20)return true;const lab=draft().lab,log=lab.log;if(S.level===20)return log.some(r=>r.volume===4)&&log.some(r=>r.volume===2);if(S.level===21)return log.some(r=>r.speed===1)&&log.some(r=>r.speed===2);if(S.level===22)return log.some(a=>a.number===4&&log.some(b=>b.number===8&&b.volume===a.volume&&b.temperature===a.temperature));return lab.composition&&lab.scale}
function pressure(v){return (v.number/4)*(v.temperature/300)*(1/v.volume)}
function displayScenes(){const p=cases[S.level],v=draft().lab.values;if(S.level===20)return [['Baseline volume 4',model('gas',many('A',6),1,1)],['Current volume '+v.volume,model('gas',many('A',6),1,v.volume/4)]];if(S.level===21)return [['Reference speed v',model('gas',many('A',6),1)],['Current speed '+v.speed+'v',model('gas',many('A',6),v.speed)]];if(S.level===22)return [['Current controlled trial',model('gas',many('A',v.number),Math.sqrt(v.temperature/300),v.volume/4)]];return p.scenes}
function bench(){if(S.level<20)return '';const lab=draft().lab,v=lab.values,select=(key,label,values)=>'<label>'+label+'<select data-lab="'+key+'">'+values.map(n=>'<option value="'+n+'" '+(v[key]===n?'selected':'')+'>'+n+'</option>').join('')+'</select></label>';let html='<div class="well lab"><h3>Evidence bench</h3><p>Use the controls, record observations, then make your claim. These readings are calculated by the stated teaching model.</p>';
if(S.level===23)return html+'<div class="tools"><button id="composition">Run composition scan</button><button id="scale">Check length calibration</button></div><div class="lab-log">'+(lab.composition?'<p><b>Composition report:</b> all five particles have one A and two B atoms bonded together. Total: 5 A and 10 B atoms.</p>':'')+(lab.scale?'<p><b>Calibration report:</b> no physical length scale was supplied. Pixels cannot be converted to real atomic dimensions.</p>':'')+'</div><p class="success">'+(experimentReady()?'Both reports collected.':'Collect both reports to unlock your claim.')+'</p></div>';
html+='<div class="lab-controls">';if(S.level===20)html+=select('volume','Volume (relative units)',[1,2,4])+'<p>Particle number: fixed 6<br>Temperature: fixed 300 K</p>';if(S.level===21)html+=select('speed','Speed multiplier',[1,2,3])+'<p>Particle mass: held constant<br>Compare the recorded v and 2v trials.</p>';if(S.level===22)html+=select('number','Particle number',[4,8,12])+select('volume','Volume (relative units)',[1,2,4])+select('temperature','Temperature (K)',[200,300,600]);html+='</div><div class="instrument"><span>'+(S.level===21?'Relative kinetic energy':'Relative pressure')+'</span><b>'+ (S.level===21?v.speed*v.speed:S.level===20?4/v.volume:pressure(v)).toFixed(2)+'</b></div><button id="record" class="primary">Record trial</button><div class="lab-log">'+(lab.log.length?'<table><thead><tr><th>Trial</th><th>Settings</th><th>Reading</th></tr></thead><tbody>'+lab.log.map((r,j)=>'<tr><td>'+(j+1)+'</td><td>'+(S.level===21?'Speed '+r.speed+'v':S.level===20?'V '+r.volume:'N '+r.number+', V '+r.volume+', T '+r.temperature+' K')+'</td><td>'+(S.level===21?r.speed*r.speed:S.level===20?4/r.volume:pressure(r)).toFixed(2)+'</td></tr>').join('')+'</tbody></table>':'<p>No observations recorded yet.</p>')+'</div><p class="success">'+(experimentReady()?'A suitable comparison is recorded. Your claim is unlocked.':'Record the required comparison. Match the controlled variables.')+'</p></div>';return html}
function drawing(scene,index){const n=scene.molecules.length,width=420*scene.volume,cols=Math.min(4,n),rows=Math.ceil(n/cols);let html='<svg viewBox="0 0 420 250" role="group" aria-label="Particle model: '+(scene.state==='solid'?'close regular arrangement':scene.state==='liquid'?'close irregular arrangement':'widely spaced particles')+'"><rect x="12" y="12" width="'+(width-24)+'" height="226" rx="8" fill="none" stroke="var(--edge)" stroke-width="2"/>';
scene.molecules.forEach((mol,j)=>{const col=j%cols,row=Math.floor(j/cols),packing=Math.max(...scene.molecules.map(m=>m.length))*26,x=scene.state==='gas'?28+(width-56)*(col+.5)/cols:width/2+(col-(cols-1)/2)*packing+(scene.state==='liquid'?(row%2?5:-3):0),y=scene.state==='gas'?45+145*(row+.5)/rows:scene.state==='solid'?167+row*26:161+row*27+(col%2)*7,spacing=26,start=x-(mol.length-1)*spacing/2;html+='<g transform="translate(0 0)"><g class="molecule '+scene.state+' '+(inspected?.scene===index&&inspected?.id===j?'selected':'')+'" data-particle="'+j+'" data-scene="'+index+'" tabindex="0" role="button" aria-label="Inspect particle '+(j+1)+' in '+(index===0?'first':'second')+' panel" style="--speed:'+(4/scene.speed+(j%3)*.15)+'s">';html+='<rect x="'+(x-Math.max(22,(mol.length-1)*13+13))+'" y="'+(y-22)+'" width="'+Math.max(44,(mol.length-1)*26+26)+'" height="44" fill="transparent"/>';for(let a=1;a<mol.length;a++)html+='<line class="bond" x1="'+(start+(a-1)*spacing)+'" x2="'+(start+a*spacing)+'" y1="'+y+'" y2="'+y+'"/>';for(let a=0;a<mol.length;a++)html+='<circle class="atom" cx="'+(start+a*spacing)+'" cy="'+y+'" r="9" fill="'+(mol[a]==='A'?'#75bdf3':'#f4cf79')+'"/><text class="atom-label" x="'+(start+a*spacing)+'" y="'+(y+4)+'" text-anchor="middle">'+mol[a]+'</text>';html+='</g></g>'});return html+'</svg>'}
function award(){const d=draft();if(!d.solved)return;const stars=d.hints>=2?1:d.hints===1||d.wrong.length>0?2:d.quiz&&!d.quizWrong.length?3:2;S.records[S.level]={stars:Math.max(stars,S.records[S.level]?.stars||0)};persist()}
function render(){const p=cases[S.level],d=draft(),views=displayScenes(),base=Math.floor(S.level/4)*4,rec=S.records[S.level];$('progress').innerHTML='<strong>'+Object.keys(S.records).length+' / 24 cases</strong><span>'+Object.values(S.records).reduce((s,r)=>s+r.stars,0)+' / 72 stars</span>';let html='<nav class="tabs" aria-label="Case chapters">'+chapters.map((name,i)=>'<button data-chapter="'+i+'" aria-pressed="'+(Math.floor(S.level/4)===i)+'">'+name+'</button>').join('')+'</nav><div class="workspace"><section class="panel"><nav class="rounds" aria-label="Cases in chapter">'+[0,1,2,3].map(j=>'<button data-level="'+(base+j)+'" class="'+(S.level===base+j?'current':'')+'" '+(!unlocked(base+j)?'disabled':'')+'>Case '+(j+1)+'<small>'+(S.records[base+j]?'★'.repeat(S.records[base+j].stars):unlocked(base+j)?'Ready':'Locked')+'</small></button>').join('')+'</nav><div class="eyebrow">'+chapters[Math.floor(S.level/4)]+' · Evidence file '+String(S.level+1).padStart(2,'0')+'</div><h2>'+p.title+'</h2><p class="brief">Inspect the particles, make a claim, then explain your reasoning.</p><div class="case-evidence">'+p.evidence+'</div><div class="legend"><span><i class="swatch" style="background:#75bdf3"></i>A atom</span><span><i class="swatch" style="background:#f4cf79"></i>B atom</span><span>Line = bond · Not to scale</span></div><div class="diagram '+(views.length>1?'pair ':'')+(S.paused?'paused':'')+'">'+views.map(([label,scene],i)=>'<div class="chamber"><h3>'+label+'</h3>'+drawing(scene,i)+'</div>').join('')+'</div><div class="tools"><button id="pause">'+(S.paused?'Play motion':'Pause motion')+'</button><button id="count" '+(d.solved||d.hints>=2?'disabled':'')+'>Atom-count hint</button></div><div class="inspected" id="inspected" role="status" aria-live="polite">'+(inspected?'Selected particle: '+formula(views[inspected.scene][1].molecules[inspected.id])+'. '+(views[inspected.scene][1].molecules[inspected.id].length>1?'Atoms linked by bonds.':'One unbonded atom.'):'Tap a particle, or focus it and press Enter, to inspect its atom composition.')+'</div>'+bench()+'<h3 style="margin-top:16px">What does the evidence support?</h3><div class="choices">'+optionOrder().map(j=>'<button data-answer="'+j+'" '+(d.solved||d.wrong.includes(j)||!experimentReady()?'disabled':'')+' class="'+(d.solved&&j===0?'correct':'')+'">'+p.choices[j]+(d.solved&&j===0?' ✓':'')+'</button>').join('')+'</div><div id="feedback" class="feedback" role="status" aria-live="polite"></div>';
if(d.solved)html+='<div class="well"><h3>Evidence explained</h3><p>'+p.explain+'</p></div><div class="question"><h3>'+p.question+'</h3><div class="choices">'+optionOrder().slice().reverse().map(j=>'<button data-why="'+j+'" '+(d.quiz||d.quizWrong.includes(j)?'disabled':'')+' class="'+(d.quiz&&j===0?'correct':'')+'">'+p.whyChoices[j]+(d.quiz&&j===0?' ✓':'')+'</button>').join('')+'</div></div>';html+='<div class="actions"><button id="replay">Replay case</button><button id="next" class="primary" '+(!rec?'disabled':'')+'>'+ (S.level===23?'Return to first chapter':'Next case')+'</button></div></section><aside class="sidebar"><section class="panel"><h3>Your best</h3><div class="badge">'+(rec?'★'.repeat(rec.stars)+'☆'.repeat(3-rec.stars):'☆☆☆')+'</div><p>Classify the evidence to restore the case. For three stars, make both claims correctly on your first try, with no atom-count hints.</p><p>One hint caps the case at two stars; two cap it at one. Replays can improve your best.</p></section><section class="panel"><h3>Detective’s toolkit</h3><p><b>Look for particle types.</b> A pure substance has one kind of substance; a mixture contains more than one.</p><p><b>Read bonds.</b> An element has one atom type. A compound has unlike atom types chemically combined in a fixed ratio.</p><p><b>Compare states.</b> Arrangement, spacing and movement matter. The letter and colour key identifies the elements, not their temperature.</p><p><b>Conserve atoms.</b> Ordinary chemical reactions rearrange atoms; the count of each element balances in a closed system.</p></section><section class="panel"><h3>About the model</h3><p class="note">Colours, sizes, paths and bonds are illustrative. This animation is not a quantitative molecular-dynamics simulation. The panels show the complete model sample unless the evidence says otherwise.</p><p>Bond lines join atoms within a particle. Random closeness alone does not mean that atoms are bonded.</p></section></aside></div>';$('game').innerHTML=html;renderNotice();persist()}
function choose(i){if(i<0||i>=24||!unlocked(i))return;S.level=i;notice=null;inspected=null;render()}
function inspect(scene,id){if(!displayScenes()[scene]?.[1].molecules[id])return;inspected={scene,id};render();$('game').querySelector('[data-scene="'+scene+'"][data-particle="'+id+'"]')?.focus({preventScroll:true})}
$('game').onclick=e=>{const particle=e.target.closest('[data-particle]');if(particle){inspect(Number(particle.dataset.scene),Number(particle.dataset.particle));return}const b=e.target.closest('button');if(!b||b.disabled)return;const d=draft(),p=cases[S.level];if(b.dataset.chapter!==undefined)choose(Number(b.dataset.chapter)*4);else if(b.dataset.level!==undefined)choose(Number(b.dataset.level));else if(b.id==='next')choose((S.level+1)%24);else if(b.id==='pause'){S.paused=!S.paused;render()}else if(b.id==='replay'){S.rounds[S.level]={solved:false,quiz:false,hints:0,wrong:[],quizWrong:[]};notice=null;inspected=null;render()}else if(b.id==='record'){d.lab.log.push({...d.lab.values});d.lab.log=d.lab.log.slice(-20);notice=null;render()}else if(b.id==='composition'){d.lab.composition=true;render()}else if(b.id==='scale'){d.lab.scale=true;render()}else if(b.id==='count'&&!d.solved&&d.hints<2){d.hints++;const text=displayScenes().map(([label,scene])=>{const counts=atoms(scene.molecules);return label+': '+Object.entries(counts).map(([k,v])=>v+' '+k+' atom'+(v===1?'':'s')).join(', ')+'.'}).join(' ');message('Atom-count hint',text);render()}else if(b.dataset.answer!==undefined){const j=Number(b.dataset.answer);if(d.solved||!experimentReady())return;if(j===0){d.solved=true;message('Claim supported',p.explain,'good');award()}else{if(!d.wrong.includes(j))d.wrong.push(j);message('That claim does not fit all the evidence','Read the atom key, bond lines, and the conditions stated above the panels.','bad')}render()}else if(b.dataset.why!==undefined){const j=Number(b.dataset.why);if(!d.solved||d.quiz)return;if(j===0){d.quiz=true;message('Reasoning confirmed',p.explain,'good');award()}else{if(!d.quizWrong.includes(j))d.quizWrong.push(j);message('Recheck the explanation','Your first claim is saved. Use the model to justify it.','bad')}render()}};$('game').onkeydown=e=>{const p=e.target.closest('[data-particle]');if(p&&['Enter',' '].includes(e.key)){e.preventDefault();inspect(Number(p.dataset.scene),Number(p.dataset.particle))}};render();

$('game').addEventListener('change',e=>{const key=e.target.dataset.lab;if(!key)return;const value=Number(e.target.value),allowed={volume:[1,2,4],number:[4,8,12],temperature:[200,300,600],speed:[1,2,3]};if(!allowed[key]?.includes(value))return;draft().lab.values[key]=value;inspected=null;notice=null;render();$('game').querySelector('[data-lab="'+key+'"]')?.focus({preventScroll:true})});
</script></body></html>
