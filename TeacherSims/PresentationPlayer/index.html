<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SciSims Presentation Player</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#193147;background:#e9f0f5}*{box-sizing:border-box}body{margin:0}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 18px;background:#123550;color:#fff}header h1{font-size:19px;margin:0 18px 0 0}
button,input{font:inherit}button{cursor:pointer;border:1px solid #a9c3d3;border-radius:9px;background:#fff;color:#173650;padding:9px 13px}
button:hover,button:focus-visible{outline:2px solid #1c879f;outline-offset:1px}
header button{background:#daf5fa}input{min-width:200px;flex:1;border:1px solid #a7bac6;border-radius:9px;padding:9px}
main{padding:6px;max-width:1800px;margin:auto;display:flex;flex-direction:column;gap:5px}
.viewer{background:#fff;border:1px solid #c4d6de;border-radius:12px;overflow:hidden;position:relative}
iframe{display:block;width:100%;aspect-ratio:16/9;border:0;background:#f4f8fa}
.notice{padding:8px 12px;color:#375166;background:#edf7fa;font-size:13px}.notice a{color:#075d87}
.tools{margin:0;background:#fff;border:1px solid #c4d6de;border-radius:9px;padding:2px 5px;position:relative;width:100%}.tools h2{display:none}
main.pos-bottom .viewer{order:0}main.pos-bottom .tools{order:1}main.pos-top .viewer{order:1}main.pos-top .tools{order:0}
main.pos-left,main.pos-right{display:grid;grid-template-columns:minmax(58px,72px) minmax(0,1fr);align-items:stretch}
main.pos-right{grid-template-columns:minmax(0,1fr) minmax(58px,72px)}
main.pos-left .tools{grid-column:1;grid-row:1}main.pos-left .viewer{grid-column:2;grid-row:1}
main.pos-right .tools{grid-column:2;grid-row:1}main.pos-right .viewer{grid-column:1;grid-row:1}
main.pos-left .tools,main.pos-right .tools{padding:6px 2px}
main.pos-left .icons,main.pos-right .icons{grid-template-columns:1fr;gap:2px}
main.pos-left .norm,main.pos-right .norm{min-height:23px}
main.pos-left .symbol,main.pos-right .symbol{width:21px;height:21px;font-size:12px}
main.pos-left iframe,main.pos-right iframe{height:min(84vh,calc(100vw * .56));aspect-ratio:auto}
main.pos-left .controls,main.pos-right .controls{display:none}
main.pos-left .pinned,main.pos-right .pinned{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:99;width:min(520px,92vw)}
@media(max-width:800px){main.pos-left,main.pos-right{grid-template-columns:54px minmax(0,1fr)}main.pos-right{grid-template-columns:minmax(0,1fr) 54px}}

.tools h2{font-size:15px;margin:0 0 9px}.icons{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:2px}
.norm{position:relative;display:flex;align-items:center;justify-content:center;min-height:24px;border-radius:5px;border:1px solid transparent;background:transparent;touch-action:manipulation}
.norm:nth-child(3n){background:#fff1d1}.norm:nth-child(5n){background:#fff1d1}.norm:hover,.norm.active,.norm:focus-visible{border-color:#007e96}
.symbol{display:grid;place-items:center;width:21px;height:21px;border-radius:50%;font-size:12px;font-weight:900;background:#d2e9fc;color:#103e82}
.norm:nth-child(3n) .symbol,.norm:nth-child(5n) .symbol{background:#ffe9b8;color:#8b5505}
.tooltip{position:absolute;z-index:9;bottom:calc(100% + 9px);left:50%;transform:translateX(-50%);width:min(310px,82vw);pointer-events:none;text-align:left;background:#123550;color:#fff;border-radius:10px;padding:12px;box-shadow:0 6px 22px #0003;display:none;font-size:14px;line-height:1.45}
.tooltip strong{display:block;font-size:16px;margin-bottom:4px}.norm:hover .tooltip,.norm:focus-visible .tooltip{display:block}
.pinned{padding:10px 14px;border-radius:9px;margin:10px 0 0;background:#e5f6fa;border-left:4px solid #0089a0;display:none}.pinned.visible{display:block}
.controls{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;align-items:center;font-size:12px}.controls button,.controls select{padding:3px 7px;font-size:12px;border:1px solid #c6d5df;border-radius:5px;background:#f8fbff}.controls small{color:#456}
#fs:fullscreen{background:#111}#fs:fullscreen iframe{height:calc(100vh - 170px);aspect-ratio:auto}#fs:fullscreen .notice{display:none}
@media(max-width:600px){header{padding:10px}header h1{width:100%}.icons{grid-template-columns:repeat(4,1fr)}.norm{min-height:28px}.tooltip{display:none!important}}

/* Original coloured icon strip, sourced from the LHS slide artwork. */
.norm .symbol{font-size:0!important;border-radius:0!important;background-image:url("https://lh7-rt.googleusercontent.com/slidesz/AGV_vUfg948tBIpdtF3WqT6cVg-RPjfNBIAHtYZvBb7925fixmnkRFl_7GurMaopgQlqS7Nw7aiM1aXyTndB-NEwdBXL-ZSVn53YQX0QkHbdWECXmvuIikMC1asgRgEOuKLsj3UlRRDjkEqfrvrgXvYRhL7etGLmZnkarQzN83j_oY72_lZt=s2048?key=38LLicphZWo0815xZ6s1nQ")!important;background-repeat:no-repeat!important;background-size:800% 100%!important;background-color:transparent!important}
.norm:nth-child(1) .symbol{background-position:0% 50%!important}
.norm:nth-child(2) .symbol{background-position:14.2857% 50%!important}
.norm:nth-child(3) .symbol{background-position:28.5714% 50%!important}
.norm:nth-child(4) .symbol{background-position:42.8571% 50%!important}
.norm:nth-child(5) .symbol{background-position:57.1429% 50%!important}
.norm:nth-child(6) .symbol{background-position:71.4286% 50%!important}
.norm:nth-child(7) .symbol{background-position:85.7143% 50%!important}
.norm:nth-child(8) .symbol{background-position:100% 50%!important}
.norm:nth-child(3n),.norm:nth-child(5n){background:transparent}

/* Compact engagement dock */
.tools{padding:1px 5px!important;border-radius:6px!important;min-height:34px}
.icons{gap:1px!important}
.norm,.norm:nth-child(3n),.norm:nth-child(5n){min-height:31px!important;height:31px!important;border:0!important;background:transparent!important;padding:1px!important;border-radius:50%!important}
.norm:hover,.norm:focus-visible,.norm.active{outline:1.5px solid #1887a1!important;outline-offset:-1px}
.norm .symbol,.norm:nth-child(3n) .symbol,.norm:nth-child(5n) .symbol{width:29px!important;height:29px!important;min-width:29px!important;min-height:29px!important;border-radius:50%!important;overflow:hidden!important;background-color:transparent!important;background-size:800% 300%!important;background-position-y:50%!important}
main.pos-left,main.pos-right{grid-template-columns:40px minmax(0,1fr)!important}
main.pos-right{grid-template-columns:minmax(0,1fr) 40px!important}
main.pos-left .tools,main.pos-right .tools{padding:3px 1px!important}
main.pos-left .norm,main.pos-right .norm{min-height:33px!important;height:33px!important}
main.pos-left .symbol,main.pos-right .symbol{width:29px!important;height:29px!important}
.tools .controls{display:none!important}
.pinned{display:none!important}
.pinned.visible{display:block!important;position:fixed!important;bottom:52px!important;right:18px!important;left:auto!important;transform:none!important;z-index:999!important;width:min(380px,calc(100vw - 35px))!important;margin:0!important;padding:12px 35px 12px 14px!important;box-shadow:0 6px 24px #0004!important;background:white!important;color:#173550!important;border:1px solid #9dc6d5!important;border-left:4px solid #138a9f!important}
.pinned .close-panel{position:absolute;top:5px;right:7px;background:none;border:0;font-size:20px;padding:2px 6px;line-height:1.1}
header button,header select{font-size:12px;padding:6px 9px}
@media(max-width:600px){.icons{grid-template-columns:repeat(8,minmax(0,1fr))!important}.norm{min-height:29px!important;height:29px!important}.norm .symbol{width:24px!important;height:24px!important;min-width:24px!important;min-height:24px!important}}

/* v1.4 — compact icon cluster and dock arrows */
.tools{padding:2px 4px!important;display:flex;justify-content:center;align-items:center;min-height:35px!important;overflow:visible!important}
.dock-inner{display:flex;gap:7px;align-items:center;justify-content:center;width:max-content;max-width:100%}
.icons{display:grid!important;grid-template-columns:repeat(8,32px)!important;gap:2px!important;width:max-content!important}
.norm,.norm:nth-child(3n),.norm:nth-child(5n){width:32px!important;height:31px!important;min-height:31px!important;background:transparent!important;padding:1px!important;flex:0 0 auto}
.dock-arrows{display:flex;gap:2px;align-items:center;flex:0 0 auto}
.dock-arrows button{border:1px solid #c5dce2;border-radius:4px;background:#f4f9fb;color:#22516b;min-width:23px;width:23px;height:26px;padding:0;line-height:1;font-size:15px;font-weight:700}
.dock-arrows button:hover{background:#d9f2f6}
.tools .controls{display:none!important}
.tooltip{position:fixed!important;bottom:55px!important;right:15px!important;left:auto!important;transform:none!important;max-width:310px;z-index:10000!important}
main.pos-left .tools,main.pos-right .tools{display:flex;align-items:flex-start;padding:4px 1px!important}
main.pos-left .dock-inner,main.pos-right .dock-inner{flex-direction:column;gap:5px;width:100%}
main.pos-left .icons,main.pos-right .icons{grid-template-columns:32px!important;grid-template-rows:repeat(8,31px)!important;gap:2px!important;width:32px!important}
main.pos-left .dock-arrows,main.pos-right .dock-arrows{display:grid;grid-template-columns:repeat(2,23px);gap:2px;justify-content:center}
main.pos-left,main.pos-right{grid-template-columns:54px minmax(0,1fr)!important}
main.pos-right{grid-template-columns:minmax(0,1fr) 54px!important}
@media(max-width:520px){.icons{grid-template-columns:repeat(8,27px)!important}.norm,.norm:nth-child(3n),.norm:nth-child(5n){width:27px!important}.dock-inner{gap:3px}.dock-arrows button{width:20px;min-width:20px}}

/* v1.5: constrain every icon to its own square; no stretching */
.tools{flex:0 0 auto!important}
.dock-inner{flex:0 0 auto!important;width:auto!important;max-width:100%!important}
.icons{display:flex!important;flex-direction:row!important;align-items:center!important;justify-content:flex-start!important;gap:3px!important;flex:0 0 auto!important;width:auto!important}
.icons>.norm{display:flex!important;width:32px!important;min-width:32px!important;max-width:32px!important;height:32px!important;min-height:32px!important;max-height:32px!important;flex:0 0 32px!important;background:transparent!important;box-sizing:border-box!important}
.icons>.norm>.symbol{width:28px!important;min-width:28px!important;height:28px!important;min-height:28px!important;flex:0 0 28px!important;border-radius:50%!important}
main.pos-left .icons,main.pos-right .icons{flex-direction:column!important;gap:2px!important}
main.pos-left .dock-inner,main.pos-right .dock-inner{align-items:center!important}
.norm:focus-visible{outline:2px solid #168ea8!important;outline-offset:0!important}
.dock-arrows{display:flex!important;flex-direction:row!important;gap:2px!important}
main.pos-left .dock-arrows,main.pos-right .dock-arrows{display:grid!important;grid-template-columns:repeat(2,22px)!important}
.tooltip{display:none!important}
#hoverPanel{display:none;position:fixed;top:12px;right:14px;z-index:2147483000;background:#123550;color:white;padding:11px 13px;max-width:310px;width:max-content;border-radius:9px;box-shadow:0 5px 18px #0005;font:14px/1.45 Arial,sans-serif;pointer-events:none}
#hoverPanel.show{display:block}
#hoverPanel strong{display:block;margin-bottom:3px}
@media(max-width:600px){.icons{gap:1px!important}.icons>.norm{width:28px!important;min-width:28px!important;max-width:28px!important;flex-basis:28px!important}}
</style></head>
<body><header><h1>🔬 SciSims Presentation Player</h1><label for="source">Google Slides URL</label><input id="source" aria-label="Google Slides URL" placeholder="Paste a viewable Google Slides presentation URL"><button id="load">Open slides</button><button id="external">Open in Google Slides ↗</button><button id="fullHeader">Fullscreen</button><label for="position">Icons</label><select id="position"><option value="bottom">Bottom</option><option value="top">Top</option><option value="left">Left</option><option value="right">Right</option></select></header>
<div id="hoverPanel" role="tooltip"></div><main id="fs"><div class="viewer"><iframe id="slides" title="Embedded Google Slides presentation" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe><div class="notice">Use the navigation provided by Google Slides inside the player. If an organisation blocks embedding, choose <b>Open in Google Slides</b> instead. <a href="https://support.google.com/docs/answer/183965" target="_blank" rel="noopener">Embedding guidance</a></div></div>
<section class="tools" id="tools"><h2>Student Engagement Norms</h2><div class="dock-inner"><div id="icons" class="icons"></div><div class="dock-arrows" aria-label="Move engagement toolbar"><button type="button" data-dock="left" title="Move icons left" aria-label="Move icons left">←</button><button type="button" data-dock="top" title="Move icons to top" aria-label="Move icons to top">↑</button><button type="button" data-dock="bottom" title="Move icons to bottom" aria-label="Move icons to bottom">↓</button><button type="button" data-dock="right" title="Move icons right" aria-label="Move icons right">→</button></div></div><div id="pinned" class="pinned" role="status" aria-live="polite"></div>
<div class="controls"><button id="clear" title="Close the pinned explanation">Dismiss explanation</button><button id="full">Fullscreen</button><small>Slide navigation is handled by Google's embedded presentation controls.</small></div></section></main>
<script>
(()=>{'use strict';
const initial='https://docs.google.com/presentation/d/1hhI-VUzYS7TPWGgVCJMHd3MI6sLxxECNaA442bkaUAE/edit';
const norms=[
['👄','Pronounce With Me','Say the important word aloud with your teacher. Practise saying it clearly and use it accurately in a sentence.'],
['◉','Track With Me','Follow the words, diagram or demonstration that the teacher is referring to. Be ready to identify the relevant detail.'],
['ABC','Read With Me','Read the selected words aloud together, paying attention to accuracy and meaning.'],
['✋','Gesture With Me','Use the agreed hand gesture to represent the idea. Explain what the movement means.'],
['👥','Pair-Share','Turn to your partner and discuss the question. Explain your thinking, listen carefully and prepare a shared response.'],
['!!!','Attention Signal','Stop, look towards the teacher and listen for the next instruction.'],
['▣','Whiteboards','Write or draw your response on your mini-whiteboard. Show it when requested so the teacher can check understanding.'],
['▤','Complete Sentences','Respond in a complete sentence that communicates your reasoning and uses appropriate subject vocabulary.']];
let original=initial;let selected=-1;const $=id=>document.getElementById(id);
function parseSlides(url){const m=url.match(/(?:docs\.google\.com\/presentation\/d\/|\/d\/)([A-Za-z0-9_-]{20,})/);return m?m[1]:null}
function openSlides(){const raw=$('source').value.trim();const id=parseSlides(raw);if(!id){alert('Paste a Google Slides link containing /presentation/d/…');return}original=raw;$('slides').src='https://docs.google.com/presentation/d/'+id+'/embed?start=false&loop=false&delayms=3000';location.hash='deck='+encodeURIComponent(id)}
$('source').value=initial;$('load').onclick=openSlides;$('source').addEventListener('keydown',e=>{if(e.key==='Enter')openSlides()});$('external').onclick=()=>window.open(original,'_blank','noopener,noreferrer');
const wrap=$('icons');norms.forEach((n,i)=>{const b=document.createElement('button');b.className='norm';b.type='button';b.setAttribute('aria-label',n[1]+': '+n[2]);b.setAttribute('aria-pressed','false');const icon=document.createElement('span');icon.className='symbol';icon.textContent=n[0];const tip=document.createElement('span');tip.className='tooltip';tip.innerHTML='<strong></strong><span></span>';tip.querySelector('strong').textContent=n[1];tip.querySelector('span').textContent=n[2];b.append(icon,tip);b.onmouseenter=()=>{const p=$('hoverPanel');p.replaceChildren();const heading=document.createElement('strong');heading.textContent=n[1];const desc=document.createElement('span');desc.textContent=n[2];p.append(heading,desc);p.classList.add('show')};b.onmouseleave=()=>{$('hoverPanel').classList.remove('show')};b.onblur=()=>{$('hoverPanel').classList.remove('show')};b.onclick=()=>{selected=selected===i?-1:i;update()};wrap.append(b)});
function update(){[...wrap.children].forEach((b,i)=>{b.classList.toggle('active',i===selected);b.setAttribute('aria-pressed',String(i===selected))});const box=$('pinned');box.classList.toggle('visible',selected>=0);box.replaceChildren();if(selected>=0){const title=document.createElement('strong');title.textContent=norms[selected][1];const detail=document.createElement('div');detail.textContent=norms[selected][2];const close=document.createElement('button');close.className='close-panel';close.textContent='×';close.setAttribute('aria-label','Close explanation');close.onclick=()=>{selected=-1;update()};box.append(title,detail,close)}}
$('clear').onclick=()=>{selected=-1;update()};$('position').onchange=()=>{const p=$('position').value;$('fs').className='pos-'+p;localStorage.setItem('scisims-player-position',p)};let saved=localStorage.getItem('scisims-player-position')||'bottom';if(!['top','bottom','left','right'].includes(saved))saved='bottom';$('position').value=saved;$('fs').className='pos-'+saved;$('full').onclick=()=>{if(!document.fullscreenElement){$('fs').requestFullscreen?.()}else document.exitFullscreen?.()};
$('fullHeader').onclick=()=>{if(!document.fullscreenElement){$('fs').requestFullscreen?.()}else document.exitFullscreen?.()};
document.querySelectorAll('[data-dock]').forEach(b=>b.addEventListener('click',()=>{const p=b.dataset.dock;$('position').value=p;$('position').dispatchEvent(new Event('change'))}));
const h=location.hash.match(/deck=([A-Za-z0-9_-]+)/);if(h)$('source').value='https://docs.google.com/presentation/d/'+h[1]+'/edit';
openSlides();
})();
</script></body></html>
