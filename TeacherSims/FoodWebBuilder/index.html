for(const [a,b] of d.links){const [x,y]=pos[a],[xx,yy]=pos[b],length=Math.hypot(xx-x,yy-y),inset=Math.min(length*.45,Math.min(54/Math.max(Math.abs(xx-x)/length,.001),(innerWidth<550?42:30)/Math.max(Math.abs(yy-y)/length,.001))+6),tx=xx-(xx-x)/length*inset,ty=yy-(yy-y)/length*inset,sx=x+(xx-x)/length*inset,sy=y+(yy-y)/length*inset;html+='<path data-from="'+a+'" data-to="'+b+'" class="edge '+(a===d.removed||b===d.removed?'removed':'')+'" d="M'+sx+' '+sy+'L'+tx+' '+ty+'" marker-end="url(#arrow)"/>'}html+='</svg>'+ids.map(id=>'<button class="node '+(selected===id?'selected ':'')+(d.removed===id?'removed ':d.solved&&!reach.has(id)?'no-route':'')+'" data-node="'+id+'" style="left:'+pos[id][0]/6+'%;top:'+pos[id][1]/4.3+'%" aria-pressed="'+(selected===id)+'" '+(d.solved?'disabled':'')+'><span aria-hidden="true">'+w.icons[id]+'</span><span>'+w.names[id]+'</span></button>').join('')+'</div><p class="key">Arrows point food → eater. Highlighted nodes after a removal have no route from the producer in this model; that is not a prediction of certain extinction.</p><div class="actions"><button class="primary" id="verify" '+(d.solved?'disabled':'')+'>Check web</button><button id="hint" '+(d.solved||d.hints>=3?'disabled':'')+'>Hint</button><button id="undo" '+(!undoStack.length||d.solved?'disabled':'')+'>Undo</button><button id="reset">'+(d.solved?'Replay':'Clear links')+'</button></div><div id="feedback" class="feedback" role="status" aria-live="polite"></div>';
if(d.solved){html+='<div class="well"><h3>Disturbance lab</h3><p>Remove an organism to trace which energy routes remain. This tests this simplified network, not real population sizes.</p><div class="remove-row"><select id="removal" aria-label="Organism to remove"><option value="">No removal</option>'+ids.map(id=>'<option value="'+id+'" '+(d.removed===id?'selected':'')+'>'+w.names[id]+'</option>').join('')+'</select><button id="applyRemoval">Apply</button></div><p>'+ (d.removed===null?'All organisms are present.':w.names[d.removed]+' is removed. Surviving routes from '+w.names[0]+': '+ids.filter(id=>id!==d.removed&&reach.has(id)).map(id=>w.names[id]).join(', ')+'.')+'</p></div><div class="question"><h3>'+ (stage()===3?'With '+w.names[w.remove]+' removed, what directly changes?':'Why do the arrows point this way?')+'</h3><div class="choices">'+answerOrder().map(j=>'<button data-answer="'+j+'" '+(d.quiz||d.wrong.includes(j)?'disabled':'')+' class="'+(d.quiz&&j===0?'correct':'')+'">'+options()[j]+'</button>').join('')+'</div></div>';if(stage()===3)html+='<div class="question"><h3>Investigation 2 · Which remaining organisms lose every route from the producer?</h3><p class="small">Use the web with '+w.names[w.remove]+' removed. A missing route in this model is not a prediction of certain extinction.</p><div class="choices">'+answerOrder().slice().reverse().map(j=>'<button data-route="'+j+'" '+(d.secondQuiz||d.secondWrong.includes(j)?'disabled':'')+' class="'+(d.secondQuiz&&j===0?'correct':'')+'">'+routeOptions()[j]+'</button>').join('')+'</div></div>'}html+='<div class="actions"><button class="primary" id="next" '+(!rec?'disabled':'')+'>'+ (S.level===23?'Return to meadow':'Next challenge')+'</button></div></section><aside class="sidebar"><section class="panel"><h3>Field guide</h3><p>Use only the feeding relationships specified here. Real food webs contain more organisms and links.</p><button id="fullGuide" '+(d.fullGuide||stage()===0?'disabled':'')+'>'+(d.fullGuide||stage()===0?'Full guide shown':'Reveal full guide · costs 1 hint')+'</button><div class="guide">'+(stage()===0||d.fullGuide?ids.map(id=>'<div><b>'+w.names[id]+'</b><span>'+observation(id)+'</span></div>').join(''):'<p>Read individual field observations above the web. Reading observations is free. Revealing this full summary counts as a hint.</p>')+'</div></section><section class="panel"><h3>Your best</h3><div class="badge">'+(rec?'★'.repeat(rec.stars)+'☆'.repeat(3-rec.stars):'☆☆☆')+'</div><p>Complete the web to save progress. For three stars, use no hints, make at most two incorrect claims and answer each investigation on your first try. Disturbance challenges require both investigations before unlocking the next round.</p><p>One hint caps the result at two stars; two or more cap it at one.</p><div class="links">'+d.links.map(([a,b],j)=>'<button data-remove="'+j+'" '+(d.solved?'disabled':'')+' aria-label="Remove link '+w.names[a]+' to '+w.names[b]+'">'+w.names[a]+' → '+w.names[b]+' · Remove</button>').join('')+'</div></section><section class="panel"><h3>Beyond the diagram</h3><p class="note">Decomposers recycle nutrients from dead organisms and waste. They are omitted here to keep the feeding puzzle readable. Energy flows through ecosystems and is eventually transferred to the surroundings; it is not recycled like matter.</p><p>These are teaching webs with stated relationships. Removing a species can cause indirect and uncertain changes in real ecosystems.</p></section></aside></div>';$('game').innerHTML=html;renderNotice();persist()}
function choose(i){if(i<0||i>=24||!unlocked(i))return;S.level=i;selected=null;notice=null;undoStack=[];render()}
$('game').onclick=e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.web!==undefined)choose(Number(b.dataset.web)*4);else if(b.dataset.level!==undefined)choose(Number(b.dataset.level));else if(b.dataset.node!==undefined)connect(Number(b.dataset.node));else if(b.id==='verify')verify();else if(b.id==='next')choose((S.level+1)%24);else if(b.id==='undo'){if(undoStack.length)draft().links=undoStack.pop();notice=null;selected=null;render()}else if(b.id==='hint'){const d=draft(),edge=required().find(([a,b])=>!has(a,b));if(edge&&d.hints<3){d.hints++;message('Field hint',ecosystem().names[edge[1]]+' eats '+ecosystem().names[edge[0]]+'. Draw the energy arrow from food to eater.');render()}}else if(b.id==='reset'){const d=draft();if(d.solved)S.rounds[S.level]=fresh();else{undoStack.push(d.links.map(e=>e.slice()));d.links=[]}notice=null;selected=null;render()}else if(b.id==='observe'){draft().observed=Number($('observer').value);render()}else if(b.id==='fullGuide'){draft().fullGuide=true;draft().hints++;render()}else if(b.dataset.route!==undefined){const d=draft(),j=Number(b.dataset.route);if(j===0){d.secondQuiz=true;message('Indirect effect confirmed',routeAnswer(),'good');award()}else{if(!d.secondWrong.includes(j))d.secondWrong.push(j);message('Trace every remaining path','An alternative food source can keep a route connected. Follow arrows from the producer.','bad')}render()}else if(b.id==='applyRemoval'){const value=$('removal').value;draft().removed=value===''?null:Number(value);notice=null;render()}else if(b.dataset.remove!==undefined){const d=draft();undoStack.push(d.links.map(e=>e.slice()));d.links.splice(Number(b.dataset.remove),1);render()}else if(b.dataset.answer!==undefined){const d=draft(),j=Number(b.dataset.answer);if(!d.solved||d.quiz)return;if(j===0){d.quiz=true;message('Science check correct',question(),'good');award()}else{if(!d.wrong.includes(j))d.wrong.push(j);message('Look at the surviving links','Distinguish a direct food-source loss from an uncertain population prediction.','bad')}render()}};render();
